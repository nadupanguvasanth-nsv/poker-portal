<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0c0b;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#f2efe6;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#wrap{position:absolute;left:50%;top:0;transform-origin:top left}
#stage{position:relative;width:390px;height:844px;overflow:hidden;background:#0a0c0b}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #d8b45c;outline-offset:2px}
.disp{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em}
.muted{color:#a3aba5}.gold{color:#d8b45c}
.abs{position:absolute}
.btn{height:52px;border:0;border-radius:12px;background:#d8b45c;color:#14110a;font-size:16px;font-weight:700;letter-spacing:.04em;width:100%}
.btn.ghost{background:transparent;border:1px solid #2a312d;color:#f2efe6;font-size:14px;font-weight:600;height:48px}
.btn.line{background:transparent;border:1px solid #d8b45c;color:#d8b45c}
.btn:disabled{opacity:.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;color:#a3aba5}
.field input{height:48px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:16px;padding:0 14px;font-family:inherit;width:100%}
.card{width:38px;height:54px;border-radius:5px;background:#f2efe6;color:#14110a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;line-height:1.05;flex:none}
.card.red{color:#b3262e}
.card.back{background:repeating-linear-gradient(45deg,rgba(216,180,92,.16) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(216,180,92,.16) 0 2px,transparent 2px 7px),#16201b;border:1px solid #d8b45c;box-shadow:inset 0 0 0 3px #16201b,inset 0 0 0 4px rgba(216,180,92,.5)}
.card.empty{background:transparent;border:1px dashed rgba(191,224,207,.3)}
.card.sm{width:24px;height:34px;font-size:10px;border-radius:3px}
.card.md{width:36px;height:50px;font-size:15px;border-radius:5px}
.hc{position:relative;width:62px;height:86px;transition:transform .14s ease,filter .14s}
.hc .hf{position:absolute;left:0;top:0;display:none}
#hero{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
#hero.up .hf{display:block}
#hero.up .hb{visibility:hidden}
#hero.up .hc{transform:translateY(-14px) scale(1.04);filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}
.card.lg{width:62px;height:86px;font-size:24px;border-radius:7px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.card.win{box-shadow:0 0 0 2px #d8b45c,0 0 14px 3px rgba(216,180,92,.8);animation:wglow 1.3s ease-in-out infinite alternate;position:relative;z-index:2}
.card.dim{opacity:.35}
@keyframes wglow{to{box-shadow:0 0 0 2px #f3d27a,0 0 24px 7px rgba(243,210,122,1)}}
.seat{position:absolute;width:76px;display:flex;flex-direction:column;align-items:center;text-align:center}
.av{position:relative;width:52px;height:52px;border-radius:26px;background:#1b2a22;border:2px solid #2a312d;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px}
.seat.turn .av{border-color:#d8b45c;box-shadow:0 0 0 4px rgba(216,180,92,.25)}
.seat.out{opacity:.45}
.seat.allin .av{border-color:#d2454d}
.badge{position:absolute;left:-12px;top:-4px;width:22px;height:22px;border-radius:11px;background:#d8b45c;color:#14110a;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sname{margin-top:3px;font-size:11px;color:#bfe0cf;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sstack{font-size:12px;font-weight:600}
.pill{height:16px;padding:0 6px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center}
.bet{position:absolute;min-width:30px;height:22px;padding:0 8px;border-radius:11px;background:#0a0c0b;border:1px solid #d8b45c;color:#d8b45c;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.chip{flex:1;height:44px;border:1px solid #2a312d;border-radius:10px;background:#141917;color:#f2efe6;font-size:13px;font-weight:600}
.act{height:56px;border:0;border-radius:12px;font-size:15px;font-weight:700;color:#f2efe6}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:12px;background:#141917;border:1px solid #2a312d}
.sheet{position:absolute;inset:0;background:#0a0c0b;z-index:20;overflow-y:auto;padding:20px 20px 32px;-webkit-overflow-scrolling:touch}
.h2{font-size:12px;font-weight:600;letter-spacing:.1em;color:#a3aba5;margin:22px 0 8px}
.toast{position:absolute;left:20px;right:20px;top:60px;z-index:40;padding:12px 14px;border-radius:12px;background:#2a1417;border:1px solid #d2454d;font-size:13px}
.poster{border-radius:10px;overflow:hidden;border:1px solid #d8b45c;box-shadow:0 12px 28px rgba(0,0,0,.6);flex:none}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.evc{border:1px solid #2a312d;background:#141917;border-radius:16px;padding:14px;margin-top:12px}
.evc.off{opacity:.5}
.pill2{font-size:10px;font-weight:700;letter-spacing:.12em;padding:4px 8px;border-radius:999px;border:1px solid #2a312d;color:#a3aba5;white-space:nowrap}
.pill2.g{border-color:#d8b45c;color:#d8b45c}
.pass{margin-top:12px;border:1px solid #d8b45c;border-radius:14px;padding:14px;background:linear-gradient(135deg,#1d1a0d,#12402f)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;background:#0f1311;border-top:1px solid #2a312d;z-index:30}
.tabs button{flex:1;border:0;background:transparent;color:#a3aba5;font-size:13px;font-weight:600}
.tabs button.on{color:#d8b45c}
.rolechip{height:34px;padding:0 10px;border-radius:17px;border:1px solid #2a312d;background:transparent;color:#a3aba5;font-size:12px;font-weight:600}
.rolechip.on{border-color:#d8b45c;color:#d8b45c;background:rgba(216,180,92,.1)}
@keyframes drin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dr.anim{opacity:0;animation:drin .45s ease forwards}
input[type=range]{width:100%;height:28px;accent-color:#d8b45c;margin:0}
.small{font-size:12px;line-height:1.5}
</style>
</head>

var SYM = {s:'♠︎',h:'♥︎',d:'♦︎',c:'♣︎'};
var $stage = document.getElementById('stage');
var S = {view:null, code:null, token:null, pid:null, es:null, sheet:false, lobbyMode:'join', raiseTo:null, turnKey:'', offset:0, toast:'', online:true, poster:null};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ls(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function fmt(n){return Number(n).toLocaleString('en-US');}

// ---- scale the 390x844 stage to any phone ----
function fit(){
  var w=window.innerWidth,h=window.innerHeight;
  // keep the table clear of the phone's status bar when the app runs full-screen from the home screen
  var inset=0;try{var pr=document.getElementById('sa');if(!pr){pr=document.createElement('div');pr.id='sa';pr.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top)';document.body.appendChild(pr);}inset=parseFloat(getComputedStyle(pr).paddingTop)||0;
    var full=(window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches))||navigator.standalone;
    if(!inset&&full&&/Android/i.test(navigator.userAgent))inset=28;}catch(e){}
  var k=Math.min(w/390,(h-inset)/844);
  var wrap=document.getElementById('wrap');
  wrap.style.transform='translateX(-'+(195*k)+'px) scale('+k+')';wrap.style.top=(inset+Math.max(0,(h-inset-844*k)/2))+'px';
}
window.addEventListener('resize',fit);fit();

// ---- network ----
function api(name,data){
  var body=Object.assign({code:S.code,token:S.token},data||{});
  return fetch('/api/'+name,{method:'POST',body:JSON.stringify(body)}).then(function(r){
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Something went wrong'); return j; });
  });
}
function toast(msg){S.toast=msg;render();clearTimeout(toast.t);toast.t=setTimeout(function(){S.toast='';render();},3500);}
function fail(e){toast(e.message||'Something went wrong');}

function saveSession(){try{localStorage.setItem('poker-session',JSON.stringify({code:S.code,token:S.token,pid:S.pid}));}catch(e){}}
function clearSession(){try{localStorage.removeItem('poker-session');}catch(e){} S.code=S.token=S.pid=null;S.view=null;S.sheet=false;if(S.es){S.es.close();S.es=null;}}

function connect(){
  if(S.es){S.es.close();}
  if(!S.code) return;
  var es=new EventSource('/api/events?code='+encodeURIComponent(S.code)+'&token='+encodeURIComponent(S.token));
  S.es=es;
  es.onmessage=function(ev){
    var v=JSON.parse(ev.data);
    if(v.gone){clearSession();toast(v.text||'You have left the table.');return;}
    S.offset=Date.now()-v.now; S.online=true; S.fails=0;
    var key=v.hand&&v.hand.legal?v.handNo+':'+v.hand.street+':'+v.hand.currentBet:'';
    if(key&&key!==S.turnKey){ S.raiseTo=null; if(navigator.vibrate) navigator.vibrate(120); }
    S.turnKey=key;
    S.view=v; render();
  };
  es.onerror=function(){S.online=false; if(es.readyState===2){ S.fails=(S.fails||0)+1; if(S.fails>=3){clearSession();toast('That table is gone. Join again with a room code.');return;} setTimeout(connect,1500);} render();};
}
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&S.code){connect();requestWake();} });
function requestWake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}}
setInterval(function(){ if(S.code) fetch('/ping').catch(function(){}); },240000);

// ---- peek at your cards: hold to look, quick tap keeps them open ----
function applyUp(){var h=document.getElementById('hero');if(h)h.classList.toggle('up',!!(S.peek||S.lock));}
document.addEventListener('pointerdown',function(e){if(e.target.closest&&e.target.closest('#hero')){S.peek=true;S.pt=Date.now();applyUp();
  if(!ls('sb-peek-hint')){try{localStorage.setItem('sb-peek-hint','1');}catch(x){}}}});
function endPeek(){if(!S.peek)return;S.peek=false;if(Date.now()-S.pt<250)S.lock=!S.lock;applyUp();}
document.addEventListener('pointerup',endPeek);document.addEventListener('pointercancel',endPeek);
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('#hero'))e.preventDefault();});

// ---- helpers ----
function card(c,cls){
  cls=cls||'';
  if(!c||c==='??') return '<div class="card back '+cls+'"></div>';
  var r=c[0]==='T'?'10':c[0], red=(c[1]==='h'||c[1]==='d');
  if(S.win&&S.win[c]) cls+=' win';
  return '<div class="card '+(red?'red ':'')+cls+'"><span>'+r+'</span><span>'+SYM[c[1]]+'</span></div>';
}
function initials(n){return esc(n.replace(/[^A-Za-z0-9 ]/g,'').trim().slice(0,2).toUpperCase()||'?');}
function pickPoster(){
  if(!S.poster){var k=['p1','p2','p3','p4','p5','p6','p7','p8'];S.poster=k[Math.floor(Math.random()*k.length)];}
  return IMG[S.poster];
}

// ---- sessions ----
function two(n){return (n<10?'0':'')+n;}
function sessLeft(se){
  if(!se||!se.no)return '';
  if(se.ended)return 'Game over';
  if(se.ending)return 'Deck change next';
  var ms=se.endsAt+S.offset-Date.now();if(ms<0)ms=0;
  var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return 'S'+se.no+' '+(h?h+':'+two(m)+':'+two(s%60):m+':'+two(s%60));
}
function clock(ts){return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function drawOverlay(v){
  var d=v.session&&v.session.draw;if(!d||S.drawSeen===d.session)return '';
  var anim=S.drawAnim!==d.session;S.drawAnim=d.session;
  var h='<div class="abs" style="inset:0;z-index:50;background:#060807;padding:26px 20px;overflow-y:auto"><div class="gold" style="font-size:12px;font-weight:700;letter-spacing:.2em;text-align:center">SESSION '+d.session+' · SEAT DRAW</div><div class="disp" style="font-size:38px;text-align:center;line-height:1.05;margin-top:6px">Highest card takes the button</div><div class="muted small" style="text-align:center;margin-top:6px">Ace high. Spades, hearts, diamonds, clubs break ties. Seats follow the order of the cards.</div><div style="margin-top:16px">';
  d.cards.forEach(function(c,i){
    var me=c.id===v.you.id;
    h+='<div class="row dr'+(anim?' anim':'')+'" style="margin-bottom:8px;'+(anim?'animation-delay:'+(i*0.35)+'s;':'')+(i===0?'border-color:#d8b45c;background:rgba(216,180,92,.1);':'')+'"><div class="disp gold" style="width:26px;font-size:26px">'+(i+1)+'</div>'+card(c.card,'md')+'<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(me?'You':esc(c.name))+'</div>'+(c.ghost?'<div class="muted small">Left early</div>':'')+'</div>'+(i===0?'<div class="pill2 g">BUTTON</div>':'')+'</div>';
  });
  return h+'</div><button class="btn" style="margin-top:8px" onclick="S.drawSeen='+d.session+';render()">Continue</button></div>';
}

// ---- screens ----
function lobby(){
  var admin=S.lobbyMode==='admin';

function seatXY(rel,n){var a=Math.PI/2+rel/n*2*Math.PI;return {x:CX+RX*Math.cos(a),y:CY+RY*Math.sin(a)};}

function table(){
  var v=S.view,me=v.you,hand=v.hand,n=v.seats.length;

  // felt
  h+='<div class="abs" style="left:45px;top:84px;width:300px;height:420px;border-radius:150px/210px;background:radial-gradient(ellipse at 50% 45%,#176046 0%,#0f3b2c 70%);border:7px solid #2b2017;box-shadow:inset 0 0 0 2px rgba(216,180,92,.35),0 20px 50px rgba(0,0,0,.55)"></div>';
  var pot=hand?hand.pot:0;

  // pot + board
  h+='<div class="abs" style="left:0;top:172px;width:390px;display:flex;flex-direction:column;align-items:center"><div style="font-size:11px;font-weight:600;letter-spacing:.16em;color:#bfe0cf">POT</div><div class="disp gold" style="font-size:38px;line-height:1">'+fmt(pot)+'</div></div>';
  var RES=(v.result&&hand&&hand.finished&&v.result.handNo===v.handNo)?v.result:null;
  S.win=null;
  if(RES&&!RES.uncontested){S.win={};
    if(RES.boardResults&&RES.boardResults.length){RES.boardResults.forEach(function(br){br.winners.forEach(function(x){var hh=br.hands[x.id];if(hh&&hh.best)hh.best.forEach(function(c){S.win[c]=1;});});});}
    else RES.won.forEach(function(x){var r=RES.reveal[x.id];if(r&&r.best)r.best.forEach(function(c){S.win[c]=1;});});}
  var boards=(hand&&hand.boards&&hand.boards.length)?hand.boards:[[]],multi=boards.length>1;
  var bc='';
  if(!multi){for(var i=0;i<5;i++){bc+=(boards[0][i])?card(boards[0][i],(S.win&&!S.win[boards[0][i]])?'dim':''):'<div class="card empty"></div>';}
    h+='<div class="abs" style="left:0;top:246px;width:390px;display:flex;justify-content:center;gap:6px">'+bc+'</div>';}
  else{boards.forEach(function(b){bc+='<div style="display:flex;gap:3px;justify-content:center">';for(var i=0;i<5;i++)bc+=b[i]?card(b[i],'sm'+((S.win&&!S.win[b[i]])?' dim':'')):'<div class="card sm empty"></div>';bc+='</div>';});
    h+='<div class="abs" style="left:0;top:234px;width:390px;display:flex;flex-direction:column;gap:4px">'+bc+'</div>';}
  var stTop=multi?234+boards.length*38+6:312;
  // status line under board
  var status='';
    if(RES&&RES.boardResults&&RES.boardResults.length>1){status=RES.boardResults.length+(RES.boardKind==='runs'?' RUNS':' BOARDS');}
    else if(RES){var w=RES.won.map(function(x){return esc(x.name)+' wins '+fmt(x.amount)+(x.handName?' · '+esc(x.handName):'');});status=w.join('<br>');}
  else if(hand&&!hand.finished){status=(hand.runit?'RUN IT? VOTE':hand.street.toUpperCase())+(hand.variant&&hand.variant!=='holdem'?'<br><span style="color:#d8b45c">'+esc(hand.variantName).toUpperCase()+'</span>':'');}
  h+='<div class="abs" style="left:50px;top:'+stTop+'px;width:290px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.08em;color:'+(RES?'#d8b45c':'#bfe0cf')+';line-height:1.5">'+status+'</div>';
  // seats
  var mySeat=me.seat;
  for(var s=0;s<n;s++){
    var st=v.seats[s]; var rel=(s-mySeat+n)%n; var pos=seatXY(rel,n);
    if(rel===0) continue; // you are drawn at the bottom
    if(!st){ h+='<div class="seat" style="left:'+(pos.x-38)+'px;top:'+(pos.y-26)+'px;opacity:.25"><div class="av" style="border-style:dashed"></div></div>'; continue; }
    var cls='seat'+(st.isTurn?' turn':'')+((st.ghost||st.approved===false||st.away||st.folded||(!st.inHand&&hand&&!hand.finished))?' out':'')+(st.allIn?' allin':'');

    h+='<div class="'+cls+'" style="left:'+(pos.x-38)+'px;top:'+(pos.y-26)+'px">'+
      '<div class="av">'+initials(st.name)+(st.isButton?'<span class="badge">D</span>':'')+(st.connected?'':'<span style="position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:5px;background:#a3aba5;border:2px solid #0a0c0b"></span>')+'</div>'+
      line2+'<div class="sstack">'+fmt(st.stack)+'</div>'+
      (showCards?'<div style="display:flex;gap:2px;margin-top:2px">'+st.cards.map(function(c){return card(c,'sm');}).join('')+'</div>':'')+'</div>';
    if(st.bet>0){var bx=CX+(pos.x-CX)*0.62,by=CY+(pos.y-CY)*0.62;h+='<div class="bet" style="left:'+bx+'px;top:'+by+'px">'+fmt(st.bet)+'</div>';}
  }
  // my cards + label
  var my=v.seats[mySeat];
  var cardsHtml='',shown=false;
  if(my&&my.cards&&my.cards.length){
    var cn=my.cards.length,stp=cn>2?(cn>4?27:34):44,rot=cn>2?7:12,cw=(cn-1)*stp+62;
    shown=!!(S.peek||S.lock)||!!(RES&&RES.reveal&&RES.reveal[me.id]);

  }
  h+=cardsHtml;
  if(cardsHtml&&!shown&&!ls('sb-peek-hint')&&!S.hintShown){S.hintShown=true;setTimeout(function(){toast('Your cards are face down. Hold them to peek, tap to keep them open.');},400);}
  if(my&&my.bet>0){h+='<div class="bet" style="left:195px;top:402px">'+fmt(my.bet)+'</div>';}
  h+='<div class="abs" style="left:0;top:514px;width:390px;display:flex;justify-content:center"><div style="height:26px;padding:0 14px;border-radius:13px;background:#141917;border:1px solid '+(my&&my.isTurn?'#d8b45c':'#2a312d')+';font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px">'+esc(me.name)+(my&&my.isButton?' <span class="gold">D</span>':'')+' <span class="gold">'+fmt(me.stack)+'</span>'+(me.queued?'<span class="muted" style="font-weight:500">+'+fmt(me.queued)+' next hand</span>':'')+'</div></div>';
  h+=specialBar(v);
  h+=actionPanel(v);
  h+=stmtPopup(v);
  h+=drawOverlay(v);
  return h;
}

function specialBar(v){

  if(sp.choice==='none'&&!sp.force)return '';
  var txt=sp.force?'NEXT HAND · '+esc(sp.forceName)+' (requested)':esc(sp.name)+(sp.now?' · this hand':' · in '+sp.nextIn+(sp.nextIn===1?' hand':' hands'));
  return '<div class="abs" style="left:0;top:56px;width:390px;display:flex;justify-content:center;gap:8px;align-items:center"><div style="height:24px;padding:0 10px;border-radius:12px;background:#141917;border:1px solid #2a312d;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#d8b45c;display:flex;align-items:center">'+txt+'</div><button onclick="optIn('+(me.optIn?'false':'true')+')" style="height:24px;padding:0 12px;border-radius:12px;border:1px solid '+(me.optIn?'#d8b45c':'#2a312d')+';background:'+(me.optIn?'#d8b45c':'transparent')+';color:'+(me.optIn?'#1b1608':'#f2efe6')+';font-size:11px;font-weight:700">'+(me.optIn?'Opted in':'Opt in')+'</button></div>';
}
function optIn(on){api('optin',{on:on}).catch(fail);}

function runPanel(v){
  var r=v.hand.runit,me=v.you,mine=r.voters.indexOf(me.id)>=0,mx=r.max||2,b='';

  if(mine){for(var i=1;i<=mx;i++)b+='<button class="btn'+(r.mine===i?'':' ghost')+'" style="height:52px" onclick="doRun('+i+')">'+(i===1?'Once':i===2?'Twice':'Three times')+'</button>';p+='<div style="display:flex;gap:8px;margin-top:14px">'+b+'</div>';}
  else p+='<div class="disp" style="font-size:24px;text-align:center;margin-top:18px">Players are voting</div>';
  return p+'<div class="muted small" style="text-align:center;margin-top:10px">'+r.voted+' of '+r.voters.length+' voted</div></div>';
}
function actionPanel(v){
  var hand=v.hand,L=hand&&hand.legal,me=v.you;
  var p='<div class="abs" style="left:0;top:552px;width:390px;height:292px;background:#0f1311;border-top:1px solid #2a312d;padding:0 20px">';
  if(hand&&!hand.finished&&hand.turnId){
    var turnSeat=v.seats.filter(function(x){return x&&x.id===hand.turnId;})[0];
    p+='<div id="tbar" class="abs" style="left:0;top:-1px;width:0;height:3px;background:#d8b45c"></div>';
  }
  if(hand&&hand.finished&&v.result&&v.result.handNo===v.handNo){
    p+=showdownPanel(v);
  } else if(hand&&hand.runit){
    p+=runPanel(v);
  } else if(L){
    var lo=L.minRaiseTo,hi=L.maxRaiseTo;

      (L.canRaise?'<div class="muted" style="font-size:13px">'+label+' <span id="rval" class="disp" style="font-size:30px;line-height:1;color:#f2efe6;margin-left:4px">'+fmt(S.raiseTo)+'</span></div>':'<div class="muted" style="font-size:13px">Pot '+fmt(L.pot)+'</div>')+'</div>';
    if(L.canRaise){
      p+='<input id="rng" style="margin-top:10px" type="range" aria-label="Raise amount" min="'+lo+'" max="'+hi+'" value="'+S.raiseTo+'" oninput="onRange(this.value)">';
      p+='<div style="margin-top:6px;display:flex;gap:8px">'+
        '<button class="chip" onclick="quick(0.5)">½ pot</button><button class="chip" onclick="quick(0.75)">¾ pot</button><button class="chip" onclick="quick(1)">Pot</button><button class="chip" style="border-color:#d8b45c;color:#d8b45c;font-weight:700" onclick="quick(99)">All in</button></div>';
    } else { p+='<div style="height:82px"></div>'; }
    p+='<div style="margin-top:12px;display:flex;gap:8px">'+
      '<button class="act" style="flex:1;border:1px solid #2a312d;background:transparent" onclick="doAct(\'fold\')">Fold</button>'+
      (L.canCheck?'<button class="act" style="flex:1.2;background:#1d5a43" onclick="doAct(\'check\')">Check</button>':'<button class="act" style="flex:1.2;background:#1d5a43" onclick="doAct(\'call\')">'+(L.toCall>=L.stack?'Call all in ':'Call ')+fmt(L.toCall)+'</button>')+
      (L.canRaise?'<button id="rbtn" class="act" style="flex:1.2;background:#d8b45c;color:#14110a" onclick="doRaise()">'+(allin?'All in '+fmt(S.raiseTo):(L.currentBet===0?'Bet ':'Raise ')+fmt(S.raiseTo))+'</button>':'')+'</div>';
    p+='<div class="muted" style="margin-top:12px;font-size:12px;text-align:center">No-limit · minimum '+(L.currentBet===0?'bet ':'raise to ')+fmt(L.minRaiseTo)+'</div>';
  } else {
    p+='<div style="padding-top:22px;text-align:center">'+waitingBox(v)+'</div>';
  }
  return p+'</div>';
}

function showdownPanel(v){
  var R=v.result,me=v.you,won={};
  R.won.forEach(function(w){won[w.id]=(won[w.id]||0)+w.amount;});
  var ids=Object.keys(R.reveal);
  ids.sort(function(a,b){return (won[b]||0)-(won[a]||0);});
  var p='<div style="padding-top:12px;height:100%;box-sizing:border-box;display:flex;flex-direction:column">'+
    '<div class="gold" style="font-size:12px;font-weight:700;letter-spacing:.14em;text-align:center;flex:none">'+(R.uncontested?'HAND OVER':'SHOWDOWN')+' · HAND '+R.handNo+'</div>';
  if(R.uncontested||!ids.length){
    p+='<div style="padding-top:26px;text-align:center">'+R.won.map(function(w){return '<div class="disp" style="font-size:26px;line-height:1.2">'+(w.id===me.id?'You win':esc(w.name)+' wins')+' <span class="gold">'+fmt(w.amount)+'</span></div>';}).join('')+'<div class="muted small" style="margin-top:8px">Everyone else folded. Cards stay hidden.</div></div>';
    return p+'</div>';
  }
  p+='<div style="margin-top:8px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px;padding-bottom:12px">';
  if(R.variant&&R.variant!=='holdem')p+='<div class="gold small" style="text-align:center;font-weight:700;letter-spacing:.08em;flex:none">'+esc(R.variantName).toUpperCase()+(R.boardKind==='runs'?' · RUN '+R.runs+' TIMES':'')+'</div>';
  if(R.boardResults&&R.boardResults.length>1)p+='<div style="flex:none;padding:8px 10px;border-radius:10px;background:#141917;border:1px solid #2a312d;font-size:13px;line-height:1.5">'+R.boardResults.map(function(br,i){var w=br.winners.map(function(x){var hh=br.hands[x.id];return (x.id===me.id?'You':esc(x.name))+' <b class="gold">+'+fmt(x.amount)+'</b>'+(hh?' <span class="muted">'+esc(hh.handName)+'</span>':'');}).join(' · ');return '<b>'+(R.boardKind==='runs'?'Run ':'Board ')+(i+1)+'</b> '+w;}).join('<br>')+'</div>';
  ids.forEach(function(id){
    var r=R.reveal[id],w=won[id]||0,mine=id===me.id;
    p+='<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;border:1px solid '+(w?'#d8b45c':'#2a312d')+';background:'+(w?'rgba(216,180,92,.1)':'#141917')+';flex:none">'+

function waitingBox(v){var x=waitingBox0(v);return x?x+waitActions(v):x;}
function waitingBox0(v){
  var hand=v.hand,me=v.you,msg='';
  if(v.session.ended){return '<div class="disp" style="font-size:28px">The game is over</div><div class="muted small" style="margin:6px 0 14px">Thanks for playing.</div>'+(v.settlement?mySettle(v)+'<div class="muted small" style="margin:0 0 12px">'+(me.member?'Your full statement for the whole game is being sent to your WhatsApp.':'Your full statement for the whole game is ready.')+'</div><button class="btn" style="margin-bottom:8px" onclick="getStatement()">Download my full statement (PDF)</button><button class="btn ghost" style="margin-bottom:8px" onclick="S.sheet=true;render()">My statement</button>':'')+(me.can.start?'<button class="btn" onclick="doStart()">Start a new game</button>':'');}
  if(me.ghost){return '<div class="disp" style="font-size:28px">You left early</div><div class="muted small" style="margin:6px 0 0">Your seat keeps paying blinds until the end of session '+me.ghostUntil+(me.ghostEndsAt?' (about '+clock(me.ghostEndsAt)+')':'')+'. The admin can release you early in an emergency.</div>';}
  if(me.approved===false){return '<div class="disp" style="font-size:28px">Waiting for the admin</div><div class="muted small" style="margin:6px 0 0">The admin decides whether to let you in now that the game has started.</div>';}
  if(me.away){return '<div class="disp" style="font-size:28px">You are sitting out</div><div class="muted small" style="margin:6px 0 14px">You are skipped until you come back. Your chips stay safe.</div><button class="btn" onclick="api(\'back\').catch(fail)">I\'m back</button>';}
  var el=v.seats.filter(function(s){return s&&s.stack>0;}).length;
  if(me.stack<=0&&!me.inHand&&!me.queued){
    return '<div class="disp" style="font-size:28px">You need chips</div><div class="muted small" style="margin:6px 0 14px">'+(me.isAdmin?'You are the banker. Buy in for yourself first.':'Ask the banker for chips. They will approve your request.')+'</div><button class="btn" onclick="S.sheet=true;render()">Buy in</button>';
  }
  if(!v.running){
    if(me.can.start) return '<div class="disp" style="font-size:28px">'+(v.handNo?'Game paused':'Ready when you are')+'</div><div class="muted small" style="margin:6px 0 14px">'+el+' player'+(el===1?'':'s')+' with chips. You need at least 2.</div><button class="btn" '+(el<2?'disabled':'')+' onclick="doStart()">'+(v.handNo?'Resume the game':'Start the game')+'</button>';
    return '<div class="disp" style="font-size:28px">Waiting for the admin</div><div class="muted small" style="margin-top:6px">The game starts when the admin is ready.</div>';
  }
  if(hand&&!hand.finished){
    var t=v.seats.filter(function(x){return x&&x.id===hand.turnId;})[0];
    var mine=v.seats[me.seat];
    if(mine&&mine.folded) msg='You folded. Waiting for the hand to finish.';
    else if(!me.inHand) msg=(hand&&hand.variant&&hand.variant!=='holdem')?'Sitting out this '+esc(hand.variantName)+' hand.':'Waiting for the next hand.';
    else if(mine&&mine.allIn) msg='You are all in.';
    else msg=t?'Waiting for '+esc(t.name)+'.':'';
    return '<div class="disp" style="font-size:28px">'+msg+'</div>';
  }
  if(el<2) return '<div class="disp" style="font-size:28px">Waiting for players</div><div class="muted small" style="margin-top:6px">At least 2 players need chips.</div>';
  return '<div class="disp" style="font-size:28px">Next hand starting</div>';
}

function onRange(x){S.raiseTo=Number(x);var r=document.getElementById('rval');if(r)r.textContent=fmt(S.raiseTo);var L=S.view.hand.legal;var b=document.getElementById('rbtn');if(b)b.textContent=(S.raiseTo>=L.maxRaiseTo?'All in ':(L.currentBet===0?'Bet ':'Raise '))+fmt(S.raiseTo);}
function quick(f){
  var L=S.view.hand.legal;
  var target=f>=99?L.maxRaiseTo:Math.round(L.currentBet+f*(L.pot+L.toCall));

  var r=document.getElementById('rng');if(r)r.value=S.raiseTo;onRange(S.raiseTo);
}

function chart(hist){
  if(!hist||hist.length<2) return '';

  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals); if(hi===lo){hi+=1;lo-=1;}
  var xs=function(i){return L+(W-L-R)*i/(vals.length-1);},ys=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo));};
  var pts=vals.map(function(v,i){return xs(i).toFixed(1)+','+ys(v).toFixed(1);}).join(' ');
  var marks='',n=0;
  hist.forEach(function(x,i){if(x.kind==='deck'){n++;marks+='<line x1="'+xs(i).toFixed(1)+'" x2="'+xs(i).toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#d8b45c" stroke-width="1" stroke-dasharray="3 3"/><text x="'+(xs(i)+3).toFixed(1)+'" y="'+(T-4)+'" fill="#d8b45c" font-size="9" font-weight="700">DC'+x.session+'</text>';}});
  var rows='';hist.forEach(function(x){if(x.kind==='deck')rows+='<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid #2a312d"><span class="muted">Deck change '+x.session+'</span><span style="font-weight:700">'+fmt(x.stack)+'</span></div>';});
  return '<div style="margin-top:8px;padding:12px;border-radius:12px;background:#141917;border:1px solid #2a312d"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Stack after each hand'+(n?' <span class="muted" style="font-weight:400">· gold lines mark deck changes</span>':'')+'</div><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Line chart of your stack after each hand with deck changes marked">'+marks+'<polyline points="'+pts+'" fill="none" stroke="#f2efe6" stroke-width="2.5" stroke-linejoin="round"/></svg><div style="display:flex;justify-content:space-between" class="muted small"><span>Low '+fmt(lo)+'</span><span>High '+fmt(hi)+'</span></div>'+(rows?'<div style="margin-top:8px">'+rows+'</div>':'')+'</div>';
}

  if(ev.done)h+='<div class="muted small" style="margin-top:10px">This game has ended.</div>';
  if(!ev.cancelled&&!ev.done){
    if(ev.my==='invited'&&ev.auto)h+='<div class="muted small" style="margin-top:10px">Seats go first come, first served. Tap In and you sit down with the minimum buy-in of '+fmt(ev.settings.minBuyin)+'.</div><div style="display:flex;gap:10px;margin-top:10px"><button class="btn" style="height:48px" onclick="rsvp(\''+ev.id+'\',\'in\')">I\'m in</button><button class="btn ghost" style="height:48px" onclick="rsvp(\''+ev.id+'\',\'out\')">I\'m out</button></div>';
    else if(ev.my==='invited')h+='<button class="btn" style="margin-top:12px;height:46px" onclick="interest(\''+ev.id+'\',true)">I\'m interested</button>';
    if(ev.my==='waitlist')h+='<div class="muted small" style="margin-top:10px">The table is full. You are number '+ev.wait+' on the waiting list and get a seat if someone drops out.</div><button class="btn ghost" style="margin-top:8px;height:42px" onclick="rsvp(\''+ev.id+'\',\'out\')">I\'m out</button>';
    if(ev.my==='interested')h+='<div class="muted small" style="margin-top:10px">You are on the list. The admin will allot seats.</div><button class="btn ghost" style="margin-top:8px;height:42px" onclick="interest(\''+ev.id+'\',false)">Withdraw</button>';
    if(ev.my==='declined')h+='<div class="muted small" style="margin-top:10px">'+(ev.auto?'You are out.':'No seat this time.')+'</div>'+(ev.auto?'<button class="btn ghost" style="margin-top:8px;height:42px" onclick="rsvp(\''+ev.id+'\',\'in\')">Change to In</button>':'');
    if(ev.my==='approved'||ev.my==='owner'){
      h+='<div class="pass"><div class="gold" style="font-size:11px;font-weight:700;letter-spacing:.16em">'+(ev.my==='owner'?'YOUR TABLE':'TABLE ALLOTTED')+'</div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><div class="muted small">'+(ev.my==='owner'?ev.approvedCount+' of '+(ev.seats-1)+' guest seats filled':'Starts in')+'</div><div class="disp gold" style="font-size:30px" data-count="'+ev.startAt+'">'+until(ev.startAt)+'</div></div>'+
        ((soon||ev.tableOpen||ev.my==='owner')?'<button class="btn" style="margin-top:10px" onclick="enterGame(\''+ev.id+'\')">Join table</button>':'<button class="btn" style="margin-top:10px" disabled>Opens 15 minutes before the start</button>')+'</div>';
    }
  }
  if(ev.manage&&!ev.cancelled&&!ev.done){
    var open=S.manage===ev.id,waiting=(ev.people||[]).filter(function(p){return p.state==='interested';}).length;
    h+='<button class="btn ghost" style="margin-top:10px;height:42px" onclick="S.manage='+(open?'null':'\''+ev.id+'\'')+';render()">'+(open?'Hide':'Manage')+' · '+waiting+' waiting · '+ev.approvedCount+' seated</button>';
    if(open){
      (ev.people||[]).forEach(function(p){
        var msg='Table allotted! '+ev.title+', '+when(ev.startAt)+'. Open Smart Buddies: '+location.origin;
        var mem=(cv.members||[]).filter(function(x){return x.id===p.id;})[0],inv='';
        if(ev.auto&&mem&&p.phone&&p.state==='invited'){var L=location.origin+'/r/'+mem.token+'/'+ev.id+'/';inv='<a class="rolechip on" style="display:flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" href="'+waLink(p.phone,'Smart Buddies: you are invited to '+ev.title+', '+when(ev.startAt)+'. Seats go first come, first served.\nIN: '+L+'in\nOUT: '+L+'out')+'">Invite on WhatsApp</a>';}
        h+='<div class="row" style="margin-top:8px;flex-wrap:wrap"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">'+esc(p.name)+'</div><div class="muted small">'+({invited:'Not replied',interested:'Interested',approved:'In',waitlist:'Waiting list',declined:ev.auto?'Out':'No seat'}[p.state]||p.state)+'</div></div>'+
          '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">'+
          inv+(p.state!=='approved'?'<button class="rolechip on" onclick="decide2(\''+ev.id+'\',\''+p.id+'\',\'approve\')">Allot seat</button>':'<button class="rolechip" onclick="decide2(\''+ev.id+'\',\''+p.id+'\',\'reset\')">Take back</button><a class="rolechip" style="display:flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" href="'+waLink(p.phone,msg)+'">WhatsApp</a>')+
          (p.state==='interested'||p.state==='invited'?'<button class="rolechip" onclick="decide2(\''+ev.id+'\',\''+p.id+'\',\'decline\')">No seat</button>':'')+'</div>'+(cv.me.isOwner&&p.state==='approved'?'<div style="flex-basis:100%;margin-top:6px"><div class="muted" style="font-size:11px;letter-spacing:.08em;margin-bottom:6px">POWERS FOR THIS GAME ONLY</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+cv.roles.map(function(r){return '<button class="rolechip'+((p.roles||[]).indexOf(r)>=0?' on':'')+'" onclick="toggleRole(\''+ev.id+'\',\''+p.id+'\',\''+r+'\')">'+ROLE_LABEL[r]+'</button>';}).join('')+'</div></div>':'')+'</div>';
      });
      h+='<button class="btn ghost" style="margin-top:10px;height:42px;border-color:#6b2a2e;color:#d2454d" onclick="cancelEv(\''+ev.id+'\')">Cancel this game</button>';
    }
  }
  return h+'</div>';
}
function newEvForm(cv){
  var h='<div class="evc" style="border-color:#d8b45c"><div class="disp" style="font-size:26px">New game</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">'+
    dfield('c_title','NAME','Friday night','maxlength="40"')+dfield('c_when','DATE AND TIME (EMPTY = START NOW)','','type="datetime-local"')+
    '<div style="display:flex;gap:8px">'+dfield('c_sb','SMALL','25','inputmode="numeric"')+dfield('c_bb','BIG','50','inputmode="numeric"')+dfield('c_seats','SEATS','10','inputmode="numeric"')+'</div>'+
    '<div style="display:flex;gap:8px">'+dfield('c_ts','TIMER (S)','40','inputmode="numeric"')+dfield('c_sm','SESSION (MIN)','120','inputmode="numeric"')+'</div><div style="display:flex;gap:8px">'+dfield('c_mn','MIN BUY-IN','1000','inputmode="numeric"')+dfield('c_mb','MAX BUY-IN','10000','inputmode="numeric"')+'</div>'+
    '<div class="h2" style="margin:4px 0 0">WHO IS INVITED</div><div style="display:flex;gap:8px"><button class="rolechip'+(S.inv==='all'?' on':'')+'" onclick="S.inv=\'all\';render()">All members</button><button class="rolechip'+(S.inv==='pick'?' on':'')+'" onclick="S.inv=\'pick\';render()">Pick members</button></div>';
  if(S.inv==='pick')h+='<div style="display:flex;flex-wrap:wrap;gap:6px">'+(cv.members||[]).map(function(m){return '<button class="rolechip'+(S.pick[m.id]?' on':'')+'" onclick="S.pick[\''+m.id+'\']=!S.pick[\''+m.id+'\'];render()">'+esc(m.name)+'</button>';}).join('')+'</div>';
  return h+'<button class="btn" onclick="doCreateEv()">Create and invite</button><button class="btn ghost" onclick="S.formOpen=false;render()">Close</button></div></div>';
}
function linkCard(){
  var n=S.newLink;if(!n)return '';var url=linkFor(n.token);
  return '<div class="evc" style="border-color:#d8b45c"><div class="gold" style="font-size:11px;font-weight:700;letter-spacing:.14em">'+(n.own?'SAVE YOUR ADMIN LINK':'LINK FOR '+esc(n.name).toUpperCase())+'</div><div class="muted small" style="margin-top:6px">'+(n.own?'This link signs you in as the admin on any phone. Keep it private and save it somewhere safe.':'Send this private link to '+esc(n.name)+'. Opening it signs them in on their phone.')+'</div><div style="margin-top:8px;padding:10px;border-radius:10px;background:#0a0c0b;border:1px solid #2a312d;font-size:12px;word-break:break-all">'+esc(url)+'</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn line" style="height:44px;font-size:14px" onclick="copyText(\''+url+'\')">Copy</button>'+(n.own?'':'<a class="btn" style="height:44px;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none" target="_blank" rel="noopener" href="'+waLink(n.phone,'Your private link for Smart Buddies poker: '+url)+'">WhatsApp</a>')+'<button class="btn ghost" style="height:44px" onclick="S.newLink=null;render()">Done</button></div></div>';
}
function gamesTab(cv){
  var h=linkCard();
  if(cv.me.manage)h+=S.formOpen?newEvForm(cv):'<button class="btn" style="margin-top:14px" onclick="S.formOpen=true;render()">+ New game</button>';
  if(!cv.events.length)h+='<div class="evc"><div class="muted small">No games scheduled yet.'+(cv.me.manage?'':' You will see invitations here.')+'</div></div>';
  cv.events.forEach(function(ev){h+=evCard(ev,cv);});
  h+='<div class="h2">ALERTS</div><div class="muted small">You get a buzz and a sound about a minute before play while the app is open.</div><button class="btn ghost" style="margin-top:8px;height:44px" onclick="enableAlerts()">'+(pushState()==='on'?'Push notifications are on':'Turn on phone notifications')+'</button>'+(S.iosHelp&&pushState()==='ios'?'<div class="evc" style="margin-top:8px;border-color:#d8b45c"><div class="gold" style="font-size:11px;font-weight:700;letter-spacing:.14em">ON IPHONE: TWO STEPS</div><div class="muted small" style="margin-top:6px;line-height:1.5">1. In Safari tap the Share button, then Add to Home Screen.<br>2. Open Smart Buddies from the new icon on your Home Screen, go to Games and tap this button again. Notifications only work from the icon.</div></div>':'');
  return h;
}
function historyTab(cv){
  var h='<div class="h2">PAST GAMES</div>',hs=cv.history||[];
  if(!hs.length)return h+'<div class="muted small">Finished games appear here with their settlements.</div>';
  hs.forEach(function(g){
    var open=S.histOpen===g.id,tot=g.people.reduce(function(a,x){return a+(x.net>0?x.net:0);},0);
    h+='<div class="evc" style="margin-top:8px"><button onclick="S.histOpen='+(open?'null':'\''+g.id+'\'')+';render()" style="width:100%;text-align:left;background:transparent;border:0;padding:0;color:inherit"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><div class="disp" style="font-size:24px;line-height:1.1">'+esc(g.title)+'</div><div class="muted small">'+esc(g.code)+'</div></div><div class="muted small">'+new Date(g.at).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})+' · '+g.people.length+' players · '+g.sessions+' session'+(g.sessions===1?'':'s')+' · blinds '+fmt(g.sb)+'/'+fmt(g.bb)+' · '+fmt(tot)+' changed hands</div></button>';
    if(open){
      h+='<div style="margin-top:10px;border-top:1px solid #2a312d;padding-top:8px">';
      g.people.slice().sort(function(a,b){return b.net-a.net;}).forEach(function(p){h+='<div style="display:flex;gap:8px;font-size:14px;padding:3px 0"><span style="flex:1">'+esc(p.name)+'</span><span class="muted small" style="align-self:center">in '+fmt(p.invested)+' · out '+fmt(p.final)+'</span><b style="min-width:64px;text-align:right;color:'+(p.net>0?'#7ddba0':p.net<0?'#f08a8f':'#f2efe6')+'">'+(p.net>0?'+':p.net<0?'−':'')+fmt(Math.abs(p.net))+'</b></div>';});
      h+='<div class="h2" style="margin-top:12px">SETTLEMENT</div>'+(g.transfers.length?g.transfers.map(function(x){return '<div style="display:flex;justify-content:space-between;font-size:14px;padding:3px 0"><span>'+esc(x.from)+' pays '+esc(x.to)+'</span><b class="gold">'+fmt(x.amount)+'</b></div>';}).join(''):'<div class="muted small">Everyone finished even.</div>');
      h+='<button class="rolechip" style="margin-top:12px;color:#d2454d;border-color:#6b2a2e" onclick="delGame(\''+g.id+'\')">Remove from history</button></div>';
    }
    h+='</div>';
  });
  return h;
}
function delGame(id){if(!confirm('Remove this game from the history?'))return;capi('deletegame',{id:id}).then(function(){S.histOpen=null;}).catch(fail);}
function membersTab(cv){
  var h=linkCard(),own=cv.me.isOwner;
  if(own){h+='<div class="evc"><div class="disp" style="font-size:26px">Add a member</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">'+dfield('m_name','NAME','','maxlength="14" placeholder="Nickname at the table"')+dfield('m_phone','PHONE (OPTIONAL, FOR WHATSAPP)','','inputmode="tel" placeholder="+91..."')+'<button class="btn" onclick="doAddMember()">Register and get link</button></div></div>';}
  h+='<div class="h2">MEMBERS ('+(cv.members||[]).length+')</div>';
  (cv.members||[]).forEach(function(m){
    h+='<div class="evc" style="margin-top:8px"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:15px;font-weight:700">'+esc(m.name)+'</div><div class="muted small">'+esc(m.phone||'No phone')+'</div></div>'+(own?'<div style="display:flex;gap:6px"><button class="rolechip" onclick="S.newLink={name:\''+esc(m.name)+'\',phone:\''+esc(m.phone)+'\',token:\''+m.token+'\'};render()">Link</button><button class="rolechip" onclick="newLinkFor(\''+m.id+'\')">New link</button><button class="rolechip" style="color:#d2454d;border-color:#6b2a2e" onclick="removeMember(\''+m.id+'\',\''+esc(m.name)+'\')">Remove</button></div>':'')+'</div>';
    if(own){h+='<div class="muted small" style="margin-top:10px">Powers are handed out per game: open a game under Games, tap Manage, and use the Powers buttons under an allotted member, or give them from the table menu during play. They end when that game ends.</div>';}
    h+='</div>';
  });
  if(own)h+='<div class="h2">BACKUP</div><div class="muted small" style="margin-bottom:8px">Everything about the club lives in one file in Google Drive. Keep your own copy as well. The backup holds everyone\'s sign-in links, so keep it private.</div><button class="btn ghost" style="height:46px" onclick="downloadBackup()">Download a backup</button><label class="btn ghost" style="height:46px;margin-top:8px;display:flex;align-items:center;justify-content:center;cursor:pointer">Restore from a backup file<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this)"></label>';
  return h;
}
function clubScreen(){
  var cv=S.cv,me=cv.me;
  var h='<div class="sheet" style="padding-bottom:96px">'+(S.view?'<button class="btn" style="margin-bottom:14px" onclick="S.toClub=false;render()">Back to the table</button>':'')+'<div style="display:flex;align-items:center;justify-content:space-between"><div style="min-width:0"><div class="muted small" style="letter-spacing:.14em">'+esc(cv.club.name).toUpperCase()+'</div><div class="disp" style="font-size:36px;line-height:1.05">Hi, '+esc(me.name)+'</div></div>'+(me.isOwner?'<div class="pill2 g">ADMIN</div>':'')+'</div>';
  if(me.isOwner&&cv.storage&&/^file/.test(cv.storage))h+='<div class="evc" style="border-color:#d8b45c"><div class="gold" style="font-size:11px;font-weight:700;letter-spacing:.14em">TEMPORARY STORAGE</div><div class="muted small" style="margin-top:6px">Club data is only kept on the server and is lost when it restarts. Connect the Google Drive storage to keep it safe.</div></div>';
  if(cv.saveError)h+='<div class="evc" style="border-color:#d2454d"><div style="font-size:13px">Club data could not be saved: '+esc(cv.saveError)+'</div></div>';
  h+=(S.tab==='history'&&me.isOwner)?historyTab(cv):(S.tab==='members'&&me.manage)?membersTab(cv):gamesTab(cv);
  h+='</div><div class="tabs"><button class="'+(S.tab==='games'?'on':'')+'" onclick="S.tab=\'games\';render()">Games</button>'+(me.manage?'<button class="'+(S.tab==='members'?'on':'')+'" onclick="S.tab=\'members\';render()">Members</button>':'')+(me.isOwner?'<button class="'+(S.tab==='history'?'on':'')+'" onclick="S.tab=\'history\';render()">History</button>':'')+'<button onclick="S.quick=true;render()">Quick table</button><button onclick="if(confirm(\'Leave the club on this phone? You can come back with your link.\')){clubForget();render();}">Sign out</button></div>';
  return h;
}
function alertBar(){
  var a=S.alert;if(!a)return '';var rem=a.kind==='reminder';
  return '<div class="abs" style="left:12px;right:12px;top:12px;z-index:60;padding:12px 14px;border-radius:14px;background:#1c1608;border:1px solid #d8b45c;box-shadow:0 10px 30px rgba(0,0,0,.6)"><div class="gold" style="font-size:11px;font-weight:700;letter-spacing:.14em">'+(rem?'STARTING SOON':a.kind==='allotted'?'TABLE ALLOTTED':a.kind==='invite'?'INVITATION':'NOTICE')+'</div><div style="font-size:14px;margin-top:4px">'+esc(a.text)+'</div><div style="display:flex;gap:8px;margin-top:10px">'+(rem&&a.eventId&&!S.view?'<button class="btn" style="height:42px;font-size:14px" onclick="enterGame(\''+a.eventId+'\')">Join table</button>':'')+'<button class="btn ghost" style="height:42px" onclick="S.alert=null;render()">'+(rem&&!S.view?'Later':'OK')+'</button></div></div>';
}
// countdowns and the local backup reminder
setInterval(function(){
  if(S.view&&S.view.session){var se=document.querySelectorAll('[data-sess]');for(var j=0;j<se.length;j++){var tx=se[j].parentNode&&se[j].parentNode.className==='muted small'?sessLeft(S.view.session).replace(/^S\d+ /,''):sessLeft(S.view.session);se[j].textContent=tx;}}
  var els=document.querySelectorAll('[data-count]');for(var i=0;i<els.length;i++)els[i].textContent=until(Number(els[i].getAttribute('data-count')));
  if(!S.cv)return;
  var key='';S.cv.events.forEach(function(ev){
    var left=ev.startAt-Date.now();
    if(left<=15*60000&&left>-6*3600000)key+=ev.id+',';
    if((ev.my==='approved'||ev.my==='owner')&&!ev.cancelled&&left<=60000&&left>-600000&&!S.localReminded[ev.id]){onNotice({kind:'reminder',text:ev.title+' starts in about a minute. Tap Join table.',eventId:ev.id,startAt:ev.startAt});}
  });
  if(key!==S.joinKey){S.joinKey=key;if(!S.view)render();}
},1000);

// ---- render ----
function render(){
  var active=document.activeElement&&document.activeElement.id, keep=null;
  if(active&&/^(room|nick|sb|bb|ts|mb|sm|bamt|s_sb|s_bb|s_ts|s_sm|c_\w+|m_\w+|su_\w+)$/.test(active)){keep={id:active,v:document.activeElement.value,s:document.activeElement.selectionStart};}
  // typing in a field must never be wiped by a live update: skip re-render while an input is focused
  if(keep&&S.view&&S.sheet&&/^(bamt|s_sb|s_bb|s_ts|s_sm)$/.test(keep.id)) return;
  if(keep&&!S.view&&/^(c_|m_|su_)/.test(keep.id)) return;
  var old=document.querySelector('.sheet'),sc=old?old.scrollTop:0;
  var h=(S.view&&!(S.toClub&&S.mtoken&&S.cv))?(table()+(S.sheet?sheet():'')):((S.mtoken&&S.cv&&!S.quick)?clubScreen():((S.mtoken&&!S.cv&&!S.quick)?'<div class="abs muted" style="inset:0;display:flex;align-items:center;justify-content:center">Opening the club...</div>':lobby()));
  h+=alertBar();
  if(S.toast) h+='<div class="toast">'+esc(S.toast)+'</div>';
  $stage.innerHTML=h;
  var nw=document.querySelector('.sheet');if(nw)nw.scrollTop=sc;if(S.focusNote&&nw){var nh=document.getElementById('noteh');if(nh)nw.scrollTop=nh.offsetTop-20;S.focusNote=0;}
  if(keep){var e=document.getElementById(keep.id);if(e){e.value=keep.v;e.focus();try{e.setSelectionRange(keep.s,keep.s);}catch(x){}}}
}
// countdown bar for the player whose turn it is
setInterval(function(){
  var b=document.getElementById('tbar'); if(!b||!S.view||!S.view.hand||!S.view.hand.deadline)return;
  var total=S.view.settings.turnSeconds*1000, left=S.view.hand.deadline+S.offset-Date.now();
  b.style.width=Math.max(0,Math.min(1,left/total))*390+'px';
},250);

// ---- start up ----
(function(){
  var hs=(location.hash.match(/^#s=([A-Z0-9]+):([a-f0-9]+):([a-f0-9]+)$/)||[]);
  if(hs.length){S.code=hs[1];S.token=hs[2];S.pid=hs[3];saveSession();history.replaceState(null,'',location.pathname);connect();render();return;}
  var mq=new URLSearchParams(location.search).get('m');
  if(mq&&/^[a-f0-9]+$/.test(mq)){setMember(mq);var qs=new URLSearchParams(location.search);qs.delete('m');history.replaceState(null,'',location.pathname+(qs.toString()?'?'+qs.toString():''));}
  if(S.mtoken)clubConnect();
  fetch('/api/club/status',{method:'POST',body:'{}'}).then(function(r){return r.json();}).then(function(j){S.clubExists=j.exists;S.needsCode=j.needsSetupCode;if(!S.view)render();}).catch(function(){});
  try{var s=JSON.parse(localStorage.getItem('poker-session')||'null'); if(s&&s.code&&s.token){S.code=s.code;S.token=s.token;S.pid=s.pid;connect();requestWake();}}catch(e){}
  render();
})();
</script>
</body>
</html>
