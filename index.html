*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0c0b;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#f2efe6;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#wrap{position:absolute;left:0;top:0;transform-origin:top left}
/* Reads the phone's safe area - the notch, the Dynamic Island, the home bar - so fit() can keep
   the portal clear of them. Measured off this rather than guessed. */
#safe{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* A phone held sideways leaves so little height that everything shrinks past reading size. Better
   to ask for it the right way up than to show a table nobody can read. */
#turn{display:none;position:fixed;inset:0;z-index:999;background:#0a0c0b;color:#f2efe6;
align-items:center;justify-content:center;text-align:center;padding:24px}
#stage{position:relative;width:390px;height:844px;overflow:hidden;background:#0a0c0b;
  --f1:#1a6a4d;--f2:#13543e;--f3:#0d3326;--rail:#2b2017;--deep:#16201b;--av:#1b2a22}
/* The table can be dressed differently without touching anything that has to stay readable: the
   cards keep their white, the chips their gold, the names their contrast. Only the cloth, the
   rail and the dark backing behind the card backs and the faces change. */
#stage[data-felt="claret"]{--f1:#7a2634;--f2:#5c1b26;--f3:#330f16;--rail:#2a1a16;--deep:#1f1216;--av:#2a181d}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #d8b45c;outline-offset:2px}
.disp{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em}
.muted{color:#a3aba5}.gold{color:#d8b45c}
.abs{position:absolute}
.btn{height:52px;border:0;border-radius:12px;background:#d8b45c;color:#14110a;font-size:16px;font-weight:700;letter-spacing:.04em;width:100%}
.btn.ghost{background:transparent;border:1px solid #2a312d;color:#f2efe6;font-size:14px;font-weight:600;height:48px}
.btn:disabled{opacity:.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;color:#a3aba5}
.field input{height:48px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:16px;padding:0 14px;font-family:inherit;width:100%}
.card{position:relative;width:38px;height:54px;border-radius:5px;background:#fff;color:#15130f;font-weight:700;font-size:14px;line-height:1;flex:none;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
.cf{position:absolute;left:0;top:0;width:100%;height:100%;fill:currentColor}
.card.red{color:#d0202a}
body.four .card.s-d{color:#1f5fd0}
body.four .card.s-c{color:#1c8a3c}
.card.za{width:68px;height:96px;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.6)}
.card.zb{width:56px;height:79px;border-radius:7px;box-shadow:0 5px 12px rgba(0,0,0,.6)}

.card.empty{background:transparent;border:1px dashed rgba(191,224,207,.3)}
.card.sm{width:24px;height:34px;font-size:13px;border-radius:3px}
/* The sizes below are never written as a literal class anywhere - card(c, 'xl') builds them at
   run time - so searching the page for class="xl" finds nothing and they look unused. They are
   not. cardsizetest.js checks every size the code asks for has a rule here. */
.card.md{width:36px;height:50px;font-size:17px;border-radius:5px}
.card.xl{width:86px;height:120px;font-size:32px;border-radius:9px;box-shadow:0 8px 18px rgba(0,0,0,.55)}
.hc{position:relative;width:70px;height:98px;transition:transform .14s ease,filter .14s}
.hc .hf{position:absolute;left:0;top:0;display:none}
#hero{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
#hero.up .hf{display:block}
#hero.up .hb{visibility:hidden}
#hero.up .hc{transform:translateY(-14px) scale(1.04);filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}
.card.win{box-shadow:0 0 0 2px #d8b45c,0 0 14px 3px rgba(216,180,92,.8);animation:wglow 1.3s ease-in-out infinite alternate;position:relative;z-index:2}
.card.dim{opacity:.35}
@keyframes wglow{to{box-shadow:0 0 0 2px #f3d27a,0 0 24px 7px rgba(243,210,122,1)}}
.felt{border-radius:167px/128px;background:radial-gradient(ellipse at 50% 42%,var(--f1) 0%,var(--f2) 60%,var(--f3) 100%);border:7px solid var(--rail);box-shadow:inset 0 0 0 2px rgba(216,180,92,.3),inset 0 14px 30px rgba(0,0,0,.35),0 18px 44px rgba(0,0,0,.55)}
.pmini{position:relative;width:28px;height:28px;border-radius:14px;background:#1b2a22;border:1px solid #2a312d;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;flex:none}
.betchip{display:inline-flex;align-items:center;gap:4px;margin-top:2px;padding:1px 7px 1px 4px;border-radius:9px;background:rgba(10,14,12,.72);border:1px solid #4a4a3a;font-size:11px;font-weight:700;color:#f3e9cf;white-space:nowrap}

.betchip.outl,.betchip.outr{position:absolute;top:14px;margin-top:0;white-space:nowrap}
.betchip.outl{right:calc(100% - 7px)}.betchip.outr{left:calc(100% - 7px)}
.betchip i{width:11px;height:11px;border-radius:7px;background:radial-gradient(circle at 35% 30%,#f0d089,#c69b3c);border:1px solid #8c6a22;display:block;flex:none}
.seat{position:absolute;width:64px;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
/* Out of the flow on purpose: in the flow they pushed the whole seat down, so a player holding
   cards sat lower than the empty seat beside them and names drifted onto the board. */
/* The cards a player turns over sit outside the ring, away from the board, and out of the
   layout so they cannot push the seat off the felt. */
.tbar{z-index:8}
/* The room behind the table, and the player's own half below it in the colour of the cloth.
   Names and chip counts carry a soft dark edge so they read over a picture as they did over
   black; on a dark patch that edge is invisible. */
.room{background:#0a0c0b var(--room,none) no-repeat 0 0/390px 404px}
.mine{background:radial-gradient(120% 80% at 50% 0%,var(--f2),var(--f3) 58%,var(--deep));border-top:2px solid #d8b45c}
.seat .sname,.seat .sstack,.seat .sbh{text-shadow:0 1px 2px #000,0 0 6px #000,0 0 10px rgba(0,0,0,.9)}
.seat .sname{color:#e6f3ec}
.tbar{text-shadow:0 1px 2px #000,0 0 6px #000}
.tbtn{flex:none;width:44px;height:44px;padding:0;border-radius:22px;border:1px solid #3a423d;background:rgba(14,18,16,.82);color:#f2efe6;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.tbtn.off{filter:grayscale(1) opacity(.6)}
.tbtn.lit{border-color:#d8b45c;color:#d8b45c;background:rgba(40,34,16,.9)}
.seat .showc{position:absolute;left:50%;display:flex;transform:translateX(-50%) scale(1)}
/* As big as each seat can take. The seats along the top have only the gap between them and
   the bar at the top to fan into, so theirs are smaller; the ones lower down have the whole
   felt below them and can be read from across the room. */
.seat.up .showc{transform:translateX(-50%) scale(.72)}
.seat.low .showc{transform:translateX(-50%) scale(1.15)}
.seat.up .showc{bottom:100%;margin-bottom:-2px;transform-origin:bottom center}
.seat.low .showc{top:100%;margin-top:-2px;transform-origin:top center}
.seat .showc .card+.card{margin-left:-7px}
/* Turned-over cards have to read against a dark green felt from across the room: a little more
   white than a card in the hand, a hard dark edge so they do not bleed into the felt, and a
   shadow underneath so they sit on top of it rather than in it. */
.seat .showc .card{background:#fffdf6;box-shadow:0 0 0 1.5px rgba(8,11,9,.92),0 4px 10px rgba(0,0,0,.7)}
.seat .showc{filter:saturate(1.06) contrast(1.05)}
/* fanned rather than side by side: narrower, so a neighbour's name stays clear, and it reads
   more like cards held in a hand - which matters most in Omaha, where there are four or five */
.bull{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;cursor:pointer;pointer-events:auto}
.fx{position:absolute;pointer-events:none;z-index:40;font-size:28px;line-height:1;margin:-14px 0 0 -14px}
@keyframes fxfly{0%{transform:translate(0,0) scale(.6) rotate(0);opacity:1}85%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(540deg);opacity:0}}
@keyframes fxpop{0%{transform:scale(.2);opacity:0}15%{opacity:1}35%{transform:scale(1.9);opacity:1}100%{transform:scale(1.2) translateY(-16px);opacity:0}}
@keyframes fxbub{0%{transform:translateY(8px) scale(.4);opacity:0}10%{transform:translateY(0) scale(1.15);opacity:1}15%{transform:scale(1)}85%{opacity:1}100%{transform:translateY(-14px) scale(1);opacity:0}}
/* chips going in: a small stack leaves the player and lands on the pot. Same trick as the thrown
   bombs - the flight is a CSS animation with a negative delay, so a redraw mid-flight picks it up
   where it had got to instead of starting it again from the seat. */
.chipfly{position:absolute;pointer-events:none;z-index:6;margin:-9px 0 0 -9px;width:18px;height:18px}
.chipfly i{display:block;width:18px;height:18px;border-radius:9px;
  background:radial-gradient(circle at 35% 30%,#f3d58f,#c69b3c);
  border:2px solid #8c6a22;box-shadow:0 2px 5px rgba(0,0,0,.55)}
.chipfly b{position:absolute;left:50%;top:20px;transform:translateX(-50%);font-family:'Inter',sans-serif;
  font-size:10px;font-weight:700;color:#f3e9cf;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}
@keyframes chipin{0%{transform:translate(0,0) scale(.5);opacity:0}
  12%{transform:translate(calc(var(--dx)*.12),calc(var(--dy)*.12 - 10px)) scale(1);opacity:1}
  80%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.72);opacity:0}}
.fxbub{background:#141917;border:1px solid #2a312d;border-radius:20px;padding:4px 8px;font-size:30px;margin:-22px 0 0 -26px}
.fxbtn{width:34px;height:34px;border-radius:17px;border:1px solid #2a312d;background:#1b2a22;font-size:20px;line-height:1;padding:0;flex:none}
.av{position:relative;width:52px;height:52px;border-radius:26px;background:var(--av);border:2px solid #2a312d;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px}
.seat.turn .av{border-color:#d8b45c;box-shadow:0 0 0 4px rgba(216,180,92,.25)}
/* A player who has folded or gone is dimmed - but not the cards he chose to turn over. Dimming
   the whole seat dimmed those too, and a child cannot be brighter than the parent it sits in, so
   the one thing everybody is leaning in to look at was the faintest thing on the table. */
.seat.out .av,.seat.out .sname,.seat.out .sstack,.seat.out .sbh,.seat.out .betchip{opacity:.45}
.seat.allin .av{border-color:#d2454d}
.badge{position:absolute;left:-12px;top:-4px;width:22px;height:22px;border-radius:11px;background:#d8b45c;color:#14110a;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sname{margin-top:4px;font-size:11px;color:#bfe0cf;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbh{font-size:9.5px;font-weight:700;line-height:1.2;margin-top:1px}
.sstack{font-size:12px;font-weight:600}
/* the player to act has his circle run down, so the whole table can see the time going */
/* (it stands four pixels proud of the picture, not six: at six its lower edge ran under the

<body>
<div id="safe"></div>
<div id="wrap"><div id="stage"></div><canvas id="sky" width="390" height="844"></canvas><div id="shout"></div></div>
<div id="turn"><div><div class="disp" style="font-size:30px;line-height:1.1">Turn your phone<br>upright</div>
<div class="muted small" style="margin-top:10px;white-space:normal">The table is dealt tall, so it needs the long way up.</div></div></div>
<script>
// all in one SVG so it stays sharp and correctly spaced at every size.
// The card artwork lives in 3-table.js, next to the code that draws the table.


// ---------------------------------------------------------------- the shape of things
// S is everything the screen knows. render() draws S. Nothing else touches the DOM.
var S = { screen: 'signin', tab: 'tables', token: '', me: null, tables: [], history: [], members: [],
          formats: [], variants: [], code: '', v: null, toast: '', busy: false, open: {}, seats: 7,
          openSponsor: {}, showGone: false, groups: [], roster: [], groupEdit: null, study: null, review: null, spot: null };

try { S.token = localStorage.getItem('sb-token') || ''; } catch (e) {}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { return (Math.round(Number(n) || 0)).toLocaleString('en-IN'); }
function kfmt(n) { n = Math.round(Number(n) || 0); return n >= 10000 ? Math.round(n / 1000) + 'k' : fmt(n); }
function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function when(ms) { return new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); }
function clock(ms) { return new Date(ms).toLocaleTimeString([], { timeStyle: 'short' }); }

function toast(msg, bad) { S.toast = msg; S.toastBad = !!bad; render(); clearTimeout(toast.t); toast.t = setTimeout(function () { S.toast = ''; render(); }, 3400); }
function fail(err) { toast(err && err.message ? err.message : 'Something went wrong', true); }
function blurField() { try { var a = document.activeElement; if (a && a.blur && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur(); } catch (e) {} }

function api(name, body) {
  return fetch('/api/' + name, { method: 'POST', body: JSON.stringify(Object.assign({ token: S.token }, body || {})) })
    .then(function (r) { return r.json().then(function (j) {
      // this sign-in is no longer good: he has signed in somewhere else since, or it has run out
      if (r.status === 401 && S.token && j.error === 'Please sign in again') signedOutHere();
      if (!r.ok) throw new Error(j.error || 'Something went wrong');
      return j;
    }); });
}
// One device at a time: signing in on another puts this one back at the door, and says why.
function signedOutHere() {
  if (!S.token) return;
  S.token = ''; try { localStorage.removeItem('sb-token'); } catch (e) {}
  S.me = null; S.screen = 'signin'; S.code = ''; S.v = null; S.signin = null; S.book = false; S.ask = null;
  S.elsewhere = true;
  if (feed) { feed.close(); feed = null; }
  if (typeof tuneMusic === 'function') tuneMusic();
  render();
}

// ---------------------------------------------------------------- the live feed
// "Still here", every few seconds while a table is on the screen. The portal cannot tell a phone
// that has lost its signal from one whose owner is thinking, except by whether it is still
// hearing from it - and on that hangs whether a missed turn is a lapse or a dropped connection.
setInterval(function () {
  if (S.token && S.code && S.screen === 'table' && !document.hidden) api('here', { code: S.code }).catch(function () {});
}, 7000);

var feed = null;
function connect() {
  if (feed) { feed.close(); feed = null; }
  if (!S.token) return;
  var url = '/api/feed?token=' + encodeURIComponent(S.token) + (S.code ? '&code=' + S.code : '');
  feed = new EventSource(url);
  feed.addEventListener('lobby', function (e) { S.tables = JSON.parse(e.data).tables; if (S.screen !== 'table') render(); });
  feed.addEventListener('table', function (e) {
    S.v = JSON.parse(e.data);
    // his turn is over once the table no longer offers him anything to do: the lit button goes out
    // ... and the raise figure goes back to the minimum, so last turn's amount is never waiting
    // under his thumb on the next one
    // ... and it is over just the same when the next thing he sees is a fresh turn of his own:
    // two-handed, the big blind closes the betting before the flop and opens it after
    if (!S.v.legal || S.v.turn !== S.turnKey) {
      S.pressed = null; S.sized = null; S.raiseTo = null;
      // if he was part-way through typing a raise when the turn went, the keyboard goes too
      var typing = document.getElementById('in_raise'); if (typing && document.activeElement === typing) typing.blur();
    }
    S.turnKey = S.v.turn;
    // the phone's clock may be minutes out; keep the difference so the turn ring runs true
    if (S.v.now) S.skew = Date.now() - S.v.now;
    watchActs();            // did somebody just call or raise? flash it on their seat
    watchSaid();            // and has anybody said anything to you?
    watchTalk();            // and did the hand just finished earn a line?
    watchAside();           // and has one of the dogs something to say about it?
    watchTurn();            // and has the turn moved? ring for yours, tick for theirs
    fxIngest(S.v);          // take in anything newly thrown, once, and let it fly
    if (S.screen === 'table') render();
  });
  feed.addEventListener('ended', function () { refresh(); });
  feed.addEventListener('bye', function () { signedOutHere(); });      // signed in on another device
  feed.addEventListener('mail', function () { refresh(); });   // a note came, or a thread was cleared
  feed.onerror = function () { /* the browser reconnects by itself */ };
}
function refresh() {
  return api('me').then(function (j) {
    S.me = j.me; S.fair = !!j.fair; S.tables = j.tables; S.history = j.history; S.members = j.members;
    S.formats = j.formats; S.variants = j.variants; S.plays = j.plays || []; S.tourneyVariants = j.tourneyVariants || []; S.storage = j.storage; S.saveError = j.saveError;
    S.tourney = j.tourney; S.seats = j.seats || S.seats;
    S.games = j.games || S.games; S.ranking = j.ranking || S.ranking;
    S.adminName = j.adminName || S.adminName;
    S.induct = j.induct || null;
    S.groups = j.groups || []; S.roster = j.roster || [];
    S.mail = j.mail || null;
    S.push = j.push; clearBadge();
    if (S.screen === 'signin') S.screen = 'home';
    resumeTable();
    render();
  });
}

function doRename() {
  blurField();
  var name = val('nm_name'), nick = val('nm_nick');
  api('rename', { name: name, nick: nick }).then(function () {
    S.editName = false;
    toast('Saved');
    return refresh();
  }).catch(fail);
}

// ---------------------------------------------------------------- being told things
// A push needs the key as bytes, and it arrives as text.
function keyBytes(b64) {
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

function pushState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'cannot';
  if (!window.isSecureContext) return 'cannot';
  // on an iPhone this only works once the portal is on the home screen
  var standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (iOS && !standalone) return 'homescreen';
  if (Notification.permission === 'denied') return 'blocked';
  return (S.push && S.push.on) ? 'on' : 'off';
}

function pushOn() {
  if (!S.push || !S.push.key) return toast('The portal has no notification key yet', true);
  Notification.requestPermission().then(function (perm) {
    if (perm !== 'granted') return toast('Notifications were not allowed', true);
    return navigator.serviceWorker.ready.then(function (reg) {
      return reg.pushManager.getSubscription().then(function (old) {
        if (old) return old;
        return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(S.push.key) });
      });
    }).then(function (sub) {
      var j = sub.toJSON();
      return api('push-on', { sub: { endpoint: j.endpoint, keys: j.keys } });
    }).then(function () {
      toast('Notifications are on');
      return refresh();
    });
  }).catch(function (e) { toast(String(e && e.message || e), true); });
}

function pushOff() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (sub) { if (sub) sub.unsubscribe(); }).catch(function () {});
  }
  api('push-off', {}).then(function () { toast('Notifications are off'); return refresh(); }).catch(fail);
}

function pushTest() { api('push-test', {}).then(function () { toast('Sent - lock your phone to see it'); }).catch(fail); }

// coming back into the portal clears the number on the icon
function clearBadge() { if (navigator.clearAppBadge) { try { navigator.clearAppBadge(); } catch (e) {} } }

// An app kept on the home screen is not reloaded when you reopen it: the phone puts the page away
// and later hands it back exactly as it was, so none of the start-up code runs again. Without this
// the number would sit on the icon until the next proper sign-in, and the live feed - which does
// not survive being put away - would leave a table frozen on whatever it last showed.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  clearBadge();
  if (!S.token) return;
  if (!feed || feed.readyState === 2) connect();
  // back from a call or another app: say so at once, so a seat that was being held is given back now
  if (S.code && S.screen === 'table') api('here', { code: S.code }).catch(function () {});
  refresh().catch(function () {});
});
window.addEventListener('pageshow', function () { clearBadge(); });

// ---------------------------------------------------------------- getting in
// The joining code, if the invitation link was tapped: it is on the end of the address.
function joinFromLink() {
  try { var j = new URLSearchParams(location.search).get('j') || ''; return /^\d{6}$/.test(j) ? j : ''; } catch (e) { return ''; }
}
function askNumber() {
  blurField();
  var phone = val('in_phone');
  if (phone.replace(/\D/g, '').length < 10) { toast('Your 10-digit mobile number'); return; }
  api('look-up', { phone: phone }).then(function (j) {
    if (!j.known) { toast('That number is not on the list. Ask the admin to add you.'); return; }
    S.signin = { phone: phone, name: j.name, first: j.first, join: !!j.join };
    render();
    setTimeout(function () { var el = document.getElementById('in_pin'); if (el) el.focus(); }, 60);
  }).catch(fail);
}
function doSignIn() {
  blurField();
  var pin = val('in_pin'), again = S.signin.first ? val('in_pin2') : pin;
  if (!/^\d{4}$/.test(pin)) { toast('Four digits'); return; }
  if (pin !== again) { toast('The two passcodes are not the same'); return; }
  var join = S.signin.join ? val('in_join').replace(/\D/g, '') : '';
  if (S.signin.join && join.length !== 6) { toast('The 6-digit joining code from your invitation'); return; }
  S.signin.pin = pin;
  api('sign-in', { phone: S.signin.phone, pin: pin, join: join, device: navigator.userAgent.slice(0, 40) })
    .then(signInReply).catch(fail);
}
// What came back from signing in: through, or one more step. The passcode he typed is held for
// that step and no longer; it is never kept once he is in.
function signInReply(j) {
  if (j.token) {
    S.elsewhere = false;
    var first = j.welcome || (S.signin && S.signin.first);
    S.token = j.token; try { localStorage.setItem('sb-token', j.token); } catch (e) {}
    S.signin = null;
    connect(); refresh();
    if (first) setTimeout(function () { toast('Welcome in. Add this page to your home screen.'); }, 500);
    return;
  }
  if (j.needCode) { S.signin.step = 'code'; S.signin.admin = !!j.admin; }
  else if (j.setup2fa) { S.signin.step = 'setup'; S.signin.setup = j.setup2fa; }
  render();
  setTimeout(function () { var el = document.getElementById(S.signin && S.signin.step === 'code' ? 'in_code' : ''); if (el) el.focus(); }, 60);
}
function doCode(id) {
  var code = codeTyped(id);
  if (code.length !== 6) return toast('The 6-digit code from your authenticator', true);
  blurField();
  api('sign-in', { phone: S.signin.phone, pin: S.signin.pin, code: code, device: navigator.userAgent.slice(0, 40) }).then(signInReply).catch(fail);
}
// The portal admin has nobody to reset his, so the storage secret does it.
function doAdminLost() {
  var secret = val('in_secret');
  if (!secret) return toast('The storage secret', true);
  blurField();
  api('sign-in', { phone: S.signin.phone, pin: S.signin.pin, secret: secret, device: navigator.userAgent.slice(0, 40) })
    .then(function (j) { signInReply(j); if (j.token) setTimeout(function () { toast('You are in, and your old authenticator is cleared. Add a new one from the Me page.'); }, 600); }).catch(fail);
}
function firstAdmin() {
  blurField();
  var d = { secret: val('ad_secret'), name: val('ad_name'), phone: val('ad_phone'), pin: val('ad_pin'), device: navigator.userAgent.slice(0, 40) };
  if (d.pin !== val('ad_pin2')) { toast('The two passcodes are not the same'); return; }
  api('first-admin', d).then(function (j) {
    S.token = j.token; try { localStorage.setItem('sb-token', j.token); } catch (e) {}

}
function signOut() {
  if (!confirm('Sign out of this phone?')) return;
  api('sign-out').catch(function () {});
  S.token = ''; try { localStorage.removeItem('sb-token'); } catch (e) {}

// ---- the five at the table on the sign-in screen ----
// Where each one's head is across the picture (0 left, 1 right) at five moments of the film, a
// quarter of the way apart - the camera drifts, so they do. Doc slides out of the frame in the
// middle of it, and says nothing while he is gone.
var DOGS = [
  { name: 'Ace', at: [0.15, 0.24, 0.24, 0.23, 0.18], lines: ['Deal me in!', "I'm all in. Again.", 'Fortune favours the bold.', 'Any two cards can win!', 'That is how you build a stack.'] },
  { name: 'Captain Coffee', at: [0.31, 0.38, 0.41, 0.41, 0.34], lines: ['Who invited you anyway?', 'Kiss my ace.', 'Thank you for your contribution.', "If you can't spot the sucker at the table, it's you.", 'More chips at the counter, if you need them.'] },
  { name: 'Major', at: [0.52, 0.585, 0.62, 0.62, 0.54], lines: ['Patience pays. Eventually.', 'I fold, I fold, I fold. Then I collect.', 'Never count the pot before the river.', 'Aces. Accept no substitutes.'] },
  { name: 'Duchess', at: [0.69, 0.795, 0.835, 0.835, 0.725], lines: ['The river gives. The river takes.', 'What are we playing next?', 'Some days the deck just likes you.', 'Half a pot is better than a whole lesson.'] },
  { name: 'Doc', at: [0.9, 0.965, 1.1, 0.965, 0.91], lines: ["Trust me. I'm bluffing.", "There's always a shot. You just have to find it.", 'A good fold. Probably.', 'You will never know. That is the beauty of it.'] },
];
var PARTY = { v: null, box: null, tail: null, timer: 0, turn: -1, who: null, since: 0 };
var PARTY_SECS = 10, DOG_SAYS_MS = 4200, DOG_QUIET_MS = 700;
// The film runs forwards and then backwards so that it never jumps; `secs` is where it is.
function dogAt(d, secs) {
  var u = secs % (PARTY_SECS * 2); if (u > PARTY_SECS) u = PARTY_SECS * 2 - u;
  var k = Math.min(3.999, Math.max(0, u / PARTY_SECS * 4)), i = Math.floor(k);
  return d.at[i] + (d.at[i + 1] - d.at[i]) * (k - i);
}
// Called after every redraw. The film is one element kept for the life of the page and put back
// into the frame, so that a redraw does not start it again from the beginning.
function partyOn() {
  var frame = document.getElementById('partyframe');
  if (!frame) {
    if (PARTY.timer) { clearInterval(PARTY.timer); PARTY.timer = 0; }
    if (PARTY.v) PARTY.v.pause();
    return;
  }
  var still = false;
  try { still = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* an old browser: it moves */ }
  if (!PARTY.v && !still) {
    var v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('poster', '/poster.jpg?v=3');
    v.setAttribute('aria-hidden', 'true'); v.preload = 'auto'; v.src = '/party.mp4?v=3';
    PARTY.v = v;
  }
  if (PARTY.v && PARTY.v.parentNode !== frame) frame.appendChild(PARTY.v);
  // The bubble is kept the same way, so that a redraw does not blank what is being said.
  if (!PARTY.box) {
    PARTY.box = document.createElement('div'); PARTY.box.className = 'dogsay'; PARTY.box.id = 'dogsay';
    PARTY.box.innerHTML = '<div class="who"></div><div class="what"></div>';
    PARTY.tail = document.createElement('div'); PARTY.tail.className = 'dogtail'; PARTY.tail.id = 'dogtail';
  }
  var air = document.getElementById('partyair');
  if (air && PARTY.box.parentNode !== air) { air.appendChild(PARTY.box); air.appendChild(PARTY.tail); }
  // A phone saving its battery will not start a film by itself. The picture stays, and they talk.
  if (PARTY.v) { var p = PARTY.v.play(); if (p && p.catch) p.catch(function () {}); }
  if (!PARTY.timer) PARTY.timer = setInterval(partyTick, 100);
  partyTick();
}
function partyTick() {
  var box = PARTY.box, tail = PARTY.tail;
  if (!box || !box.parentNode) return;
  var now = Date.now(), secs = PARTY.v ? PARTY.v.currentTime || 0 : 0;
  if (!PARTY.who || now - PARTY.since > DOG_SAYS_MS + DOG_QUIET_MS || !PARTY.since) {
    // the next one round the table who is in the picture, and a line he did not say last time
    for (var n = 0; n < DOGS.length; n++) {
      PARTY.turn = (PARTY.turn + 1) % DOGS.length;
      if (dogAt(DOGS[PARTY.turn], secs) < 0.93 && dogAt(DOGS[PARTY.turn], secs + DOG_SAYS_MS / 1000) < 0.93) break;
    }
    var d = DOGS[PARTY.turn], pool = d.lines.filter(function (x) { return x !== d.said; });
    d.said = pool[Math.floor(Math.random() * pool.length)];
    PARTY.who = d; PARTY.since = now;
    box.firstChild.textContent = d.name.toUpperCase();
    box.lastChild.textContent = '\u201c' + d.said + '\u201d';
  }
  var on = now - PARTY.since < DOG_SAYS_MS, x = dogAt(PARTY.who, secs), wide = box.parentNode.offsetWidth, w = box.offsetWidth;
  // the tail points up at him; the words stay inside the picture
  tail.style.left = Math.round(x * wide) + 'px';
  box.style.left = Math.round(Math.min(wide - w - 6, Math.max(6, x * wide - w / 2))) + 'px';
  box.className = 'dogsay' + (on ? ' on' : ''); tail.className = 'dogtail' + (on ? ' on' : '');
}

function miniField(id, label, v, attrs) {
  return '<div class="field" style="flex:1;min-width:0"><label for="' + id + '" style="font-size:10px">' + label + '</label>'
    + '<input id="' + id + '" inputmode="numeric" value="' + v + '" ' + (attrs || '')

}

// The chips everyone starts with go in tens of thousands, and the blinds follow from them: two
// hundred big blinds each, which comes out whole and round every time. The admin is shown what a
// figure works out to as he types it, so he is never surprised by the first hand.
function tStack(v) {
  var t = S.tourney || {}, step = t.step || 10000;
  var n = Number(v);
  if (!isFinite(n) || n <= 0) return t.stack || 10000;
  var snapped = Math.round(n / step) * step;
  return Math.min(t.maxStack || 10000000, Math.max(t.minStack || 10000, snapped));
}
function tLevel(v) {
  var t = S.tourney || {}, n = Math.floor(Number(v));
  if (!isFinite(n)) return 5;
  return Math.min(t.maxLevelMin || 60, Math.max(t.minLevelMin || 2, n));
}
function tourneyLine(stack, level) {
  var sb = stack / 400, bb = stack / 200;
  return 'Everybody starts with ' + fmt(stack) + ' chips at ' + fmt(sb) + '/' + fmt(bb)
    + ' &mdash; 200 big blinds each. The blinds double every '
    + (level === 1 ? 'minute' : level + ' minutes') + '.';
}
// As he types. The figures are snapped here too, so what he reads is what he will get.
function tourneyEcho() {
  var el = document.getElementById('t_echo');
  if (el) el.innerHTML = tourneyLine(tStack(val('n_stack')), tLevel(val('n_level')));
}
// Leaving the box puts the snapped figure into it, so nothing says 17,000 while the table is 20,000.
function tourneySnap() {
  var a = document.getElementById('n_stack'), b = document.getElementById('n_level');
  if (a) a.value = tStack(a.value);
  if (b) b.value = tLevel(b.value);
  tourneyEcho();
}
// how the choice of what a tournament plays reads on its button
var PLAY_WORD = { holdem: 'Texas', single: 'One game', mixed: 'Texas + a variant each orbit', roe: 'Round of each' };
function doOpen() {
  blurField();
  var chosen = S.newFormat || 'holdem';
  var play = chosen === 'tournament' ? (S.newPlay || 'holdem') : '';
  if (chosen === 'single' && !S.newVariant) { toast('Pick which game to play', true); return; }
  if ((chosen === 'mixed' || chosen === 'roe') && !S.newVariant) { toast('Pick the variant to go with it'); return; }
  if (play && play !== 'holdem' && !S.newTVariant) { toast(play === 'single' ? 'Pick which game the tournament plays' : 'Pick the variant to go with it', true); return; }
  var body = { format: chosen, variant: chosen === 'tournament' ? (play === 'holdem' ? '' : S.newTVariant) : S.newVariant };
  if (play) body.play = play;
  if (S.newGroup) body.group = S.newGroup;        // opened to his regular crowd rather than anybody
  if (chosen === 'tournament') {
    S.lastStack = tStack(val('n_stack'));
    S.lastLevel = tLevel(val('n_level'));
    body.settings = { stack: S.lastStack, levelMin: S.lastLevel };
  } else {
    // how many it takes to start: his call, between two and the number of seats, and remembered
    S.lastPlayers = Math.max(2, Math.min(S.seats || 7, Math.floor(Number(val('n_players'))) || 4));
    S.lastSb = Number(val('n_sb')); S.lastBb = Number(val('n_bb')); S.lastMin = Number(val('n_min'));
    S.lastStay = Math.max(0, Math.floor(Number(val('n_stay'))) || 0);
    body.settings = { sb: S.lastSb, bb: S.lastBb, minBuyin: S.lastMin, minPlayers: S.lastPlayers,
      turnSeconds: Number(val('n_turn')), minMinutes: S.lastStay };
  }
  api('table-open', body).then(function (j) {
    S.newTable = false;
    S.invite = { code: j.code, text: j.invite };
    refresh();
  }).catch(fail);
}

// How each game is played, written out of the same specification the dealer deals by. Nobody has
// to take this on trust or keep it up to date: if a game is ever changed, this changes with it.
function generalBook() {
  var h = '<div class="sheet" style="z-index:55">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
    + '<div><div class="disp" style="font-size:28px;line-height:1.05">The rule book</div>'
    + '<div class="muted small">How a night works, whatever is being dealt</div></div>'
    + '<button class="rolechip" onclick="S.book=false;render()">Close</button></div>';
  var part = function (title, bits) {
    h += '<div class="evc" style="margin-top:12px"><div class="disp" style="font-size:22px;line-height:1.1">' + title + '</div><div style="margin-top:8px">';
    bits.forEach(function (b) {
      h += '<div style="display:flex;gap:8px;margin-top:5px"><div class="gold" style="flex:none">&middot;</div>'
        + '<div class="muted small" style="white-space:normal">' + b + '</div></div>';
    });
    h += '</div></div>';
  };

  part('Who is who', [
    'Everybody here plays. What separates a <b>primary</b> member from a <b>secondary</b> one is who can get a game going, and who can bring somebody in.',
    'A <b>primary</b> member can start a table, and runs the one he starts: he lets latecomers in, decides who may leave early, can break for food, call the last few hands or set a time to finish, and closes it at the end.',
    'A <b>primary</b> member can also bring people in - up to ten at a time. Whoever he brings in waits for the portal admin to let them in, and comes in secondary.',
    'A <b>primary</b> member can keep groups - the people he sits down with regularly - and open a table to one of them. They take a free seat as they would anywhere. Everybody else still sees the table and sees whose game it is, and asks to come in; whoever runs it lets them in as a guest or does not. The portal admin is kept out of nothing.',
    'A <b>secondary</b> member plays. Every table, every seat, every game, the same as anybody else. What he cannot do is start one or bring somebody in.',
    'Only the portal admin makes anybody primary, or takes it away again. A primary member cannot make another.',
    'Only the portal admin takes anybody out of the portal.',
  ]);

  part('Bringing somebody in', [
    'A primary member puts a name and a mobile number forward. The portal writes a message for the group - who is being brought in, by whom, and what he is taking on - and he posts it, so everybody hears about it before anything is decided.',
    'The group has its say, and then the portal admin lets them in or turns them away.',
    'Nothing is sent to the new person until the portal admin has let them in - so nobody\u2019s first go at the portal is being refused at the door.',
    'Once they are in, whoever put them forward sends them the message to sign in. That message carries the rules of the table as well as the link, because passing the rules on is the job.',
    'The message also carries a six-digit joining code. A new member needs it once, the first time he signs in, to choose his passcode - so knowing somebody\u2019s number is not enough to become them. It is seen only by the portal admin and whoever brought the member in, and a passcode that is reset needs a fresh one.',
    'Five wrong passcodes and the account is locked: five minutes the first time, then half an hour, two hours, and a day at a time after that.',
    'Ten at a time is the limit, counting anybody still waiting. Somebody taken out, or made primary, frees the place.',
    'Whoever brings somebody in is answerable for them: that they know how the table works and how the game is played here.',
    'If a primary member is made secondary, the people he brought in become the portal admin\u2019s. Who first brought them in stays on the record.',
  ]);

  part('Getting a game going', [
    'A primary member can start a table, and whoever starts it runs it. Several can run at once. Everybody else plays in them - the portal admin decides who is which, and tells you if he changes yours.',
    'Starting one gives you a message to paste into the group chat.',
    'Before play, take a free seat from the list. The table deals itself once enough of you are sitting down with chips - nobody presses anything, and it says so a few seconds before it does.',
    'Whoever opens a table sets that number, anything from two to seven, and he is one of it: a table opened for four deals when three more have joined him. Somebody sitting out, or with no chips, is not counted. It will not start short of the number.',
    'If somebody stands up again before it deals, it stops and says why rather than going quiet.',
    'Tap the cards in the middle of the table to see them large for a moment. The table menu has a switch for a four-colour deck - clubs green, diamonds blue - and a button that tests the sound and tells you what your phone says about it.',
    'The same menu is where you choose the room your table stands in - Card room, Rooftop or Club library - and its cloth, Emerald or Claret. That is your own phone only; everybody else keeps what they chose.',
    'Music is off until you turn it on with the note button at the top of the table, and it plays on your phone alone. It is kept quiet so the bell for your turn is always heard, and it stops when you leave the table.',
    'When a hand earns it, the winner gets a line across the bottom of the table - table talk. It is chosen only from what everybody has already seen, so it gives nothing away, and you can turn it off for your own phone in the table menu. One of the five dogs from the sign-in screen turns up beside it - Ace, Captain Coffee, Major, Duchess or Doc - and Captain Coffee and Duchess pass the odd remark of their own when somebody sits down mid-game or the game changes.',
    'Whoever runs a table can pause it and start it again. Every clock stops with it - the time to act, the minimum time you agreed to stay, and in a tournament the blinds - so a break costs nobody anything. Only a set finishing time stays where it is, because that is a time of day.',
    'The number a table is opened for is only for starting. Once the first hand is dealt it carries on as long as two players have chips.',
    'A tournament is the exception: it has no starting number and never starts by itself. Only the member who opened it has the Start button - nobody else, the portal admin included - and he starts it when he judges enough have sat down. Nobody joins once it has begun. It is play or fold - nobody sits out of one - and whoever runs it can pause it, blinds and all.',
    'Any of the variants can be a table of its own - Single game - with that game dealt every hand and no Texas in between. And a tournament need not be Texas: whoever opens it can make it one variant throughout, Texas with a variant each orbit, or round of each. The one thing a tournament does not play is a bomb pot.',
    'Arrive after it has started and you ask to come in; whoever runs the table lets you in or does not.',
    'You can watch a running game without taking a seat, and be offered one from inside the room.',
  ]);

  part('At the table', [
    'Seven seats, first come first served.',
    'While you wait for your turn there is a Check / Fold button. Press it and, when the turn reaches you, you check if nobody has bet and fold if somebody has. It stays lit while it is set, lasts for that hand only, and a second tap takes it back.',
    'Whatever you press on your turn stays lit until your turn is over, so you can see that it took.',
    'Nothing waits on a tap that never comes: run out of time on your turn and you check if you can and fold if you cannot. Once costs you that hand and nothing more. Twice running and you are sat out until you say otherwise.',
    'Losing your connection is not sitting out. If your phone drops off the table, the hand you were in is checked or folded for you - or, if your chips were all in, it simply plays out and your stack shows the result - and you are left out of the deal until your phone is back. The moment it is, you are in the next hand without having to ask. If you had chosen to sit out before it dropped, you come back still sitting out.',
    'In a tournament nobody is sat out or left out of the deal: miss two turns, or lose your connection, and you stay dealt in, paying your blinds, with your hands folded after a moment until you are back.',
    'However long a table asks you to stay, your time runs from when <b>you</b> sat down, not from when the game began.',
    'The minimum time holds only a player who is ahead - with more in front of him than the chips he took. It is there to stop somebody winning a pot and leaving with it, not to keep anybody at the table losing. If you are level or down you may leave whenever you like, without asking.',
    'If you are ahead there are two ways out before your time is up: whoever runs the table lets you go, or you sit in the ring paying your blinds - posted and folded, never dealt - until your time is up or you are no longer ahead.',
    'Chips taken while a hand is being played go on when that hand ends, never in the middle of it.',
    'If somebody is all-in for less than the bets around him, the rest goes into a side pot that only the players who paid into it can win. He can win no more than he put in, matched by everybody still in the hand.',
    'Showing your cards can be chosen at any point in a hand, but only happens once the hand is over.',
    'A hand nobody folded is settled by the cards. A pot four times the usual, quads or a straight flush puts fireworks over the table.',
  ]);

  part('Saying something', [
    'Nobody types at a table. There is a list of things worth saying and you tap one - back in five minutes, deal me out, one more orbit, nice hand, I need to leave early.',
    'It lands at the bottom of the other person\u2019s screen for five seconds and then goes.',
    'Some of them do the thing as well as say it: asking to leave early raises the real request, and taking more chips, sitting out and coming back happen on the tap. A tournament has no sitting out and no taking more chips, so those are not on its list.',
    'Whoever runs the table has his own list - starting in a minute, your turn, taking a break, wrapping up.',
  ]);

  part('When the game ends', [
    'Whoever runs the table closes it, and a hand in progress is always played out first.',
    'He can also call the last five or ten hands, or set a time to finish, at any point during the game.',
    'Everybody\u2019s score for the night is the chips he finished with less the chips he took: up or down, in chips, to the chip.',
    'That is all the portal records about a night: chips taken, chips at the end, and the difference.',
    'The night is filed with the date and time. You see the games you played in, with your own score, the chips hand by hand, and your running total across every game.',
    'A game where no hand was ever dealt leaves no record: everybody still holds the chips they took.',
  ]);

  part('Chips only', [
    'Smart Buddies is played with virtual chips, for recreation among friends. Chips have no money value and cannot be bought, sold or cashed through the portal.',
    'The record of a night is a chip score, and your running total is those scores added up. The accounts, score sheets and standings show chip counts and nothing else.',
    'The portal takes no stake, fee or commission, holds no money and makes no payments. It does not work out, record or follow anything between members.',
    'The app developer and the portal admin are not liable for what players do outside the game. Anything members arrange among themselves outside the portal is their own affair and their own responsibility, and each member is responsible for following the laws that apply to him.',
    'The portal keeps a count of how the Texas hands are played and what the all-in pots were worth. That record is the portal admin\u2019s alone: no member can open it, his own figures included, and none of it is ever shown while a hand is being played.',
    'Being taken out of the portal does not erase you. Every game you played stays on the record, and you come back as yourself if the portal admin puts you back.',
  ]);

  part('Signing in safely', [
    'An authenticator app adds a second step to signing in: your passcode, then a 6-digit code from the app. With it linked, nobody can sign in as you with your number and four digits alone.',
    'Members added from now on link one the first time they sign in. Everybody else is advised to, from the Me page, and can remove it again.',
    'You are asked for the code only when you sign in - a phone that is already signed in stays signed in.',
    'One device at a time: signing in on a new phone or computer signs you out of the one before, and notifications follow you to the new one once you turn them on there.',
    'If you lose the phone or cannot get a code, the portal admin resets your authenticator and you link it again.',
  ]);

  part('Messages and ownership', [
    'To say something to the portal admin that is not about a hand in progress, use Messages on your Me page. It is a short note, only the two of you see it, and the answer comes back the same way.',
    'You may have three notes waiting for an answer at a time.',
    'The portal and everything in it belongs to its owner. The terms are at the foot of your Me page.',
  ]);

  part('Where the numbers are', [
    'This book is the same whatever is being dealt. The starting chips, the blinds, the time to act, how many it takes to start, and how long you are expected to stay belong to a particular table.',
    'Every table carries its own sheet with its own figures: the (i) beside it in the list, or House rules in the table menu. Those are read from the game as it is being played, so they cannot drift.',
    'What each game deals, which of your cards play, and what beats what are in How the games go.',
  ]);

  return h + '<button class="btn ghost" style="margin-top:16px" onclick="S.book=false;render()">Back</button></div>';
}

function gameBook() {
  var games = S.games || [];
  var h = '<div class="sheet" style="z-index:55">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
    + '<div><div class="disp" style="font-size:28px;line-height:1.05">How the games go</div>'
    + '<div class="muted small">Every game the portal deals, and what beats what</div></div>'
    + '<button class="rolechip" onclick="S.book=false;render()">Close</button></div>';

  games.forEach(function (g) {
    h += '<div class="evc" style="margin-top:12px"><div class="disp" style="font-size:22px;line-height:1.1">' + esc(g.name) + '</div>';
    var bits = [];
    bits.push(g.hole + ' card' + (g.hole === 1 ? '' : 's') + ' to each player, face down');
    if (g.omaha) {
      bits.push(g.hole === 2
        ? 'Both of your cards play, with three from the board'
        : 'Exactly two of your cards play, with three from the board \u2014 no more, no fewer');
      // the hand people argue about: exactly two from hand cuts both ways
      bits.push('So one in your hand with three on the board <b>is</b> four of a kind \u2014 your card and one other, with the three from the board. A pair in your hand with two on the board is four of a kind too.');
      bits.push('But four of a kind lying on the board is only three of a kind to you: you may take three board cards and no more, so the fourth is out of reach and two of your own have to come with it. The same board in Texas would be quads for everybody.');
    } else {
      bits.push('Make the best five from your two and the board, in any combination \u2014 both, one, or neither');
    }
    if (g.boards > 2) {
      bits.push(g.boards + ' separate boards are dealt, each scored on its own');
      bits.push('Every board you win is worth a point, and a board you split is worth a share of one. The most points takes the <b>whole</b> pot \u2014 so you need to be good on two of the three. Win one board while somebody else wins the other two and you get nothing.');
      bits.push('Level on points and the pot is split equally between those who are level \u2014 three players winning a board each take a third apiece');
      bits.push('If somebody is all-in for less, the points are counted again for the side pot among only the players who paid into it. His cards have no claim on chips he did not put in, and a board he would have won goes to the best of the rest.');
    } else if (g.boards > 1) {
      bits.push(g.boards + ' separate boards are dealt, each scored on its own, and the pot is split between them \u2014 win one board and you take half, win both and you take the lot');
    }
    else bits.push('One board: three cards, then one, then one');
    if (g.bomb) bits.push('Everybody antes before the deal and there is no betting before the flop \u2014 the hand starts there');
    else bits.push('Betting before the flop, and after each card that follows');
    bits.push(g.pl
      ? 'Pot-limit: raise anything you like between the minimum and the pot \u2014 and a pot raise means your call first, then the pot as it stands after that call, so with 300 in the middle and 200 to call it comes to 700. The \u00bd pot and \u00be pot buttons work out the amounts for you.'
      : 'No-limit: raise anything from the minimum up to every chip you have');
    bits.push('A card is burned before the flop, before the turn and before the river'
      + (g.boards > 2 && g.hole >= 5 ? '. With seven players this game can run the deck too short to burn at the river - the river cards are then dealt without one' : ', as long as the deck can spare it - the board always comes first'));
    bits.push('Up to ' + Math.min(g.max, S.seats || 7) + ' players in a hand');
    h += '<div style="margin-top:8px">';
    bits.forEach(function (b) {
      h += '<div style="display:flex;gap:8px;margin-top:5px"><div class="gold" style="flex:none">&middot;</div>'
        + '<div class="muted small" style="white-space:normal">' + b + '</div></div>';
    });
    h += '</div></div>';
  });

  var rank = S.ranking || [];
  if (rank.length) {
    h += '<div class="h2" style="margin-top:16px">WHAT BEATS WHAT</div><div class="evc">'
      + '<div class="muted small" style="white-space:normal;margin-bottom:4px">Best first. Every game here is scored the same way.</div>';
    rank.forEach(function (r, i) {
      h += '<div style="padding:5px 0;border-top:1px solid #1d2420;font-size:13px;font-weight:600">' + (i + 1) + '. ' + esc(r) + '</div>';
    });
    h += '</div><div class="muted small" style="white-space:normal;margin-top:8px">A royal flush is the ace-high straight flush - the same hand, and the best there is. Two hands of the same kind are settled by the cards in them, highest first. Still level, and the pot is split.</div>';
  }
  return h + '<button class="btn ghost" style="margin-top:16px" onclick="S.book=false;render()">Back</button></div>';
}

// The rules of a table, written out of the table's own settings rather than typed somewhere and
// left to go stale. Everything here is a real number the game is being played on.
function rulesSheet() {
  var t = (S.tables || []).filter(function (x) { return x.code === S.rules; })[0];
  if (!t) return '<div class="sheet"><div class="muted">That table has gone.</div>'
    + '<button class="btn ghost" style="margin-top:14px" onclick="S.rules=null;render()">Back</button></div>';

  var tourney = t.format === 'tournament';
  var row = function (k, v) {
    return '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #1d2420">'
      + '<div class="muted small" style="flex:none">' + k + '</div>'
      + '<div style="font-size:13px;text-align:right;font-weight:600">' + v + '</div></div>';
  };
  var note = function (txt) { return '<div class="muted small" style="white-space:normal;margin-top:6px">' + txt + '</div>'; };
  // The portal's own figures travel with the table, so this sheet states what the server is
  // actually enforcing tonight rather than what somebody typed in here once.
  var H = t.house || { graceSeconds: 6 };

  var h = '<div class="sheet" style="z-index:55">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
    + '<div><div class="disp" style="font-size:28px;line-height:1.05">House rules</div>'
    + '<div class="muted small">' + esc(t.formatName) + (t.variantName ? ' &middot; ' + esc(t.variantName) : '') + ' &middot; table ' + esc(t.code) + '</div></div>'
    + '<button class="rolechip" onclick="S.rules=null;render()">Close</button></div>';

  h += '<div class="h2">THE CHIPS</div>';
  if (tourney) {
    h += row('Everybody starts with', fmt(t.minBuyin) + ' chips')
      + row('Blinds', fmt(t.blinds.sb) + ' / ' + fmt(t.blinds.bb) + ' at level 1')
      + row('Taking more chips', 'Nobody does');
    h += note('A tournament gives everyone the same chips. The blinds double as the night goes on, nobody joins late and nobody takes more. The last player holding the lot wins.');
  } else {
    h += row('Starting chips', t.maxBuyin >= 1e9 ? fmt(t.minBuyin) + ' or more' : fmt(t.minBuyin) + ' to ' + fmt(t.maxBuyin))
      + row('Blinds', fmt(t.blinds.sb) + ' / ' + fmt(t.blinds.bb))
      + row('Taking more chips', 'Any time');
    h += note('Chips taken while a hand is being played go on when that hand ends, never in the middle of it. You can also ask to be topped up automatically: run out, and ' + fmt(t.minBuyin) + ' goes on at the end of that hand. Until you have chips you are dealt out.');
  }

  h += '<div class="h2">STAYING AND LEAVING</div>';
  h += row('Expected to stay', t.minMinutes ? t.minMinutes + ' minutes' : 'As long as you like');
  if (t.minMinutes) {
    h += note('Your ' + t.minMinutes + ' minutes run from when you sat down, not from when the game began, so arriving late does not mean leaving early. The time holds only a player who is ahead of the chips he took: level, down, or having lost the lot, you may leave whenever you like without asking. If you are ahead there are two ways out before your time is up: ' + esc(t.admin) + ' lets you go, or you sit in the ring paying your blinds - posted and folded, never dealt - until your time is up or you are no longer ahead, and then leave with what is left.');
  } else {
    h += note('Nobody has to ask to leave at this table.');
  }

  h += '<div class="h2">THE PLAY</div>';
  h += row('Seats', t.seats + ', first come first served')
    + (t.format === 'tournament' ? row('Starts', 'when ' + esc(t.admin) + ' starts it') : row('Deals itself at', t.minPlayers + ' players'))
    + row('Time to act', t.turnSeconds + ' seconds');
  if (t.format === 'tournament') {
    h += note('A tournament does not deal itself and has no number to reach. ' + esc(t.admin) + ' starts it when he judges that enough have sat down - '
      + 'it only takes two to play - and from there it is played down to the last one. Nobody joins once it has started. ' + esc(t.admin) + ' can pause it and start it again, and the blinds stand still while it is paused.');
  } else {
    h += note('Nobody has to press anything to begin. Once ' + t.minPlayers + ' of you are sitting down with chips the table says so and deals '
    + (H.graceSeconds ? H.graceSeconds + ' seconds later' : 'straight away')
    + ' - and if somebody stands up again before then it stops and says why. That number is only for getting started: once the first hand is dealt the game carries on as long as two of you have chips. '
    + esc(t.admin) + ' counts as one of the ' + t.minPlayers + ', and anybody sitting out or without chips does not. It will not start short of that number. Anyone arriving after it has started asks to come in.');
  }
  if (t.lastHands) h += row('Still to play', t.lastHands + ' hand' + (t.lastHands === 1 ? '' : 's'));
  if (t.endAt) h += row('Finishing at', clock(t.endAt));
  if (t.format === 'tournament') h += note('It is play or fold: nobody sits out. Run out of time and you check if you can and fold if you cannot. Miss two turns running, or lose your connection, and you stay dealt in, paying your blinds, with your hands folded after a moment until you are back.');
  else h += note('Run out of time on your turn and you check if you can and fold if you cannot. Once costs you the hand; twice running and you are sat out until you say otherwise. If your phone loses the table instead, you are left out of the deal and are back in the next hand the moment it returns - unless you had chosen to sit out, in which case you are still sitting out. Nothing ever waits on a tap that never comes.');
  if (t.play === 'single') h += note('Every hand is ' + esc(t.variantName) + '. There is no Texas in between.');
  if (t.play === 'mixed') h += note('The variant comes round on its own button, travelling the other way: when the deal reaches the seat holding it, that hand is ' + esc(t.variantName) + '.');
  if (t.play === 'roe') h += note('A full orbit of Texas, then a full orbit of ' + esc(t.variantName) + ', turn and turn about.');
  if (t.bombAnteBB && /bomb/i.test(t.variantName || '')) h += note('In a bomb pot everybody antes ' + t.bombAnteBB + ' big blinds and the hand starts on the flop.');

  h += '<div class="h2">SAYING SOMETHING</div>';
  h += row('How', 'Tap it, do not type it');
  h += note('There is a list of things worth saying at a table and you tap one - back in five minutes, deal me out, one more orbit, nice hand, I need to leave early. It lands at the bottom of the other person\u2019s screen for five seconds and then goes. Some of them do the thing as well as say it: asking to leave early raises the real request with ' + esc(t.admin) + ', and ' + (t.format === 'tournament' ? 'there is no sitting out or taking more chips at a tournament, so those are not on the list' : 'taking more chips, sitting out and coming back happen on the tap') + '. ' + esc(t.admin) + ' has his own list - starting in a minute, your turn, taking a break, wrapping up.');

  h += '<div class="h2">CHIPS ONLY</div>';
  h += row('Played with', 'Virtual chips');
  h += row('Money value', 'None');
  h += row('The record', 'Chips in, chips out');
  h += note('When the game closes, everybody\u2019s score is the chips he finished with less the chips he took, to the chip. That score goes into History and onto his running total, and it is all the portal records.');
  h += note(CHIPS_ONLY[0] + ' ' + CHIPS_ONLY[1]);

  h += '<div class="h2">WHO RUNS IT</div>';
  h += row('This table', esc(t.admin));
  h += note(esc(t.admin) + ' lets latecomers in, decides who may leave early, can pause the game for a break - every clock stops with it: the time to act, the time you agreed to stay' + (t.format === 'tournament' ? ', and the blinds' : '') + ' - call the last few hands or set a time to finish, and closes it at the end. Closing works out everyone\u2019s chip score for the night. The portal admin can do all of that too.');

  return h + '<button class="btn ghost" style="margin-top:16px" onclick="S.rules=null;render()">Back</button></div>';
}

function tableCard(t) {

    + (t.format === 'tournament' ? 'level ' + t.level + ' &middot; ' : '') + 'blinds ' + fmt(t.blinds.sb) + '/' + fmt(t.blinds.bb) + '</div></div>'
    + '<div class="pill2' + (t.paused ? '' : t.status === 'playing' ? ' g' : '') + '">' + (t.paused ? 'PAUSED' : t.status === 'playing' ? 'PLAYING' : 'WAITING') + '</div></div>';
  h += '<div class="muted small" style="margin-top:8px;white-space:normal">Run by <b>' + esc(t.admin) + '</b> &middot; '

  else if (t.asked) h += '<button class="btn ghost" style="flex:1;height:46px" disabled>Waiting for ' + esc(t.admin) + '</button>';
  else if (!t.free) h += '<button class="btn ghost" style="flex:1;height:46px" disabled>Full</button>';

  // You do not have to commit to a seat to come in and look. Walk into the room, watch a hand,

  }

  if (t.iRunIt) h += '<button class="btn ghost" style="width:52px;height:46px;font-size:18px" title="Invite" onclick="getInvite(\'' + t.code + '\')">&#9993;</button>';

function joinTable(code) { api('table-join', { code: code }).then(function (j) { if (j.seated) openTable(code); else toast('Asked. The admin will let you know.'); refresh(); }).catch(fail); }
function decide(code, memberId, ok) { api('table-decide', { code: code, memberId: memberId, ok: ok }).then(function (j) { toast(j.let ? 'Let in' : 'Turned down'); refresh(); }).catch(fail); }
function getInvite(code) { api('table-invite', { code: code }).then(function (j) { S.invite = { code: code, text: j.text }; render(); }).catch(fail); }
function openTable(code) {
  S.code = code; S.screen = 'table'; S.v = null;
  try { localStorage.setItem('sb-table', code); } catch (e) {}
  connect(); render();
}
function leaveTable() {
  S.screen = 'home'; S.code = ''; S.v = null;
  try { localStorage.removeItem('sb-table'); } catch (e) {}
  connect(); render();
}

// A call comes in, the signal drops, the phone reloads the page. If you were sitting at a table
// that is still going, go straight back to it rather than making you find it again.
function resumeTable() {
  if (S.resumed || S.screen !== 'home') return;
  S.resumed = true;
  var code = '';
  try { code = localStorage.getItem('sb-table') || ''; } catch (e) {}
  if (!code) return;
  var t = (S.tables || []).filter(function (x) { return x.code === code; })[0];
  if (t && t.iAmIn && t.status !== 'ended') openTable(code);
  else try { localStorage.removeItem('sb-table'); } catch (e) {}
}

// Where the hand file goes when the phone will not save it. Copying works everywhere, including

function inviteSheet() {

    + '<button class="btn ghost" style="margin-top:8px" onclick="copyText(S.invite.text)">Copy the message</button>'
