<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smart Buddies">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Smart Buddies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0c0b;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#f2efe6;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#wrap{position:absolute;left:0;top:0;transform-origin:top left}
/* Reads the phone's safe area - the notch, the Dynamic Island, the home bar - so fit() can keep
   the portal clear of them. Measured off this rather than guessed. */
#safe{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* A phone held sideways leaves so little height that everything shrinks past reading size. Better
   to ask for it the right way up than to show a table nobody can read. */
#turn{display:none;position:fixed;inset:0;z-index:999;background:#0a0c0b;color:#f2efe6;
align-items:center;justify-content:center;text-align:center;padding:24px}
#stage{position:relative;width:390px;height:844px;overflow:hidden;background:#0a0c0b}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #d8b45c;outline-offset:2px}
.disp{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em}
.muted{color:#a3aba5}.gold{color:#d8b45c}
.abs{position:absolute}
.btn{height:52px;border:0;border-radius:12px;background:#d8b45c;color:#14110a;font-size:16px;font-weight:700;letter-spacing:.04em;width:100%}
.btn.ghost{background:transparent;border:1px solid #2a312d;color:#f2efe6;font-size:14px;font-weight:600;height:48px}
.btn.line{background:transparent;border:1px solid #d8b45c;color:#d8b45c}
.btn:disabled{opacity:.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;color:#a3aba5}
.field input{height:48px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:16px;padding:0 14px;font-family:inherit;width:100%}
.card{position:relative;width:38px;height:54px;border-radius:5px;background:#faf8f2;color:#14110a;font-weight:700;font-size:14px;line-height:1;flex:none;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
.cf{position:absolute;left:0;top:0;width:100%;height:100%;fill:currentColor}
.card.red{color:#b3262e}
.card.back{background:repeating-linear-gradient(45deg,rgba(216,180,92,.16) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(216,180,92,.16) 0 2px,transparent 2px 7px),#16201b;border:1px solid #d8b45c;box-shadow:inset 0 0 0 3px #16201b,inset 0 0 0 4px rgba(216,180,92,.5)}
.card.empty{background:transparent;border:1px dashed rgba(191,224,207,.3)}
.card.sm{width:24px;height:34px;font-size:13px;border-radius:3px}
.card.md{width:36px;height:50px;font-size:17px;border-radius:5px}
.hc{position:relative;width:70px;height:98px;transition:transform .14s ease,filter .14s}
.hc .hf{position:absolute;left:0;top:0;display:none}
#hero{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
#hero.up .hf{display:block}
#hero.up .hb{visibility:hidden}
#hero.up .hc{transform:translateY(-14px) scale(1.04);filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}
.card.xl{width:70px;height:98px;font-size:27px;border-radius:8px;box-shadow:0 7px 16px rgba(0,0,0,.55)}
.card.lg{width:62px;height:86px;font-size:24px;border-radius:7px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.card.win{box-shadow:0 0 0 2px #d8b45c,0 0 14px 3px rgba(216,180,92,.8);animation:wglow 1.3s ease-in-out infinite alternate;position:relative;z-index:2}
.card.dim{opacity:.35}
@keyframes wglow{to{box-shadow:0 0 0 2px #f3d27a,0 0 24px 7px rgba(243,210,122,1)}}
.felt{border-radius:167px/128px;background:radial-gradient(ellipse at 50% 42%,#1a6a4d 0%,#13543e 60%,#0d3326 100%);border:7px solid #2b2017;box-shadow:inset 0 0 0 2px rgba(216,180,92,.3),inset 0 14px 30px rgba(0,0,0,.35),0 18px 44px rgba(0,0,0,.55)}
.plq{position:absolute;width:104px;box-sizing:border-box;border-radius:9px;background:linear-gradient(#222a25,#151a17);border:1px solid #3a433c;box-shadow:0 4px 10px rgba(0,0,0,.5);padding:4px 7px 6px;overflow:hidden}
.plq.turn{border-color:#d8b45c;box-shadow:0 0 0 2px rgba(216,180,92,.28),0 4px 10px rgba(0,0,0,.5)}
.plq.allin{border-color:#d2454d}
.plq.out{opacity:.42}
.plq .prow{display:flex;align-items:center;gap:6px}
.plq .nm{font-size:10.5px;color:#bfe0cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.plq .stk{font-size:14px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.plq .tbar{position:absolute;left:0;bottom:0;height:3px;background:#d8b45c}
.plq .ptag{position:absolute;right:4px;top:4px;height:14px;padding:0 5px;border-radius:7px;font-size:9px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center}
.pmini{position:relative;width:28px;height:28px;border-radius:14px;background:#1b2a22;border:1px solid #2a312d;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;flex:none}
.betchip{display:inline-flex;align-items:center;gap:4px;margin-top:2px;padding:1px 7px 1px 4px;border-radius:9px;background:rgba(10,14,12,.72);border:1px solid #4a4a3a;font-size:11px;font-weight:700;color:#f3e9cf;white-space:nowrap}

.betchip i{width:11px;height:11px;border-radius:7px;background:radial-gradient(circle at 35% 30%,#f0d089,#c69b3c);border:1px solid #8c6a22;display:block;flex:none}
.seat{position:absolute;width:76px;display:flex;flex-direction:column;align-items:center;text-align:center}
.bull{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;cursor:pointer}
.fx{position:absolute;pointer-events:none;z-index:40;font-size:28px;line-height:1;margin:-14px 0 0 -14px}
@keyframes fxfly{0%{transform:translate(0,0) scale(.6) rotate(0);opacity:1}85%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(540deg);opacity:0}}
@keyframes fxpop{0%{transform:scale(.2);opacity:0}15%{opacity:1}35%{transform:scale(1.9);opacity:1}100%{transform:scale(1.2) translateY(-16px);opacity:0}}
@keyframes fxbub{0%{transform:translateY(8px) scale(.4);opacity:0}10%{transform:translateY(0) scale(1.15);opacity:1}15%{transform:scale(1)}85%{opacity:1}100%{transform:translateY(-14px) scale(1);opacity:0}}
.fxbub{background:#141917;border:1px solid #2a312d;border-radius:20px;padding:4px 8px;font-size:30px;margin:-22px 0 0 -26px}
.fxbtn{width:34px;height:34px;border-radius:17px;border:1px solid #2a312d;background:#1b2a22;font-size:20px;line-height:1;padding:0;flex:none}
.av{position:relative;width:52px;height:52px;border-radius:26px;background:#1b2a22;border:2px solid #2a312d;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px}
.seat.turn .av{border-color:#d8b45c;box-shadow:0 0 0 4px rgba(216,180,92,.25)}
.seat.out{opacity:.45}
.seat.allin .av{border-color:#d2454d}
.badge{position:absolute;left:-12px;top:-4px;width:22px;height:22px;border-radius:11px;background:#d8b45c;color:#14110a;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sname{margin-top:3px;font-size:11px;color:#bfe0cf;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbh{font-size:9.5px;font-weight:700;line-height:1.2;margin-top:1px}
.sstack{font-size:12px;font-weight:600}
.seat .tring{position:absolute;left:-2px;bottom:-4px;height:3px;background:#d8b45c;border-radius:2px;max-width:52px}
.seat.wants .av{border-color:#8fb7ff;box-shadow:0 0 0 4px rgba(143,183,255,.22)}
.want{position:absolute;right:-6px;top:-4px;width:18px;height:18px;border-radius:9px;background:#8fb7ff;color:#0b1220;font:700 12px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center}
.pill{height:16px;padding:0 6px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center}
.bet{position:absolute;min-width:30px;height:22px;padding:0 8px;border-radius:11px;background:#0a0c0b;border:1px solid #d8b45c;color:#d8b45c;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.chip{flex:1;height:44px;border:1px solid #2a312d;border-radius:10px;background:#141917;color:#f2efe6;font-size:13px;font-weight:600}
.act{height:56px;border:0;border-radius:12px;font-size:15px;font-weight:700;color:#f2efe6}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:12px;background:#141917;border:1px solid #2a312d}
.sheet{position:absolute;inset:0;background:#0a0c0b;z-index:20;overflow-y:auto;padding:20px 20px 32px;-webkit-overflow-scrolling:touch}
.h2{font-size:12px;font-weight:600;letter-spacing:.1em;color:#a3aba5;margin:22px 0 8px}
.toast{position:absolute;left:16px;right:16px;top:62px;z-index:60;padding:12px 14px;border-radius:12px;background:#2a1417;border:1px solid #d2454d;font-size:13px}
.toast.ok{background:#14221a;border-color:#2f7d53}
.poster{border-radius:10px;overflow:hidden;border:1px solid #d8b45c;box-shadow:0 12px 28px rgba(0,0,0,.6);flex:none}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.evc{border:1px solid #2a312d;background:#141917;border-radius:16px;padding:14px;margin-top:12px}
.evc.off{opacity:.5}
.pill2{font-size:10px;font-weight:700;letter-spacing:.12em;padding:4px 8px;border-radius:999px;border:1px solid #2a312d;color:#a3aba5;white-space:nowrap}
.pill2.g{border-color:#d8b45c;color:#d8b45c}
.pass{margin-top:12px;border:1px solid #d8b45c;border-radius:14px;padding:14px;background:linear-gradient(135deg,#1d1a0d,#12402f)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;background:#0f1311;border-top:1px solid #2a312d;z-index:30}
.tabs button{flex:1;border:0;background:transparent;color:#a3aba5;font-size:13px;font-weight:600}
.tabs button.on{color:#d8b45c}
.rolechip{height:34px;padding:0 10px;border-radius:17px;border:1px solid #2a312d;background:transparent;color:#a3aba5;font-size:12px;font-weight:600}
.rolechip.on{border-color:#d8b45c;color:#d8b45c;background:rgba(216,180,92,.1)}
@keyframes drin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dr.anim{opacity:0;animation:drin .45s ease forwards}
input[type=range]{width:100%;height:28px;accent-color:#d8b45c;margin:0}
.small{font-size:12px;line-height:1.5}
</style>

</head>
<body>
<div id="safe"></div>
<div id="wrap"><div id="stage"></div></div>
<div id="turn"><div><div class="disp" style="font-size:30px;line-height:1.1">Turn your phone<br>upright</div>
<div class="muted small" style="margin-top:10px;white-space:normal">The table is dealt tall, so it needs the long way up.</div></div></div>
<script>
// all in one SVG so it stays sharp and correctly spaced at every size.
var SUIT_SHAPE={
  h:'<path d="M5 9.15 L1.68 5.83 A2.35 2.35 0 1 1 5 2.5 A2.35 2.35 0 1 1 8.32 5.83 Z"/>',
  s:'<g transform="rotate(180 5 5)"><path d="M5 9.15 L1.68 5.83 A2.35 2.35 0 1 1 5 2.5 A2.35 2.35 0 1 1 8.32 5.83 Z"/></g><path d="M3.9 9.6 Q5 6.9 6.1 9.6 Z"/>',
  d:'<path d="M5 0.6 L8.95 5 L5 9.4 L1.05 5 Z"/>',
  c:'<circle cx="5" cy="3.15" r="2.1"/><circle cx="2.75" cy="6.4" r="2.1"/><circle cx="7.25" cy="6.4" r="2.1"/><path d="M3.9 9.7 Q5 7 6.1 9.7 Z"/>'
};
function suitAt(su,x,y,sz){return '<g transform="translate('+(x-sz/2)+' '+(y-sz/2)+') scale('+(sz/10)+')">'+SUIT_SHAPE[su]+'</g>';}
var PIP_ROWS={
  '2':[[1,0],[1,4]],'3':[[1,0],[1,2],[1,4]],'4':[[0,0],[2,0],[0,4],[2,4]],
  '5':[[0,0],[2,0],[1,2],[0,4],[2,4]],'6':[[0,0],[2,0],[0,2],[2,2],[0,4],[2,4]],
  '7':[[0,0],[2,0],[1,1],[0,2],[2,2],[0,4],[2,4]],
  '8':[[0,0],[2,0],[1,1],[0,2],[2,2],[1,3],[0,4],[2,4]],
  '9':[[0,0],[2,0],[0,1.34],[2,1.34],[1,2],[0,2.66],[2,2.66],[0,4],[2,4]],
  '10':[[0,0],[2,0],[1,0.67],[0,1.34],[2,1.34],[0,2.66],[2,2.66],[1,3.33],[0,4],[2,4]]
};
function cardFace(r,su,small){
  var W=62,H=86,g='';
  if(small){ // a seat-sized card: one rank, one suit, nothing else to squint at
    return '<svg class="cf" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'+
      '<text x="31" y="40" text-anchor="middle" font-size="'+(r==='10'?30:34)+'" font-weight="700" font-family="Georgia,\'Times New Roman\',serif">'+r+'</text>'+
      suitAt(su,31,60,24)+'</svg>';
  }
  // the index in two opposite corners, the way a real card is read from either end
  var ix=function(){
    var fs=r==='10'?11:13.5;
    return '<text x="8.6" y="15.4" text-anchor="middle" font-size="'+fs+'" font-weight="700" font-family="Georgia,\'Times New Roman\',serif">'+r+'</text>'+suitAt(su,8.6,21.6,7.4);
  };
  g+=ix()+'<g transform="rotate(180 31 43)">'+ix()+'</g>';
  if(PIP_ROWS[r]){
    g+=PIP_ROWS[r].map(function(p){
      var x=[21.5,31,40.5][p[0]], y=18.5+p[1]*12.4;
      return suitAt(su,x,y,11.4);
    }).join('');
  } else if(r==='A'){
    g+=suitAt(su,31,43,30);
  } else {
    // court card: a framed panel with the letter and suit mirrored top and bottom
    g+='<rect x="17.5" y="14.5" width="27" height="57" rx="2.5" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".5" stroke-width="0.9"/>'+
       '<line x1="17.5" y1="43" x2="44.5" y2="43" stroke="currentColor" stroke-opacity=".28" stroke-width="0.7"/>';
    var half='<text x="31" y="34.5" text-anchor="middle" font-size="19" font-weight="700" font-family="Georgia,\'Times New Roman\',serif">'+r+'</text>'+suitAt(su,31,39.6,7.6);
    g+=half+'<g transform="rotate(180 31 43)">'+half+'</g>';
  }
  return '<svg class="cf" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'+g+'</svg>';
}
function initials(n){return esc(n.replace(/[^A-Za-z0-9 ]/g,'').trim().slice(0,2).toUpperCase()||'?');}


// ---------------------------------------------------------------- the shape of things
// S is everything the screen knows. render() draws S. Nothing else touches the DOM.
var S = { screen: 'signin', tab: 'tables', token: '', me: null, tables: [], history: [], members: [],
          formats: [], variants: [], code: '', v: null, toast: '', busy: false, open: {}, seats: 7 };

try { S.token = localStorage.getItem('sb-token') || ''; } catch (e) {}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { return (Math.round(Number(n) || 0)).toLocaleString('en-IN'); }
function kfmt(n) { n = Math.round(Number(n) || 0); return n >= 10000 ? Math.round(n / 1000) + 'k' : fmt(n); }
function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function when(ms) { return new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); }
function clock(ms) { return new Date(ms).toLocaleTimeString([], { timeStyle: 'short' }); }

function toast(msg, bad) { S.toast = msg; S.toastBad = !!bad; render(); clearTimeout(toast.t); toast.t = setTimeout(function () { S.toast = ''; render(); }, 3400); }
function fail(err) { toast(err && err.message ? err.message : 'Something went wrong', true); }
function blurField() { try { var a = document.activeElement; if (a && a.blur && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur(); } catch (e) {} }

function api(name, body) {
  return fetch('/api/' + name, { method: 'POST', body: JSON.stringify(Object.assign({ token: S.token }, body || {})) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; }); });
}

// ---------------------------------------------------------------- the live feed
var feed = null;
function connect() {
  if (feed) { feed.close(); feed = null; }
  if (!S.token) return;
  var url = '/api/feed?token=' + encodeURIComponent(S.token) + (S.code ? '&code=' + S.code : '');
  feed = new EventSource(url);
  feed.addEventListener('lobby', function (e) { S.tables = JSON.parse(e.data).tables; if (S.screen !== 'table') render(); });
  feed.addEventListener('table', function (e) { S.v = JSON.parse(e.data); if (S.screen === 'table') render(); });
  feed.addEventListener('ended', function () { refresh(); });
  feed.onerror = function () { /* the browser reconnects by itself */ };
}
function refresh() {
  return api('me').then(function (j) {
    S.me = j.me; S.tables = j.tables; S.history = j.history; S.members = j.members;
    S.formats = j.formats; S.variants = j.variants; S.seats = j.seats; S.storage = j.storage; S.saveError = j.saveError;
    if (S.screen === 'signin') S.screen = 'home';
    render();
  });
}

// ---------------------------------------------------------------- getting in
function askNumber() {
  blurField();
  var phone = val('in_phone');
  if (phone.replace(/\D/g, '').length < 10) { toast('Your 10-digit mobile number'); return; }
  api('look-up', { phone: phone }).then(function (j) {
    if (!j.known) { toast('That number is not on the list. Ask the admin to add you.'); return; }
    S.signin = { phone: phone, name: j.name, first: j.first };
    render();
    setTimeout(function () { var el = document.getElementById('in_pin'); if (el) el.focus(); }, 60);
  }).catch(fail);
}
function doSignIn() {
  blurField();
  var pin = val('in_pin'), again = S.signin.first ? val('in_pin2') : pin;
  if (!/^\d{4}$/.test(pin)) { toast('Four digits'); return; }
  if (pin !== again) { toast('The two passcodes are not the same'); return; }
  api('sign-in', { phone: S.signin.phone, pin: pin, device: navigator.userAgent.slice(0, 40) })
    .then(function (j) {
      S.token = j.token; try { localStorage.setItem('sb-token', j.token); } catch (e) {}
      S.signin = null;
      connect(); refresh();
      if (j.welcome) setTimeout(function () { toast('Welcome in. Add this page to your home screen.'); }, 500);
    }).catch(fail);
}
function firstAdmin() {
  blurField();
  var d = { secret: val('ad_secret'), name: val('ad_name'), phone: val('ad_phone'), pin: val('ad_pin'), device: navigator.userAgent.slice(0, 40) };
  if (d.pin !== val('ad_pin2')) { toast('The two passcodes are not the same'); return; }
  api('first-admin', d).then(function (j) {
    S.token = j.token; try { localStorage.setItem('sb-token', j.token); } catch (e) {}
    connect(); refresh();
  }).catch(fail);
}
function signOut() {
  if (!confirm('Sign out of this phone?')) return;
  api('sign-out').catch(function () {});
  S.token = ''; try { localStorage.removeItem('sb-token'); } catch (e) {}
  S.me = null; S.screen = 'signin'; S.code = ''; S.v = null;
  if (feed) { feed.close(); feed = null; }
  render();
}

function signInScreen() {
  if (S.adminSetup) {
    return '<div class="sheet"><div class="gold" style="font-size:11px;font-weight:700;letter-spacing:.18em">SMART BUDDIES</div>'
      + '<div class="disp" style="font-size:34px;line-height:1.05;margin-top:6px">Set up<br>the portal</div>'
      + '<div class="muted small" style="margin:10px 0 16px;white-space:normal">This is the first sign-in. Prove it is you with the storage secret, and you become the portal admin.</div>'
      + field('ad_secret', 'STORAGE SECRET', 'password', 'The secret in your Apps Script')
      + field('ad_name', 'YOUR NAME', 'text', 'SV')
      + field('ad_phone', 'YOUR MOBILE NUMBER', 'tel', '9876543210')
      + field('ad_pin', 'CHOOSE A 4-DIGIT PASSCODE', 'password', '', 'numeric')
      + field('ad_pin2', 'AND AGAIN', 'password', '', 'numeric')

// What a new member is sent once: where the portal lives, how to keep it, and how to get in.
function memberLink(id) {

  if (!m) return;
  var url = location.origin;
  var text = 'Hi ' + m.name + '! This is Smart Buddies, our private poker portal.\n\n' + url
    + '\n\n1. Open that on your phone.\n2. Add it to your home screen, so it opens like an app.\n'
    + '3. Sign in with this mobile number: ' + m.phone + '\n4. Choose a 4-digit passcode. That is how you get in from then on.\n\n'

function removeMember(id, name) { if (!confirm('Remove ' + name + '?')) return; api('member-remove', { memberId: id }).then(refresh).catch(fail); }
function resetMember(id, name) { if (!confirm('Forget ' + name + "'s passcode? They set a new one next time they sign in.")) return; api('member-reset', { memberId: id }).then(function () { toast('Done'); refresh(); }).catch(fail); }

// ---------------------------------------------------------------- the table
// The felt sits in the top half, your own cards and the buttons in the bottom half, so your
// thumb never covers the game.
var CX = 195, CY = 212, RX = 132, RY = 98, MINE = 400;

// Seat 0 is you, at the bottom of the oval. The others go round from there, so whoever is on
// your left is on your left on the screen too.
function seatXY(rel, n) {
  var th = (rel / n) * Math.PI * 2;
  return { x: CX + RX * Math.sin(th), y: CY + RY * Math.cos(th) };
}

function tableScreen() {
  var v = S.v;
  if (!v) return '<div class="sheet"><div class="muted" style="margin-top:40px">Opening the table…</div></div>';
  var h = '<div class="abs" style="inset:0;background:#0a0c0b">';

  // ---- the strip across the top ----
  h += '<div class="abs" style="left:0;right:0;top:0;height:54px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #1b211d">'
    + '<button class="rolechip" style="height:30px" onclick="leaveTable()">&#8592; Tables</button>'
    + '<div style="flex:1;min-width:0;text-align:center"><div style="font-size:12px;font-weight:700;letter-spacing:.06em">' + esc(v.formatName) + '</div>'
    + '<div class="muted" style="font-size:10px">' + (v.format === 'tournament' ? 'Level ' + v.level + ' &middot; ' : '') + fmt(v.blinds.sb) + '/' + fmt(v.blinds.bb)
    + (v.hand ? ' &middot; hand ' + v.hand.no : '') + '</div></div>'
    + '<button class="rolechip" style="height:30px" onclick="S.menu=!S.menu;render()">&#9776;</button></div>';

  // ---- the felt ----
  h += '<div class="abs felt" style="left:30px;top:96px;width:330px;height:236px"></div>';

  // the board
  if (v.hand && v.hand.boards) {
    var by = CY - 18;
    v.hand.boards.forEach(function (board, bi) {
      var cards = board.map(function (c) { return cardHtml(c, v.hand.boards.length > 1 ? 'sm' : 'md'); }).join('');
      h += '<div class="abs" style="left:' + CX + 'px;top:' + (by + bi * 40) + 'px;transform:translate(-50%,-50%);display:flex;gap:4px">' + cards + '</div>';
    });
    h += '<div class="abs" style="left:' + CX + 'px;top:' + (CY + 44) + 'px;transform:translate(-50%,-50%);font-size:13px;font-weight:700;color:#f3e9cf;background:rgba(10,14,12,.6);padding:3px 10px;border-radius:12px">' + fmt(v.hand.pot) + '</div>';
  } else {
    h += '<div class="abs" style="left:' + CX + 'px;top:' + CY + 'px;transform:translate(-50%,-50%);text-align:center;width:240px">'
      + '<div class="disp gold" style="font-size:20px">' + (v.status === 'ended' ? 'The game has ended' : 'Waiting to start') + '</div>'
      + (v.waiting ? '<div class="muted small" style="margin-top:4px">' + esc(v.waiting) + '</div>' : '') + '</div>';
  }

  // ---- the seats ----
  var n = v.seatsMax, mySeat = v.me ? v.me.seat : 0;
  v.seats.forEach(function (st, seat) {
    var rel = (seat - mySeat + n) % n;
    if (rel === 0 && v.me) return;                 // your own seat is drawn below, big
    var p = seatXY(rel, n);
    h += seatHtml(v, st, p.x, p.y, seat);
  });

  // ---- your own half ----
  h += myHalf(v);

  if (S.menu) h += tableMenu(v);
  if (S.toast) h += '<div class="toast">' + esc(S.toast) + '</div>';
  return h + '</div>';
}

function seatHtml(v, st, x, y, seat) {
  if (!st) {   // an open seat: a quiet outline, not a label shouting for attention
    return '<div class="abs seat" style="left:' + (x - 38) + 'px;top:' + (y - 26) + 'px">'
      + '<div class="av" style="border-style:dashed;opacity:.28"></div></div>';
  }
  var hp = v.hand ? (v.hand.players || []).find(function (p) { return p.id === st.id; }) : null;
  var turn = v.hand && v.hand.turnId === st.id;
  var cls = 'abs seat' + (turn ? ' turn' : '') + (hp && hp.allIn ? ' allin' : '') + ((st.away || st.busted || (hp && hp.folded)) ? ' out' : '');
  var h = '<div class="' + cls + '" style="left:' + (x - 38) + 'px;top:' + (y - 30) + 'px">';
  // their cards, face down, tucked behind
  if (hp && !hp.folded && hp.cards && hp.cards.length) {
    var small = hp.cards.map(function (c) { return cardHtml(c, 'sm'); }).join('');
    h += '<div style="display:flex;gap:2px;margin-bottom:-8px;transform:scale(.72)">' + small + '</div>';
  }
  h += '<div class="av">' + initials(st.name) + (st.isAdmin ? '<div class="badge">&#9733;</div>' : '') + '</div>'
    + '<div class="sname">' + esc(st.name) + '</div>'
    + '<div class="sstack">' + kfmt(st.stack) + '</div>';
  if (st.away) h += '<div class="sbh muted">sitting out</div>';
  if (st.busted) h += '<div class="sbh" style="color:#f08a8f">out</div>';
  if (st.leaveAsk && !st.leaveOk) h += '<div class="want">!</div>';
  h += '</div>';
  if (hp && hp.bet > 0) {
    var bx = CX + (x - CX) * 0.62, by2 = CY + (y - CY) * 0.62;
    h += '<div class="bet" style="left:' + bx + 'px;top:' + by2 + 'px">' + kfmt(hp.bet) + '</div>';
  }
  return h;
}

function myHalf(v) {
  var me = v.me;
  if (!me) {
    return '<div class="abs" style="left:16px;right:16px;top:' + MINE + 'px">'
      + '<div class="evc"><div class="muted small">You are watching. ' + (v.status === 'playing' ? 'Ask ' + esc(v.admin) + ' for a seat from the Tables screen.' : 'Take a seat from the Tables screen.') + '</div></div></div>';
  }
  var hp = v.hand ? (v.hand.players || []).find(function (p) { return p.id === me.id; }) : null;
  var h = '';
  // your cards
  h += '<div class="abs" style="left:0;right:0;top:' + (MINE - 40) + 'px;display:flex;justify-content:center;gap:6px;height:104px">';
  if (hp && hp.cards && hp.cards.length) {
    var big = hp.cards.length > 4 ? 'md' : 'xl';
    h += hp.cards.map(function (c) { return cardHtml(c, big, hp.folded ? 'dim' : ''); }).join('');
  }
  h += '</div>';

  // your line: name, chips, bought in
  h += '<div class="abs" style="left:16px;right:16px;top:' + (MINE + 70) + 'px;display:flex;align-items:center;gap:10px">'
    + '<div class="av" style="width:42px;height:42px;font-size:17px">' + initials(me.name || (S.me && S.me.name) || '') + '</div>'
    + '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">' + esc(S.me.name) + (v.iRunIt ? ' <span class="gold" style="font-size:10px">YOU RUN THIS</span>' : '') + '</div>'
    + '<div class="muted small">' + fmt(me.stack) + ' chips &middot; bought in ' + fmt(me.bought) + '</div></div>'
    + (me.away ? '<button class="rolechip on" onclick="setAway(false)">Sit back in</button>' : '') + '</div>';

  // the buttons
  h += '<div class="abs" style="left:12px;right:12px;top:' + (MINE + 124) + 'px">' + controls(v) + '</div>';
  return h;
}

function controls(v) {
  if (v.status === 'ended') return '<button class="btn" onclick="leaveTable()">Back to the tables</button>';
  // the game admin, before play starts
  if (v.status !== 'playing' || !v.hand) {
    var h = '';
    if (v.iRunIt) {
      h += '<button class="btn" ' + (v.waiting ? 'disabled' : '') + ' onclick="startGame()">' + (v.waiting ? esc(v.waiting) : 'Start the game') + '</button>';
    } else {
      h += '<div class="evc" style="margin:0"><div class="muted small">' + (v.waiting ? esc(v.waiting) : 'Waiting for ' + esc(v.admin) + ' to start') + '</div></div>';
    }
    return h;
  }
  // Everybody is all-in with cards still to come, so the table says how many times to deal the
  // rest of the board. Twenty seconds; whoever says nothing is counted as once.
  if (v.hand.runit) return runItVote(v);

  var L = v.legal;
  if (!L) {
    return '<div class="evc" style="margin:0"><div class="muted small">' + (v.hand.finished ? 'Hand over' : 'Waiting for the others') + '</div></div>';
  }
  var toCall = L.toCall || 0;
  var h = '<div style="display:flex;gap:8px">';
  h += '<button class="act" style="flex:1;background:#3a2326" onclick="act(\'fold\')">Fold</button>';
  h += L.canCheck
    ? '<button class="act" style="flex:1;background:#1f3328" onclick="act(\'check\')">Check</button>'
    : '<button class="act" style="flex:1;background:#1f3328" onclick="act(\'call\')">Call ' + kfmt(toCall) + '</button>';
  if (L.canRaise) h += '<button class="act" style="flex:1;background:#3a3016;color:#f3e9cf" onclick="S.raise=!S.raise;render()">Raise</button>';
  h += '</div>';
  if (S.raise && L.canRaise) {
    var min = L.minRaiseTo, max = L.maxRaiseTo, cur = S.raiseTo && S.raiseTo >= min && S.raiseTo <= max ? S.raiseTo : min;
    h += '<div style="margin-top:8px"><input type="range" min="' + min + '" max="' + max + '" step="1" value="' + cur + '" oninput="S.raiseTo=Number(this.value);document.getElementById(\'rv\').textContent=fmt(S.raiseTo)">'
      + '<div style="display:flex;gap:6px;margin-top:6px">'
      + quick(L, 'Min', min) + quick(L, '½ pot', Math.min(max, Math.max(min, Math.round(L.pot / 2)))) + quick(L, 'Pot', Math.min(max, Math.max(min, L.pot))) + quick(L, 'All in', max)
      + '</div>'
      + '<button class="btn" style="margin-top:8px" onclick="act(\'raise\',S.raiseTo||' + min + ')">Raise to <span id="rv">' + fmt(cur) + '</span></button></div>';
  }
  return h;
}
function quick(L, label, amount) {
  return '<button class="chip" onclick="S.raiseTo=' + amount + ';render()">' + label + '</button>';
}

function act(type, amount) {
  S.raise = false;
  api('act', { code: S.code, type: type, amount: amount }).catch(fail);
}
function startGame() { api('table-start', { code: S.code }).catch(fail); }
function setAway(on) { api('away', { code: S.code, on: on }).catch(fail); }

function tableMenu(v) {
  var h = '<div class="sheet" style="z-index:40"><div style="display:flex;justify-content:space-between;align-items:center">'
    + '<div class="disp" style="font-size:26px">' + esc(v.formatName) + '</div>'
    + '<button class="rolechip" onclick="S.menu=false;render()">Close</button></div>'
    + '<div class="muted small">Table ' + esc(v.code) + ' &middot; run by ' + esc(v.admin) + (v.variantName ? ' &middot; ' + esc(v.variantName) : '') + '</div>';

  if (v.nextVariant) h += '<div class="pass" style="margin-top:12px"><div class="gold" style="font-size:11px;font-weight:700;letter-spacing:.14em">NEXT HAND</div><div style="font-size:15px;margin-top:2px">' + esc(v.nextVariant) + '</div></div>';

  // what a player can do
  if (v.me) {
    h += '<div class="h2">YOU</div>';
    if (v.format !== 'tournament') {
      h += '<div style="display:flex;gap:8px"><input id="bi_amt" inputmode="numeric" placeholder="' + fmt(v.settings.minBuyin) + '" style="flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:15px;padding:0 12px;font-family:inherit">'
        + '<button class="rolechip on" style="height:46px" onclick="doBuyin()">Buy in</button></div>';
    }
    h += '<button class="btn ghost" style="margin-top:8px" onclick="setAway(' + (v.me.away ? 'false' : 'true') + ')">' + (v.me.away ? 'Sit back in' : 'Sit out of the next hand') + '</button>';
    if (!v.iRunIt) h += '<button class="btn ghost" style="margin-top:8px" onclick="askLeave()">Ask to leave early</button>';
  }

  // what the game admin can do
  if (v.iRunIt) {
    h += '<div class="h2">RUNNING THIS TABLE</div>';
    if (v.requests.length) {
      v.requests.forEach(function (r) {
        h += '<div class="row" style="margin-top:6px"><div style="flex:1;min-width:0">' + esc(r.name) + ' wants to come in</div>'
          + '<button class="rolechip on" onclick="decide(\'' + v.code + '\',\'' + r.memberId + '\',true)">Let in</button>'
          + '<button class="rolechip" style="color:#d2454d;border-color:#6b2a2e" onclick="decide(\'' + v.code + '\',\'' + r.memberId + '\',false)">No</button></div>';
      });
    }
    if (v.leaveAsks.length) {
      v.leaveAsks.forEach(function (p) {
        h += '<div class="row" style="margin-top:6px"><div style="flex:1;min-width:0">' + esc(p.name) + ' asks to leave early</div>'
          + '<button class="rolechip on" onclick="decideLeave(\'' + p.id + '\',true)">Let go</button>'
          + '<button class="rolechip" onclick="decideLeave(\'' + p.id + '\',false)">Stay</button></div>';
      });
    }
    if (!v.requests.length && !v.leaveAsks.length) h += '<div class="muted small">Nothing waiting on you.</div>';
    h += '<button class="btn ghost" style="margin-top:10px" onclick="getInvite(\'' + v.code + '\')">Invite message for the group</button>';
    h += '<button class="btn ghost" style="margin-top:8px;border-color:#6b2a2e;color:#d2454d" onclick="endGame()">End the game</button>';
    h += '<div class="muted small" style="margin-top:6px;white-space:normal">Ending works out everyone’s account, says who pays who, and puts it in History.</div>';
  }

  if (v.notes && v.notes.length) {
    h += '<div class="h2">MESSAGES</div>';
    v.notes.slice().reverse().forEach(function (nt) {
      h += '<div class="row" style="margin-top:6px"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">' + esc(nt.name) + '</div><div class="muted small">' + esc(nt.text) + '</div></div><div class="muted small">' + clock(nt.at) + '</div></div>';
    });
  }
  h += '<div class="h2">SAY SOMETHING</div><div style="display:flex;gap:8px">'
    + '<input id="nt_text" maxlength="140" placeholder="Back in five minutes" style="flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:15px;padding:0 12px;font-family:inherit">'
    + '<button class="rolechip" style="height:46px" onclick="sendNote()">Send</button></div>';

  h += '<div class="h2">WHAT HAPPENED</div><div class="muted small" style="line-height:1.7">'
    + v.log.slice().reverse().slice(0, 25).map(function (l) { return clock(l.at) + ' &middot; ' + esc(l.text); }).join('<br>') + '</div>';
  return h + '</div>';
}
function doBuyin() { blurField(); var a = Number(val('bi_amt')) || S.v.settings.minBuyin; api('buyin', { code: S.code, amount: a }).then(function () { toast('Bought in for ' + fmt(a)); }).catch(fail); }
function askLeave() { api('leave-ask', { code: S.code }).then(function () { toast('Asked. ' + S.v.admin + ' will decide.'); }).catch(fail); }
function decideLeave(pid, ok) { api('leave-decide', { code: S.code, playerId: pid, ok: ok }).then(function () { toast(ok ? 'They may go' : 'Asked to stay'); }).catch(fail); }
function sendNote() { blurField(); api('note', { code: S.code, text: val('nt_text') }).then(function () { var el = document.getElementById('nt_text'); if (el) el.value = ''; toast('Sent'); }).catch(fail); }
function endGame() { if (!confirm('End the game and work out the accounts?')) return; api('table-end', { code: S.code }).then(function () { S.menu = false; toast('Game ended'); refresh(); }).catch(fail); }

function cardHtml(c, size, extra) {
  if (!c || c === '??') return '<div class="card back ' + (size || '') + '"></div>';
  var r = c.slice(0, -1), su = c.slice(-1);
  var red = su === 'h' || su === 'd';
  return '<div class="card ' + (size || '') + (red ? ' red' : '') + (extra ? ' ' + extra : '') + '">' + cardFace(r, su, size === 'sm') + '</div>';
}

// ---------------------------------------------------------------- draw
// Which screen is on show. Used to decide whether a redraw is the same screen again - in which
// case whatever you had scrolled to is still what you want to be looking at.
function screenKey() {
  if (!S.token || !S.me) return 'signin';
  if (S.replay) return 'replay:' + S.replay.i;
  if (S.invite) return 'invite';
  if (S.screen === 'table') return 'table:' + S.code + (S.menu ? ':menu' : '');
  return 'home:' + (S.tab || '');
}

function render() {
  var keep = document.activeElement;
  if (keep && keep.id && /^(in_|ad_|am_|n_|bi_|nt_|cp_)/.test(keep.id)) {
    // never redraw out from under somebody who is typing
    var pending = render.pending;
    if (!pending) render.pending = setTimeout(function () { render.pending = null; }, 400);
    if (document.getElementById(keep.id)) return;
  }
  var html = !S.token || !S.me ? signInScreen()
    : S.replay ? replaySheet()
    : S.invite ? inviteSheet()
    : S.screen === 'table' ? tableScreen()
    : home();
  if (S.toast) html += '<div class="toast' + (S.toastBad ? '' : ' ok') + '">' + esc(S.toast) + '</div>';
  var stage = document.getElementById('stage');

  // Every screen scrolls, and the table redraws on its own each time somebody acts. Replacing the
  // page would send you back to the top mid-read, and stepping through a replay would jump away
  // from the buttons you are tapping. So remember where each pane was and put it back.
  var key = screenKey();
  var was = [].map.call(stage.querySelectorAll('.sheet'), function (el) { return el.scrollTop; });
  stage.innerHTML = html;
  if (key === render.key) {
    var panes = stage.querySelectorAll('.sheet');
    if (panes.length === was.length) for (var i = 0; i < panes.length; i++) if (was[i]) panes[i].scrollTop = was[i];
  }
  render.key = key;
  fit();
}

// The whole portal is drawn at 390x844 and scaled to the phone, so it looks the same everywhere.
//
// The position is worked out in pixels rather than with a percentage translate. A CSS percentage
// in translateX resolves against the element's own unscaled width, so on any phone that is not
// exactly 390 wide the page slid sideways - about 80px on a phone in Safari, enough to cut the
// title off. Everything is placed against the safe area too, so nothing hides under the notch,
// the Dynamic Island or the home bar.
function inset() {
  var el = document.getElementById('safe');
  if (!el) return { t: 0, r: 0, b: 0, l: 0 };
  var cs = getComputedStyle(el);
  var n = function (v) { var x = parseFloat(v); return x > 0 ? x : 0; };
  return { t: n(cs.paddingTop), r: n(cs.paddingRight), b: n(cs.paddingBottom), l: n(cs.paddingLeft) };
}

function fit() {
  var pad = inset();
  var w = Math.max(1, window.innerWidth - pad.l - pad.r);
  var h = Math.max(1, window.innerHeight - pad.t - pad.b);

  // Sideways on a phone there is so little height left that the type comes out at about 4px.
  // Ask for the phone upright instead. A tablet on its side has room, so it carries on.
  var turn = document.getElementById('turn');
  if (turn) turn.style.display = (w > h && h < 500) ? 'flex' : 'none';

  var scale = Math.min(w / 390, h / 844);
  var wrap = document.getElementById('wrap');
  wrap.style.transform = 'scale(' + scale + ')';
  wrap.style.left = Math.round(pad.l + (w - 390 * scale) / 2) + 'px';
  wrap.style.top = Math.round(pad.t + Math.max(0, (h - 844 * scale) / 2)) + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 120); });

// ---------------------------------------------------------------- go
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
if (S.token) { connect(); refresh().catch(function () { S.token = ''; try { localStorage.removeItem('sb-token'); } catch (e) {} render(); }); }
else render();

// ---------------------------------------------------------------- replays
// A kept hand, played back a step at a time: who did what, and what the board was.
var STREETS = { preflop: 'Pre-flop', flop: 'Flop', turn: 'Turn', river: 'River' };
var ACTS = { fold: 'folds', check: 'checks', call: 'calls', bet: 'bets', raise: 'raises to', allin: 'is all in for', post: 'posts', ante: 'antes' };

function replaySheet() {
  var r = S.replay, rounds = r.rounds || [];
  if (!rounds.length) return '<div class="sheet" style="z-index:50"><div class="disp" style="font-size:26px">No hands kept</div>'
    + '<div class="muted small" style="margin-top:8px;white-space:normal">The replays of this game have been cleared. Only the last ten games keep them; the account statement stays for good.</div>'
    + '<button class="btn ghost" style="margin-top:14px" onclick="S.replay=null;render()">Back</button></div>';

  var g = rounds[Math.min(r.i, rounds.length - 1)];
  var step = r.step === undefined ? (g.acts || []).length : r.step;
  var acts = (g.acts || []).slice(0, step);
  var street = acts.length ? acts[acts.length - 1].s : 'preflop';
  var upto = { preflop: 0, flop: 3, turn: 4, river: 5 }[street] || 0;

  var h = '<div class="sheet" style="z-index:50">';
  h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
    + '<div><div class="disp" style="font-size:26px;line-height:1.1">Hand ' + g.no + '</div>'
    + '<div class="muted small">' + esc(VARIANT_NAME(g.variant)) + ' &middot; ' + fmt(g.pot) + ' in the pot</div></div>'
    + '<button class="rolechip" onclick="S.replay=null;render()">Close</button></div>';

  // which of the kept hands
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">';
  rounds.forEach(function (x, i) {
    h += '<button class="rolechip' + (i === r.i ? ' on' : '') + '" onclick="S.replay.i=' + i + ';S.replay.step=undefined;render()">' + fmt(x.pot) + '</button>';
  });
  h += '</div>';

  // the board as it stood at this point
  h += '<div class="evc" style="margin-top:12px"><div class="muted small">' + (STREETS[street] || '') + '</div>'
    + '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">'
    + (g.boards || []).map(function (b) {
      return b.slice(0, upto).map(function (c) { return cardHtml(c, 'md'); }).join('');
    }).join('<div style="width:10px"></div>') + '</div></div>';

  // everyone in the hand, with the cards they showed
  h += '<div class="h2">THE HAND</div>';
  (g.players || []).forEach(function (p) {
    var shown = g.reveal && g.reveal[p.id] ? (g.reveal[p.id].cards || []) : [];
    var won = g.won && g.won[p.id];
    h += '<div class="row" style="margin-top:6px"><div style="flex:1;min-width:0">'
      + '<div style="font-size:14px;font-weight:600">' + esc(p.name) + (won ? ' <span class="gold" style="font-size:11px">WON ' + fmt(won) + '</span>' : '') + '</div>'
      + '<div class="muted small">started with ' + fmt(p.start) + '</div></div>'
      + '<div style="display:flex;gap:3px">' + (shown.length ? shown.map(function (c) { return cardHtml(c, 'sm'); }).join('') : '<span class="muted small">did not show</span>') + '</div></div>';
  });

  // the betting, a step at a time
  h += '<div class="h2">WHAT HAPPENED</div><div class="muted small" style="line-height:1.8">';
  var name = {};
  (g.players || []).forEach(function (p) { name[p.id] = p.name; });
  var lastStreet = '';
  acts.forEach(function (a) {
    if (a.s !== lastStreet) { h += '<div class="gold" style="margin-top:6px">' + (STREETS[a.s] || a.s) + '</div>'; lastStreet = a.s; }
    h += esc(name[a.id] || '?') + ' ' + (ACTS[a.k] || a.k) + (a.a ? ' ' + fmt(a.a) : '') + '<br>';
  });
  h += '</div>';

  var total = (g.acts || []).length;
  h += '<div style="display:flex;gap:8px;margin-top:12px">'
    + '<button class="btn ghost" style="flex:1" onclick="replayStep(-1)">&#8592; Back</button>'
    + '<button class="btn ghost" style="flex:1" onclick="replayStep(1)">Next &#8594;</button></div>'
    + '<div class="muted small" style="margin-top:6px;text-align:center">' + acts.length + ' of ' + total + ' moves</div>';
  return h + '</div>';
}
function runItVote(v) {
  var r = v.hand.runit;
  var mine = v.me && r.votes[v.me.id];
  var iVote = !!(v.me && r.voters.indexOf(v.me.id) >= 0);
  var done = 0;
  r.voters.forEach(function (id) { if (r.votes[id]) done += 1; });

  var h = '<div class="evc" style="margin:0"><div class="row" style="align-items:flex-start">'
    + '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">Run it how many times?</div>'
    + '<div class="muted small" style="white-space:normal">Everyone is all in. ' + done + ' of ' + r.voters.length
    + ' have said. No answer counts as once.</div></div></div>';
  if (!iVote) return h + '</div>';

  h += '<div style="display:flex;gap:8px;margin-top:10px">';
  for (var n = 1; n <= (r.max || 1); n++) {
    h += '<button class="act" style="flex:1;background:' + (mine === n ? '#3a3016' : '#1f3328') + (mine === n ? ';color:#f3e9cf' : '')
      + '" onclick="voteRunIt(' + n + ')">' + (n === 1 ? 'Once' : n === 2 ? 'Twice' : n + ' times') + '</button>';
  }
  return h + '</div></div>';
}
function voteRunIt(n) { api('runit', { code: S.code, runs: n }).catch(fail); }

function replayStep(d) {
  var r = S.replay, g = r.rounds[r.i], total = (g.acts || []).length;
  var step = r.step === undefined ? total : r.step;
  r.step = Math.max(0, Math.min(total, step + d));
  render();
}
function VARIANT_NAME(v) {
  var found = (S.variants || []).filter(function (x) { return x.id === v; })[0];
  return found ? found.name : (v === 'holdem' ? "Texas Hold'em" : v);
}
</script></body></html>
