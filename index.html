<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Table</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Table">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0c0b;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#f2efe6;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#wrap{position:absolute;left:50%;top:0;transform-origin:top left}
#stage{position:relative;width:390px;height:844px;overflow:hidden;background:#0a0c0b}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #d8b45c;outline-offset:2px}
.disp{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em}
.muted{color:#a3aba5}.gold{color:#d8b45c}
.abs{position:absolute}
.btn{height:52px;border:0;border-radius:12px;background:#d8b45c;color:#14110a;font-size:16px;font-weight:700;letter-spacing:.04em;width:100%}
.btn.ghost{background:transparent;border:1px solid #2a312d;color:#f2efe6;font-size:14px;font-weight:600;height:48px}
.btn.line{background:transparent;border:1px solid #d8b45c;color:#d8b45c}
.btn:disabled{opacity:.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;color:#a3aba5}
.field input{height:48px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:16px;padding:0 14px;font-family:inherit;width:100%}
.card{width:38px;height:54px;border-radius:5px;background:#f2efe6;color:#14110a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;line-height:1.05;flex:none}
.card.red{color:#b3262e}
.card.back{background:#16201b;border:1px solid #d8b45c}
.card.empty{background:transparent;border:1px dashed rgba(191,224,207,.3)}
.card.sm{width:24px;height:34px;font-size:10px;border-radius:3px}
.card.lg{width:62px;height:86px;font-size:24px;border-radius:7px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.seat{position:absolute;width:76px;display:flex;flex-direction:column;align-items:center;text-align:center}
.av{position:relative;width:52px;height:52px;border-radius:26px;background:#1b2a22;border:2px solid #2a312d;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px}
.seat.turn .av{border-color:#d8b45c;box-shadow:0 0 0 4px rgba(216,180,92,.25)}
.seat.out{opacity:.45}
.seat.allin .av{border-color:#d2454d}
.badge{position:absolute;left:-12px;top:-4px;width:22px;height:22px;border-radius:11px;background:#d8b45c;color:#14110a;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sname{margin-top:3px;font-size:11px;color:#bfe0cf;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sstack{font-size:12px;font-weight:600}
.pill{height:16px;padding:0 6px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center}
.bet{position:absolute;min-width:30px;height:22px;padding:0 8px;border-radius:11px;background:#0a0c0b;border:1px solid #d8b45c;color:#d8b45c;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.chip{flex:1;height:44px;border:1px solid #2a312d;border-radius:10px;background:#141917;color:#f2efe6;font-size:13px;font-weight:600}
.act{height:56px;border:0;border-radius:12px;font-size:15px;font-weight:700;color:#f2efe6}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:12px;background:#141917;border:1px solid #2a312d}
.sheet{position:absolute;inset:0;background:#0a0c0b;z-index:20;overflow-y:auto;padding:20px 20px 32px;-webkit-overflow-scrolling:touch}
.h2{font-size:12px;font-weight:600;letter-spacing:.1em;color:#a3aba5;margin:22px 0 8px}
.toast{position:absolute;left:20px;right:20px;top:60px;z-index:40;padding:12px 14px;border-radius:12px;background:#2a1417;border:1px solid #d2454d;font-size:13px}
.poster{border-radius:10px;overflow:hidden;border:1px solid #d8b45c;box-shadow:0 12px 28px rgba(0,0,0,.6);flex:none}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
input[type=range]{width:100%;height:28px;accent-color:#d8b45c;margin:0}
.small{font-size:12px;line-height:1.5}
</style>
</head>

var SYM = {s:'♠︎',h:'♥︎',d:'♦︎',c:'♣︎'};
var $stage = document.getElementById('stage');
var S = {view:null, code:null, token:null, pid:null, es:null, sheet:false, lobbyMode:'join', raiseTo:null, turnKey:'', offset:0, toast:'', online:true, poster:null};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ls(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function fmt(n){return Number(n).toLocaleString('en-US');}

// ---- scale the 390x844 stage to any phone ----
function fit(){
  var w=window.innerWidth,h=window.innerHeight,k=Math.min(w/390,h/844);
  var wrap=document.getElementById('wrap');
  wrap.style.transform='translateX(-'+(195*k)+'px) scale('+k+')';wrap.style.top=Math.max(0,(h-844*k)/2)+'px';
}
window.addEventListener('resize',fit);fit();

// ---- network ----
function api(name,data){
  var body=Object.assign({code:S.code,token:S.token},data||{});
  return fetch('/api/'+name,{method:'POST',body:JSON.stringify(body)}).then(function(r){
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Something went wrong'); return j; });
  });
}
function toast(msg){S.toast=msg;render();clearTimeout(toast.t);toast.t=setTimeout(function(){S.toast='';render();},3500);}
function fail(e){toast(e.message||'Something went wrong');}

function saveSession(){try{localStorage.setItem('poker-session',JSON.stringify({code:S.code,token:S.token,pid:S.pid}));}catch(e){}}
function clearSession(){try{localStorage.removeItem('poker-session');}catch(e){} S.code=S.token=S.pid=null;S.view=null;S.sheet=false;if(S.es){S.es.close();S.es=null;}}

function connect(){
  if(S.es){S.es.close();}
  if(!S.code) return;
  var es=new EventSource('/api/events?code='+encodeURIComponent(S.code)+'&token='+encodeURIComponent(S.token));
  S.es=es;
  es.onmessage=function(ev){
    var v=JSON.parse(ev.data);
    S.offset=Date.now()-v.now; S.online=true; S.fails=0;
    var key=v.hand&&v.hand.legal?v.handNo+':'+v.hand.street+':'+v.hand.currentBet:'';
    if(key&&key!==S.turnKey){ S.raiseTo=null; if(navigator.vibrate) navigator.vibrate(120); }
    S.turnKey=key;
    S.view=v; render();
  };
  es.onerror=function(){S.online=false; if(es.readyState===2){ S.fails=(S.fails||0)+1; if(S.fails>=3){clearSession();toast('That table is gone. Join again with a room code.');return;} setTimeout(connect,1500);} render();};
}
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&S.code){connect();requestWake();} });
function requestWake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}}
setInterval(function(){ if(S.code) fetch('/ping').catch(function(){}); },240000);

// ---- helpers ----
function card(c,cls){
  cls=cls||'';
  if(!c||c==='??') return '<div class="card back '+cls+'"></div>';
  var r=c[0]==='T'?'10':c[0], red=(c[1]==='h'||c[1]==='d');
  return '<div class="card '+(red?'red ':'')+cls+'"><span>'+r+'</span><span>'+SYM[c[1]]+'</span></div>';
}
function initials(n){return esc(n.replace(/[^A-Za-z0-9 ]/g,'').trim().slice(0,2).toUpperCase()||'?');}
function pickPoster(){
  if(!S.poster){var k=['sucker','shot','escobar','montana','ace'];S.poster=k[Math.floor(Math.random()*k.length)];}
  return IMG[S.poster];
}

// ---- screens ----
function lobby(){
  var admin=S.lobbyMode==='admin';
  var q=new URLSearchParams(location.search).get('room')||'';
  var h='<div class="abs" style="inset:0;padding:28px 24px 24px;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse 320px 300px at 50% 235px,#12402f 0%,#0a0c0b 100%)">'+
  '<div style="display:flex;align-items:center;gap:12px;width:100%;justify-content:center"><div style="height:1px;flex:1;background:#2a312d"></div><div class="disp gold" style="font-size:22px;letter-spacing:.32em;padding-left:.32em">THE TABLE</div><div style="height:1px;flex:1;background:#2a312d"></div></div>'+
  '<div class="poster" style="margin-top:22px;width:176px;height:246px"><img alt="Poster: Kiss my ace" src="'+IMG.ace+'"></div>'+
  '<div class="disp" style="margin-top:20px;font-size:40px;line-height:1;text-align:center">Private poker night</div>'+
  '<div class="muted small" style="margin-top:8px;text-align:center;font-size:13px">Play chips only. Settle up outside the app.</div>';
  if(!admin){
    h+='<div style="margin-top:20px;width:100%;display:flex;flex-direction:column;gap:12px">'+
    '<div class="field"><label for="room">ROOM CODE</label><input id="room" autocapitalize="characters" autocomplete="off" maxlength="4" placeholder="e.g. 4F7K" value="'+esc(q.toUpperCase())+'" style="letter-spacing:.2em;text-transform:uppercase"></div>'+
    '<div class="field"><label for="nick">NICKNAME</label><input id="nick" maxlength="14" placeholder="Your name at the table" value="'+esc(ls('poker-name'))+'"></div></div>'+
    '<button class="btn" style="margin-top:18px" onclick="doJoin()">Take a seat</button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="S.lobbyMode=\'admin\';render()">Start a table as admin</button>';
  } else {
    h+='<div style="margin-top:16px;width:100%;display:flex;flex-direction:column;gap:10px">'+
    '<div class="field"><label for="nick">YOUR NICKNAME</label><input id="nick" maxlength="14" placeholder="Admin and banker" value="'+esc(ls('poker-name'))+'"></div>'+
    '<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label for="sb">SMALL BLIND</label><input id="sb" inputmode="numeric" value="25"></div><div class="field" style="flex:1"><label for="bb">BIG BLIND</label><input id="bb" inputmode="numeric" value="50"></div></div>'+
    '<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label for="ts">TURN TIMER (SEC)</label><input id="ts" inputmode="numeric" value="40"></div><div class="field" style="flex:1"><label for="mb">MAX BUY-IN</label><input id="mb" inputmode="numeric" value="10000"></div></div></div>'+
    '<button class="btn" style="margin-top:16px" onclick="doCreate()">Open the table</button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="S.lobbyMode=\'join\';render()">Back</button>';
  }
  return h+'</div>';
}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function doJoin(){
  var n=val('nick').trim();try{localStorage.setItem('poker-name',n);}catch(e){}
  fetch('/api/join',{method:'POST',body:JSON.stringify({code:val('room').toUpperCase(),name:n})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j;});})
  .then(start).catch(fail);
}
function doCreate(){
  var n=val('nick').trim();try{localStorage.setItem('poker-name',n);}catch(e){}
  fetch('/api/create',{method:'POST',body:JSON.stringify({name:n,settings:{sb:val('sb'),bb:val('bb'),turnSeconds:val('ts'),maxBuyin:val('mb')}})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j;});})
  .then(start).catch(fail);
}
function start(j){S.code=j.code;S.token=j.token;S.pid=j.pid;saveSession();S.sheet=false;connect();requestWake();}

var CX=195,CY=294,RX=150,RY=210;
function seatXY(rel,n){var a=Math.PI/2+rel/n*2*Math.PI;return {x:CX+RX*Math.cos(a),y:CY+RY*Math.sin(a)};}

function table(){
  var v=S.view,me=v.you,hand=v.hand,n=v.seats.length;
  var h='';
  // top bar
  h+='<div class="abs" style="left:0;top:0;width:390px;height:56px;padding:0 8px 0 20px;display:flex;align-items:center;gap:12px">'+
  '<div style="flex:1;min-width:0"><div class="gold" style="font-size:11px;font-weight:600;letter-spacing:.14em">ROOM '+esc(v.code)+'</div><div class="muted" style="margin-top:2px;font-size:13px">'+(v.handNo?'Hand '+v.handNo:'Not started')+(S.online?'':' · reconnecting')+'</div></div>'+
  '<div style="height:28px;padding:0 12px;border-radius:14px;border:1px solid #2a312d;background:#141917;font-size:13px;font-weight:600;display:flex;align-items:center">'+fmt(v.settings.sb)+' / '+fmt(v.settings.bb)+'</div>'+
  '<button aria-label="Table menu" onclick="S.sheet=true;render()" style="width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f2efe6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'+(me.isAdmin&&v.pending.length?'<span style="position:absolute;margin:-18px -14px 0 0;width:10px;height:10px;border-radius:5px;background:#d2454d"></span>':'')+'</button></div>';
  // felt
  h+='<div class="abs" style="left:45px;top:84px;width:300px;height:420px;border-radius:150px/210px;background:radial-gradient(ellipse at 50% 45%,#176046 0%,#0f3b2c 70%);border:7px solid #2b2017;box-shadow:inset 0 0 0 2px rgba(216,180,92,.35),0 20px 50px rgba(0,0,0,.55)"></div>';
  var pot=hand?hand.pot:0;
  var bets=hand?v.seats.reduce(function(s,x){return s+(x?x.bet:0);},0):0;
  // pot + board
  h+='<div class="abs" style="left:0;top:172px;width:390px;display:flex;flex-direction:column;align-items:center"><div style="font-size:11px;font-weight:600;letter-spacing:.16em;color:#bfe0cf">POT</div><div class="disp gold" style="font-size:38px;line-height:1">'+fmt(pot)+'</div></div>';
  var bc='';for(var i=0;i<5;i++){bc+=(hand&&hand.board[i])?card(hand.board[i]):'<div class="card empty"></div>';}
  h+='<div class="abs" style="left:0;top:246px;width:390px;display:flex;justify-content:center;gap:6px">'+bc+'</div>';
  // status line under board
  var status='';
  if(v.result){var w=v.result.won.map(function(x){return esc(x.name)+' wins '+fmt(x.amount)+(x.handName?' · '+esc(x.handName):'');});status=w.join('<br>');}
  else if(hand&&!hand.finished){status=hand.street.toUpperCase();}
  h+='<div class="abs" style="left:70px;top:312px;width:250px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.08em;color:'+(v.result?'#d8b45c':'#bfe0cf')+';line-height:1.5">'+status+'</div>';
  // seats
  var mySeat=me.seat;
  for(var s=0;s<n;s++){
    var st=v.seats[s]; var rel=(s-mySeat+n)%n; var pos=seatXY(rel,n);
    if(rel===0) continue; // you are drawn at the bottom
    if(!st){ h+='<div class="seat" style="left:'+(pos.x-38)+'px;top:'+(pos.y-26)+'px;opacity:.25"><div class="av" style="border-style:dashed"></div></div>'; continue; }
    var cls='seat'+(st.isTurn?' turn':'')+((st.folded||(!st.inHand&&hand&&!hand.finished))?' out':'')+(st.allIn?' allin':'');
    var line2=st.allIn?'<div class="pill" style="margin-top:3px;background:#d2454d;color:#fff">ALL IN</div>':(st.folded?'<div class="sname">Folded</div>':(!st.inHand&&st.stack<=0?'<div class="sname">No chips</div>':'<div class="sname">'+esc(st.name)+'</div>'));
    var showCards=st.cards&&st.cards[0]!=='??'&&v.result;
    h+='<div class="'+cls+'" style="left:'+(pos.x-38)+'px;top:'+(pos.y-26)+'px">'+
      '<div class="av">'+initials(st.name)+(st.isButton?'<span class="badge">D</span>':'')+(st.connected?'':'<span style="position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:5px;background:#a3aba5;border:2px solid #0a0c0b"></span>')+'</div>'+
      line2+'<div class="sstack">'+fmt(st.stack)+'</div>'+
      (showCards?'<div style="display:flex;gap:2px;margin-top:2px">'+st.cards.map(function(c){return card(c,'sm');}).join('')+'</div>':'')+'</div>';
    if(st.bet>0){var bx=CX+(pos.x-CX)*0.62,by=CY+(pos.y-CY)*0.62;h+='<div class="bet" style="left:'+bx+'px;top:'+by+'px">'+fmt(st.bet)+'</div>';}
  }
  // my cards + label
  var my=v.seats[mySeat];
  var cardsHtml='';
  if(my&&my.cards&&my.cards.length){
    var cn=my.cards.length,cw=(cn-1)*44+62;
    cardsHtml='<div class="abs" style="left:'+(195-cw/2)+'px;top:418px;height:90px;width:'+cw+'px;'+(my.folded?'opacity:.35':'')+'">'+my.cards.map(function(c,i){return '<div class="abs" style="left:'+(i*44)+'px;top:6px;transform:rotate('+((i-(cn-1)/2)*12)+'deg)">'+card(c,'lg')+'</div>';}).join('')+'</div>';
  }
  h+=cardsHtml;
  if(my&&my.bet>0){h+='<div class="bet" style="left:195px;top:402px">'+fmt(my.bet)+'</div>';}
  h+='<div class="abs" style="left:0;top:514px;width:390px;display:flex;justify-content:center"><div style="height:26px;padding:0 14px;border-radius:13px;background:#141917;border:1px solid '+(my&&my.isTurn?'#d8b45c':'#2a312d')+';font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px">'+esc(me.name)+(my&&my.isButton?' <span class="gold">D</span>':'')+' <span class="gold">'+fmt(me.stack)+'</span>'+(me.queued?'<span class="muted" style="font-weight:500">+'+fmt(me.queued)+' next hand</span>':'')+'</div></div>';
  h+=actionPanel(v);
  return h;
}

function actionPanel(v){
  var hand=v.hand,L=hand&&hand.legal,me=v.you;
  var p='<div class="abs" style="left:0;top:552px;width:390px;height:292px;background:#0f1311;border-top:1px solid #2a312d;padding:0 20px">';
  if(hand&&!hand.finished&&hand.turnId){
    var turnSeat=v.seats.filter(function(x){return x&&x.id===hand.turnId;})[0];
    p+='<div id="tbar" class="abs" style="left:0;top:-1px;width:0;height:3px;background:#d8b45c"></div>';
  }
  if(L){
    var lo=L.minRaiseTo,hi=L.maxRaiseTo;
    if(S.raiseTo===null||S.raiseTo<lo)S.raiseTo=lo;
    if(S.raiseTo>hi)S.raiseTo=hi;
    var allin=S.raiseTo>=hi;
    var label=L.currentBet===0?'Bet':'Raise to';
    p+='<div style="padding-top:16px;display:flex;align-items:baseline;justify-content:space-between"><div class="gold" style="font-size:12px;font-weight:700;letter-spacing:.14em">YOUR TURN</div>'+
      (L.canRaise?'<div class="muted" style="font-size:13px">'+label+' <span id="rval" class="disp" style="font-size:30px;line-height:1;color:#f2efe6;margin-left:4px">'+fmt(S.raiseTo)+'</span></div>':'<div class="muted" style="font-size:13px">Pot '+fmt(L.pot)+'</div>')+'</div>';
    if(L.canRaise){
      p+='<input id="rng" style="margin-top:10px" type="range" aria-label="Raise amount" min="'+lo+'" max="'+hi+'" value="'+S.raiseTo+'" oninput="onRange(this.value)">';
      p+='<div style="margin-top:6px;display:flex;gap:8px">'+
        '<button class="chip" onclick="quick(0.5)">½ pot</button><button class="chip" onclick="quick(0.75)">¾ pot</button><button class="chip" onclick="quick(1)">Pot</button><button class="chip" style="border-color:#d8b45c;color:#d8b45c;font-weight:700" onclick="quick(99)">All in</button></div>';
    } else { p+='<div style="height:82px"></div>'; }
    p+='<div style="margin-top:12px;display:flex;gap:8px">'+
      '<button class="act" style="flex:1;border:1px solid #2a312d;background:transparent" onclick="doAct(\'fold\')">Fold</button>'+
      (L.canCheck?'<button class="act" style="flex:1.2;background:#1d5a43" onclick="doAct(\'check\')">Check</button>':'<button class="act" style="flex:1.2;background:#1d5a43" onclick="doAct(\'call\')">'+(L.toCall>=L.stack?'Call all in ':'Call ')+fmt(L.toCall)+'</button>')+
      (L.canRaise?'<button id="rbtn" class="act" style="flex:1.2;background:#d8b45c;color:#14110a" onclick="doRaise()">'+(allin?'All in '+fmt(S.raiseTo):(L.currentBet===0?'Bet ':'Raise ')+fmt(S.raiseTo))+'</button>':'')+'</div>';
    p+='<div class="muted" style="margin-top:12px;font-size:12px;text-align:center">No-limit · minimum '+(L.currentBet===0?'bet ':'raise to ')+fmt(L.minRaiseTo)+'</div>';
  } else {
    p+='<div style="padding-top:22px;text-align:center">'+waitingBox(v)+'</div>';
  }
  return p+'</div>';
}

function waitingBox(v){
  var hand=v.hand,me=v.you,msg='';
  var el=v.seats.filter(function(s){return s&&s.stack>0;}).length;
  if(me.stack<=0&&!me.inHand&&!me.queued){
    return '<div class="disp" style="font-size:28px">You need chips</div><div class="muted small" style="margin:6px 0 14px">'+(me.isAdmin?'You are the banker. Buy in for yourself first.':'Ask the banker for chips. They will approve your request.')+'</div><button class="btn" onclick="S.sheet=true;render()">Buy in</button>';
  }
  if(!v.running){
    if(me.isAdmin) return '<div class="disp" style="font-size:28px">'+(v.handNo?'Game paused':'Ready when you are')+'</div><div class="muted small" style="margin:6px 0 14px">'+el+' player'+(el===1?'':'s')+' with chips. You need at least 2.</div><button class="btn" '+(el<2?'disabled':'')+' onclick="doStart()">'+(v.handNo?'Resume the game':'Start the game')+'</button>';
    return '<div class="disp" style="font-size:28px">Waiting for the admin</div><div class="muted small" style="margin-top:6px">The game starts when the admin is ready.</div>';
  }
  if(hand&&!hand.finished){
    var t=v.seats.filter(function(x){return x&&x.id===hand.turnId;})[0];
    var mine=v.seats[me.seat];
    if(mine&&mine.folded) msg='You folded. Waiting for the hand to finish.';
    else if(!me.inHand) msg='Waiting for the next hand.';
    else if(mine&&mine.allIn) msg='You are all in.';
    else msg=t?'Waiting for '+esc(t.name)+'.':'';
    return '<div class="disp" style="font-size:28px">'+msg+'</div>';
  }
  if(el<2) return '<div class="disp" style="font-size:28px">Waiting for players</div><div class="muted small" style="margin-top:6px">At least 2 players need chips.</div>';
  return '<div class="disp" style="font-size:28px">Next hand starting</div>';
}

function onRange(x){S.raiseTo=Number(x);var r=document.getElementById('rval');if(r)r.textContent=fmt(S.raiseTo);var L=S.view.hand.legal;var b=document.getElementById('rbtn');if(b)b.textContent=(S.raiseTo>=L.maxRaiseTo?'All in ':(L.currentBet===0?'Bet ':'Raise '))+fmt(S.raiseTo);}
function quick(f){
  var L=S.view.hand.legal;
  var target=f>=99?L.maxRaiseTo:Math.round(L.currentBet+f*(L.pot+L.toCall));
  S.raiseTo=Math.max(L.minRaiseTo,Math.min(L.maxRaiseTo,target));
  var r=document.getElementById('rng');if(r)r.value=S.raiseTo;onRange(S.raiseTo);
}
function doAct(t){api('act',{type:t}).catch(fail);}
function doRaise(){api('act',{type:'raise',amount:S.raiseTo}).catch(fail);}
function doStart(){api('start').catch(fail);}

// ---- menu sheet ----
function sheet(){
  var v=S.view,me=v.you,h='<div class="sheet">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between"><div class="disp" style="font-size:34px">Table menu</div><button onclick="S.sheet=false;render()" aria-label="Close menu" style="width:44px;height:44px;border:0;background:transparent;color:#f2efe6;font-size:28px">×</button></div>';
  h+='<div class="row" style="margin-top:8px"><div style="flex:1"><div class="muted small">ROOM CODE</div><div class="disp gold" style="font-size:34px;letter-spacing:.2em">'+esc(v.code)+'</div></div><button class="btn line" style="width:auto;padding:0 16px;height:44px;font-size:14px" onclick="share()">Share</button></div>';
  // buy-in
  h+='<div class="h2">'+(me.isAdmin?'BUY IN FOR YOURSELF':'REQUEST CHIPS')+'</div>';
  var pend=v.pending.filter(function(r){return r.playerId===me.id;})[0];
  if(pend&&!me.isAdmin) h+='<div class="row"><div style="flex:1"><div style="font-size:14px;font-weight:600">Waiting for the banker</div><div class="muted small">Requested '+fmt(pend.amount)+'</div></div></div>';
  else h+='<div style="display:flex;gap:8px"><input id="bamt" inputmode="numeric" placeholder="Amount (max '+fmt(v.settings.maxBuyin)+')" style="flex:1;height:48px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:16px;padding:0 14px"><button class="btn" style="width:110px" onclick="doBuyin()">'+(me.isAdmin?'Add':'Request')+'</button></div>';
  if(me.isAdmin){
    h+='<div class="h2">BANKER</div>';
    if(!v.pending.length) h+='<div class="muted small">No requests waiting.</div>';
    v.pending.forEach(function(r){
      h+='<div class="row" style="margin-bottom:8px"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">'+esc(r.name)+'</div><div class="muted small">wants '+fmt(r.amount)+'</div></div><button onclick="decide(\''+r.id+'\',false)" style="height:44px;padding:0 14px;border-radius:10px;border:1px solid #2a312d;background:transparent;color:#f2efe6;font-weight:600">No</button><button onclick="decide(\''+r.id+'\',true)" style="height:44px;padding:0 16px;border-radius:10px;border:0;background:#d8b45c;color:#14110a;font-weight:700">Approve</button></div>';
    });
    h+='<div style="margin-top:12px">'+(v.running?'<button class="btn ghost" onclick="api(\'pause\').catch(fail)">Pause after this hand</button>':'<button class="btn" onclick="doStart();S.sheet=false;render()">'+(v.handNo?'Resume the game':'Start the game')+'</button>')+'</div>';
    h+='<div class="h2">BLINDS AND TIMER</div><div style="display:flex;gap:8px"><div class="field" style="flex:1"><label for="s_sb">SMALL</label><input id="s_sb" inputmode="numeric" value="'+v.settings.sb+'"></div><div class="field" style="flex:1"><label for="s_bb">BIG</label><input id="s_bb" inputmode="numeric" value="'+v.settings.bb+'"></div><div class="field" style="flex:1"><label for="s_ts">TIMER (S)</label><input id="s_ts" inputmode="numeric" value="'+v.settings.turnSeconds+'"></div></div><button class="btn ghost" style="margin-top:8px" onclick="saveSettings()">Save from next hand</button>';
  }
  // players
  h+='<div class="h2">PLAYERS</div>';
  v.seats.filter(Boolean).forEach(function(s){
    h+='<div class="row" style="margin-bottom:6px"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">'+esc(s.name)+(s.isAdmin?' <span class="gold" style="font-size:11px">BANKER</span>':'')+(s.id===me.id?' <span class="muted" style="font-size:11px">YOU</span>':'')+'</div><div class="muted small">'+(s.connected?'Online':'Offline')+'</div></div><div style="font-size:15px;font-weight:700">'+fmt(s.stack)+'</div>'+
    (me.isAdmin?'<button aria-label="Adjust chips for '+esc(s.name)+'" onclick="adjust(\''+s.id+'\',\''+esc(s.name)+'\')" style="height:36px;padding:0 10px;border-radius:8px;border:1px solid #2a312d;background:transparent;color:#a3aba5;font-size:12px">Adjust</button>':'')+'</div>';
  });
  // statement
  h+='<div class="h2">MY STATEMENT</div>';
  var net=me.stack+me.queued-me.bought;
  h+='<div style="display:flex;gap:8px"><div class="row" style="flex:1;display:block;padding:10px 12px"><div class="muted" style="font-size:11px;letter-spacing:.1em">BOUGHT IN</div><div class="disp" style="font-size:28px">'+fmt(me.bought)+'</div></div><div class="row" style="flex:1;display:block;padding:10px 12px"><div class="muted" style="font-size:11px;letter-spacing:.1em">NET</div><div class="disp" style="font-size:28px;color:'+(net<0?'#f08a8f':'#f2efe6')+'">'+(net<0?'−':'')+fmt(Math.abs(net))+'</div></div></div>';
  h+=chart(v.history);
  v.ledger.slice().reverse().forEach(function(l){
    h+='<div class="row" style="margin-top:6px;min-height:44px"><div class="muted" style="width:62px;font-size:13px">'+new Date(l.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div><div style="flex:1;font-size:14px;font-weight:600">'+(l.kind==='buyin'?'Buy-in':'Banker adjustment')+(l.reason?' <span class="muted" style="font-weight:400">'+esc(l.reason)+'</span>':'')+'</div><div style="font-size:14px;font-weight:600">'+(l.amount>0?'+':'−')+fmt(Math.abs(l.amount))+'</div></div>';
  });
  // log
  h+='<div class="h2">RECENT</div>';
  v.log.slice().reverse().forEach(function(l){h+='<div class="muted small" style="padding:3px 0">'+esc(l.text)+'</div>';});
  h+='<div style="margin-top:24px;display:flex;flex-direction:column;gap:10px">'+(me.isAdmin?'':'<button class="btn ghost" onclick="doLeave()">Leave the table</button>')+'<button class="btn ghost" onclick="forget()">Switch table (stay seated)</button></div>';
  h+='<div style="margin:22px auto 0;width:100px;height:140px" class="poster"><img alt="" src="'+pickPoster()+'"></div>';
  return h+'</div>';
}
function chart(hist){
  if(!hist||hist.length<2) return '';
  var W=350,H=150,L=8,R=8,T=12,B=12,vals=hist.map(function(x){return x.stack;});
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals); if(hi===lo){hi+=1;lo-=1;}
  var pts=vals.map(function(v,i){return (L+(W-L-R)*i/(vals.length-1)).toFixed(1)+','+(T+(H-T-B)*(1-(v-lo)/(hi-lo))).toFixed(1);}).join(' ');
  return '<div style="margin-top:8px;padding:12px;border-radius:12px;background:#141917;border:1px solid #2a312d"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Stack after each hand</div><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Line chart of your stack after each hand"><polyline points="'+pts+'" fill="none" stroke="#f2efe6" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="muted" style="font-size:11px;display:flex;justify-content:space-between"><span>Low '+fmt(lo)+'</span><span>High '+fmt(hi)+'</span></div></div>';
}
function share(){
  var url=location.origin+location.pathname+'?room='+S.view.code;
  if(navigator.share){navigator.share({title:'Join my poker table',text:'Room code '+S.view.code,url:url}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast('Link copied');});}
}
function doBuyin(){var a=val('bamt');api('buyin',{amount:a}).then(function(){toast(S.view.you.isAdmin?'Chips added':'Request sent');}).catch(fail);}
function decide(id,ok){api('approve',{reqId:id,ok:ok}).catch(fail);}
function adjust(pid,name){var a=prompt('Chips to add for '+name+' (use a minus sign to remove):');if(a===null)return;var why=prompt('Reason (optional):')||'';api('adjust',{playerId:pid,delta:a,reason:why}).catch(fail);}
function saveSettings(){api('settings',{settings:{sb:val('s_sb'),bb:val('s_bb'),turnSeconds:val('s_ts'),maxBuyin:S.view.settings.maxBuyin}}).then(function(){toast('Saved');}).catch(fail);}
function doLeave(){if(!confirm('Leave the table and cash out your chips?'))return;api('leave').then(function(){clearSession();render();}).catch(fail);}
function forget(){clearSession();render();}

// ---- render ----
function render(){
  var active=document.activeElement&&document.activeElement.id, keep=null;
  if(active&&/^(room|nick|sb|bb|ts|mb|bamt|s_sb|s_bb|s_ts)$/.test(active)){keep={id:active,v:document.activeElement.value,s:document.activeElement.selectionStart};}
  // typing in a field must never be wiped by a live update: skip re-render while an input is focused
  if(keep&&S.view&&S.sheet&&/^(bamt|s_sb|s_bb|s_ts)$/.test(keep.id)) return;
  var old=document.querySelector('.sheet'),sc=old?old.scrollTop:0;
  var h=S.view?(table()+(S.sheet?sheet():'')):lobby();
  if(S.toast) h+='<div class="toast">'+esc(S.toast)+'</div>';
  $stage.innerHTML=h;
  var nw=document.querySelector('.sheet');if(nw)nw.scrollTop=sc;
  if(keep){var e=document.getElementById(keep.id);if(e){e.value=keep.v;e.focus();try{e.setSelectionRange(keep.s,keep.s);}catch(x){}}}
}
// countdown bar for the player whose turn it is
setInterval(function(){
  var b=document.getElementById('tbar'); if(!b||!S.view||!S.view.hand||!S.view.hand.deadline)return;
  var total=S.view.settings.turnSeconds*1000, left=S.view.hand.deadline+S.offset-Date.now();
  b.style.width=Math.max(0,Math.min(1,left/total))*390+'px';
},250);

// ---- start up ----
(function(){
  var hs=(location.hash.match(/^#s=([A-Z0-9]+):([a-f0-9]+):([a-f0-9]+)$/)||[]);
  if(hs.length){S.code=hs[1];S.token=hs[2];S.pid=hs[3];saveSession();history.replaceState(null,'',location.pathname);connect();render();return;}
  try{var s=JSON.parse(localStorage.getItem('poker-session')||'null'); if(s&&s.code&&s.token){S.code=s.code;S.token=s.token;S.pid=s.pid;connect();requestWake();}}catch(e){}
  render();
})();
</script>
</body>
</html>
