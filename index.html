function copyText(t) {
  try { navigator.clipboard.writeText(t); toast('Copied'); }
  catch (e) { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('Copied'); }
}

// ---------------------------------------------------------------- history
// What a game can be found by: what was played, who played it, and when. The date is matched
// against the way it is printed on the card, so looking for "24 Nov" finds what you can see.
function historyMatch(g, q) {
  if (!q) return true;
  q = q.toLowerCase();
  var hay = [g.formatName, g.variantName, g.title, when(g.startedAt), g.winner || '']
    .concat((g.people || []).map(function (p) { return p.name; })).join(' ').toLowerCase();
  return hay.indexOf(q) >= 0;
}
function historyInRange(g) {
  var at = g.startedAt || g.at;
  if (S.hFrom) { var f = new Date(S.hFrom); f.setHours(0, 0, 0, 0); if (at < f.getTime()) return false; }
  if (S.hTo) { var t = new Date(S.hTo); t.setHours(23, 59, 59, 999); if (at > t.getTime()) return false; }
  return true;
}
function historyShown() {
  return S.history.filter(function (g) { return historyMatch(g, S.hq || '') && historyInRange(g); });
}
// The whole screen is never redrawn while somebody is typing in it - that is what keeps the
// caret where they put it - so searching replaces only the list of games underneath. A full
// render() here would either be refused by that guard, leaving a stale list, or would take the
// search box away mid-word.
function historyPaint() {
  var el = document.getElementById('hlist');
  if (el) el.innerHTML = historyList();
  var n = document.getElementById('hcount');
  if (n) n.innerHTML = historyCount();
  var b = document.getElementById('hbooks');
  if (b) b.innerHTML = theBooks();
  var c = document.getElementById('hclear');
  if (c) c.innerHTML = clearButton();
}
function historySearch() { S.hq = val('cp_hq'); historyPaint(); }
function historyDates() {
  var f = document.getElementById('cp_from'), t = document.getElementById('cp_to');
  S.hFrom = f ? f.value : ''; S.hTo = t ? t.value : '';
  historyPaint();
}
function historyClear() { S.hq = ''; S.hFrom = ''; S.hTo = ''; render(); }
// Only the id travels through the markup. Putting the game's name in there instead looked
// tidier right up until "Texas Hold'em" - the apostrophe comes back out of the attribute as a
// quote and ends the string early, taking the rest of the handler with it.
function removeGame(id) {
  var g = S.history.filter(function (x) { return x.id === id; })[0];
  if (!g) return;
  S.ask = {
    title: 'Remove this game?',
    detail: g.formatName + ' on ' + when(g.startedAt)
      + ' goes from the records for everybody who played in it, along with its accounts and replays. This cannot be undone.',
    yes: 'Yes, remove it',
    go: "doRemoveGame('" + id + "')",
  };
  render();
}
function doRemoveGame(id) {
  S.ask = null;
  api('history-remove', { id: id }).then(function () { toast('Removed'); return refresh(); }).catch(fail);
}

function historyCount() {
  var all = S.history.length, shown = historyShown().length;
  if (!(S.hq || S.hFrom || S.hTo)) return '';
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">'
    + '<div class="muted small">' + shown + ' of ' + all + ' game' + (all === 1 ? '' : 's') + '</div>'
    + '<button class="rolechip" onclick="historyClear()">Clear</button></div>';
}
function historyTab() {
  if (!S.history.length) return '<div class="evc" style="margin-top:16px"><div class="muted small">No games on record yet. They appear here when a game ends.</div></div>';
  var h = '<div class="h2">PAST GAMES</div>'
    + '<div class="muted small" style="margin:-2px 2px 8px;white-space:normal">'
    + (S.me && S.me.isAdmin ? 'Every game in the portal. Search by game, by a player\u2019s name, or by the dates.'
                            : 'The games you played in. Search by game, by who was at the table, or by the dates.')
    + '</div>';
  h += '<div class="evc"><div style="display:flex;gap:8px">'
    + '<input id="cp_hq" placeholder="Texas, Omaha, a name&hellip;" value="' + esc(S.hq || '') + '" oninput="historySearch()" '
    + 'style="flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:15px;padding:0 12px;font-family:inherit"></div>'
    + '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">'
    + '<input id="cp_from" type="date" value="' + esc(S.hFrom || '') + '" onchange="historyDates()" style="flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:13px;padding:0 10px;font-family:inherit">'
    + '<span class="muted small">to</span>'
    + '<input id="cp_to" type="date" value="' + esc(S.hTo || '') + '" onchange="historyDates()" style="flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:13px;padding:0 10px;font-family:inherit"></div>'
    + '<div id="hcount">' + historyCount() + '</div>'
    + '</div>';
  return h + '<div id="hbooks">' + theBooks() + '</div><div id="hlist">' + historyList() + '</div>'
    + '<div id="hclear">' + clearButton() + '</div>';
}

// Everything the portal knows about who is up and who is down, over whatever the search is
// currently showing - so the same date box that finds October's games also answers how October
// went. The portal admin keeps the scores, so this is his; a member's own standing is on his Me
// screen, where it is about him rather than about everybody.
function bookRows(games) {
  var by = {};
  games.forEach(function (g) {
    (g.people || []).forEach(function (pl) {
      var k = pl.memberId || pl.name;
      var r = by[k] = by[k] || { id: k, name: pl.name, games: 0, inn: 0, out: 0, net: 0, best: 0, worst: 0 };
      r.games += 1; r.inn += pl.invested || 0; r.out += pl.final || 0; r.net += pl.net || 0;
      if ((pl.net || 0) > r.best) r.best = pl.net;
      if ((pl.net || 0) < r.worst) r.worst = pl.net;
    });
  });
  return Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) { return b.net - a.net; });
}

function theBooks() {
  if (!(S.me && S.me.isAdmin)) return '';
  var games = historyShown();
  if (!games.length) return '';
  var rows = bookRows(games);
  var hands = games.reduce(function (a, g) { return a + (g.hands || 0); }, 0);
  var inn = rows.reduce(function (a, r) { return a + r.inn; }, 0);
  var h = '<div class="h2">CHIP STANDINGS</div>'
    + '<div class="evc"><div class="muted small" style="white-space:normal;margin-bottom:8px">'
    + games.length + ' game' + (games.length === 1 ? '' : 's') + ' &middot; ' + fmt(hands) + ' hands dealt &middot; '
    + fmt(inn) + ' chips in'
    + '</div>';
  rows.forEach(function (r) {
    h += '<div class="row" style="min-height:44px"><div style="flex:1;min-width:0">'
      + '<div style="font-size:14px;font-weight:600">' + esc(r.name) + '</div>'
      + '<div class="muted small">' + r.games + ' game' + (r.games === 1 ? '' : 's')
      + ' &middot; in ' + fmt(r.inn) + ' &middot; out ' + fmt(r.out)
      + (r.games > 1 ? ' &middot; best ' + (r.best > 0 ? '+' : '') + fmt(r.best) + ', worst ' + fmt(r.worst) : '')
      + '</div></div>'
      + '<div style="text-align:right"><div style="font-weight:700;color:'
      + (r.net > 0 ? '#7ddba0' : r.net < 0 ? '#f08a8f' : '#a3aba5') + '">'
      + (r.net > 0 ? '+' : '') + fmt(r.net) + '</div>'
      + '</div></div>';
  });
  // The one figure that proves the rest: chips are neither made nor destroyed, so every game's
  // wins and losses have to cancel. If this is not zero something upstream is wrong, and seeing
  // it beats trusting it.
  var sum = rows.reduce(function (a, r) { return a + r.net; }, 0);
  h += '<div class="muted small" style="margin-top:8px;border-top:1px solid #2a312d;padding-top:8px">'
    + (sum === 0 ? 'Wins and losses cancel exactly, as they must.'
                 : '<span style="color:#f08a8f">These games are out by ' + fmt(sum) + ' - tell Claude.</span>')
    + '</div></div>';
  return h;
}

// ---- drawing ----
// Hand-rolled SVG rather than a charting library: two shapes are all this needs, and a library
// would be larger than the rest of the app put together for the privilege.
function lineChart(series, opts) {
  opts = opts || {};
  var W = 350, H = opts.height || 140, L = 34, B = 18, T = 8;
  var pts = [];
  series.forEach(function (s) { s.points.forEach(function (p) { pts.push(p); }); });
  if (pts.length < 2) return '<div class="muted small">Not enough played to draw a line yet.</div>';
  var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  if (opts.zero) { y0 = Math.min(0, y0); y1 = Math.max(0, y1); }
  if (y1 === y0) { y1 = y0 + 1; }
  var pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  var X = function (v) { return L + (x1 === x0 ? 0 : (v - x0) / (x1 - x0)) * (W - L - 6); };
  var Y = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };

  var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" style="display:block">';
  // a line at nothing, so up and down are obvious at a glance
  if (y0 < 0 && y1 > 0) {
    g += '<line x1="' + L + '" y1="' + Y(0).toFixed(1) + '" x2="' + (W - 6) + '" y2="' + Y(0).toFixed(1) + '" stroke="#3a443e" stroke-dasharray="3 3"/>';
  }
  // The axis says what the line says. A graph labelled in chips under a figure read in big blinds
  // is two different stories about the same evening.
  var axis = opts.bb ? function (v) { return Math.round(v / opts.bb) + 'bb'; } : function (v) { return kfmt(Math.round(v)); };
  g += '<text x="2" y="' + (Y(y1) + 9).toFixed(1) + '" fill="#a3aba5" font-size="9">' + axis(y1) + '</text>';
  g += '<text x="2" y="' + Y(y0).toFixed(1) + '" fill="#a3aba5" font-size="9">' + axis(y0) + '</text>';
  series.forEach(function (sr) {
    var d = sr.points.map(function (pt, i) { return (i ? 'L' : 'M') + X(pt[0]).toFixed(1) + ' ' + Y(pt[1]).toFixed(1); }).join(' ');
    g += '<path d="' + d + '" fill="none" stroke="' + sr.colour + '" stroke-width="' + (sr.thick ? 2.4 : 1.2) + '"'
      + (sr.thick ? '' : ' opacity=".5"') + ' stroke-linejoin="round" stroke-linecap="round"/>';
    if (sr.thick) {
      var last = sr.points[sr.points.length - 1];
      g += '<circle cx="' + X(last[0]).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) + '" r="3" fill="' + sr.colour + '"/>';
    }
  });
  g += '</svg>';
  if (opts.xlabel) g += '<div class="muted small" style="text-align:center;margin-top:2px">' + opts.xlabel + '</div>';
  return g;
}

// how a night went for everybody, with your own line picked out
function gameCurve(g) {
  var curve = g.curve || {};
  var meRow = (g.people || []).filter(function (p) { return p.memberId === (S.me && S.me.id); })[0];
  var series = [];
  (g.people || []).forEach(function (p) {
    var line = curve[p.id];
    if (!line || line.length < 2) return;
    series.push({ points: line, colour: meRow && p.id === meRow.id ? '#d8b45c' : '#6f8a7b', thick: !!(meRow && p.id === meRow.id) });
  });
  if (!series.length) return '';
  return '<div class="h2" style="margin:12px 0 4px">CHIPS THROUGH THE NIGHT</div>'
    + lineChart(series, { xlabel: 'hand 1 to ' + g.hands + (meRow ? ' &middot; your line in gold' : '') });
}

// what the portal has done to you over the months
function overallCurve() {
  var meId = S.me && S.me.id;
  var games = (S.history || []).slice().filter(function (g) {
    return (g.people || []).some(function (p) { return p.memberId === meId; });
  }).sort(function (a, b) { return a.at - b.at; });
  if (games.length < 2) return '';
  var run = 0, pts = [];
  games.forEach(function (g, i) {
    var mine = g.people.filter(function (p) { return p.memberId === meId; })[0];
    run += mine ? mine.net : 0;
    pts.push([i + 1, run]);
  });
  return '<div class="h2">WHERE YOU STAND</div>'
    + '<div class="evc">' + lineChart([{ points: pts, colour: run >= 0 ? '#7ddba0' : '#f08a8f', thick: true }], { zero: true, xlabel: games.length + ' games &middot; running total' })
    + '<div style="display:flex;justify-content:space-between;margin-top:8px">'
    + '<div class="muted small">' + games.length + ' games played</div>'
    + '<div style="font-weight:700;color:' + (run > 0 ? '#7ddba0' : run < 0 ? '#f08a8f' : '#a3aba5') + '">'
    + (run > 0 ? '+' : '') + fmt(run) + '</div></div></div>';
}

// Clearing out a batch: the trial games, or a run of nights that went wrong. It removes exactly
// what the search is showing, so you narrow it down, look at what is left, and then clear that -
// rather than naming a date range to a thing you cannot see.
function clearButton() {
  if (!(S.me && S.me.isAdmin)) return '';
  var shown = historyShown();
  if (!shown.length) return '';
  var filtered = !!(S.hq || S.hFrom || S.hTo);
  return '<button class="btn ghost" style="margin-top:14px;border-color:#6b2a2e;color:#d2454d" onclick="clearShown()">'
    + (filtered ? 'Remove these ' + shown.length + ' game' + (shown.length === 1 ? '' : 's')
                : 'Remove all ' + shown.length + ' game' + (shown.length === 1 ? '' : 's'))
    + '</button>'
    + (filtered ? '' : '<div class="muted small" style="margin-top:6px;white-space:normal">Search or set dates first if you only want some of them gone.</div>');
}

function clearShown() {
  var shown = historyShown();
  if (!shown.length) return;
  S.ask = {
    title: 'Remove ' + shown.length + ' game' + (shown.length === 1 ? '' : 's') + '?',
    detail: 'They go from the records for everybody who played in them, with their scores and replays. This cannot be undone.',
    yes: 'Yes, remove them',
    go: 'doClearShown()',
  };
  render();
}
function doClearShown() {
  var ids = historyShown().map(function (g) { return g.id; });
  S.ask = null;
  api('history-clear', { ids: ids }).then(function (j) {
    toast(j.removed + ' removed');
    S.hq = ''; S.hFrom = ''; S.hTo = '';
    return refresh();
  }).catch(fail);
}

function historyList() {
  var shown = historyShown();
  if (!shown.length) return '<div class="evc"><div class="muted small">Nothing matches that. Try a different word, or clear the dates.</div></div>';
  var h = '';
  shown.forEach(function (g) {
    var open = S.open[g.id];
    h += '<div class="evc"><div style="cursor:pointer" onclick="S.open[\'' + g.id + '\']=!S.open[\'' + g.id + '\'];render()">'
      + '<div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0">'
      + '<div class="disp" style="font-size:22px;line-height:1.1">' + esc(g.formatName) + (g.variantName ? ' <span class="muted" style="font-size:13px">' + esc(g.variantName) + '</span>' : '') + '</div>'
      + '<div class="muted small">' + when(g.startedAt) + ' &middot; ' + g.people.length + ' players &middot; ' + g.hands + ' hands</div></div>'
      + '<div class="muted" style="font-size:18px">' + (open ? '&#9652;' : '&#9662;') + '</div></div></div>';
    if (open) {
      if (g.winner) h += '<div class="muted small" style="margin-top:8px"><span class="gold">' + esc(g.winner) + '</span> won. ' + g.losers.map(esc).join(', ') + ' did not.</div>';
      h += '<div style="margin-top:10px">';
      g.people.slice().sort(function (a, b) { return b.net - a.net; }).forEach(function (p) {
        h += '<div class="row" style="margin-top:6px;min-height:40px"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">' + esc(p.name) + '</div>'
          + '<div class="muted small">in ' + fmt(p.invested) + ' &middot; out ' + fmt(p.final) + '</div></div>'
          + '<div style="font-weight:700;color:' + (p.net > 0 ? '#7ddba0' : p.net < 0 ? '#f08a8f' : '#a3aba5') + '">' + (p.net > 0 ? '+' : '') + fmt(p.net) + '</div>'
          + (S.me && S.me.isAdmin
            ? '<button class="rolechip" onclick="scoreSheet(\'' + g.id + '\',\'' + esc(p.id) + '\')">PDF</button>'
            : '')
          + '</div>';
      });
      h += '</div>';
      // your own score for the night, before the rest of the table's
      var mine = g.people.filter(function (p) { return p.memberId === (S.me && S.me.id); })[0];
      if (mine) {
        h += '<div class="h2" style="margin:12px 0 4px">YOUR SCORE</div>'
          + '<div class="evc" style="margin:0">'
          + acctRow('Chips in', fmt(mine.invested))
          + acctRow('Chips out', fmt(mine.final))
          + acctRow(mine.net >= 0 ? 'You are up' : 'You are down',
              '<span style="color:' + (mine.net > 0 ? '#7ddba0' : mine.net < 0 ? '#f08a8f' : '#a3aba5') + '">' + (mine.net > 0 ? '+' : '') + fmt(mine.net) + '</span>')
          + '</div>';
      }
      h += gameCurve(g);

      if (g.studied && S.me.isAdmin) {
        h += '<button class="btn ghost" style="margin-top:12px" onclick="openReview(\'' + g.id + '\')">Look at the night</button>'
          + '<button class="btn ghost" style="margin-top:8px" onclick="exportHands(\'' + g.id + '\')">Export the Texas hands</button>';
      }
      h += '<button class="btn ghost" id="sheetbtn" style="margin-top:12px" onclick="scoreSheet(\'' + g.id + '\')">Score sheet (PDF)</button>';
      if (g.replays) h += '<button class="btn ghost" style="margin-top:8px" onclick="loadReplay(\'' + g.id + '\')">Best ' + g.replays + ' hands</button>';
      // Trial games and games that went wrong should not sit in the records for ever. Only the
      // portal admin can throw one away, and it goes for everybody who played in it.
      if (S.me && S.me.isAdmin) {
        h += '<button class="btn ghost" style="margin-top:8px;border-color:#6b2a2e;color:#d2454d" onclick="removeGame(\'' + g.id + '\')">Remove from the records</button>';
      }
    }
    h += '</div>';
  });
  return h;
}
function acctRow(k, v) {
  return '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid #1d2420">'
    + '<div class="muted small">' + k + '</div><div style="font-size:14px;font-weight:700">' + v + '</div></div>';
}

function loadReplay(id) { api('replay', { id: id }).then(function (j) { S.replay = { id: id, rounds: j.rounds, i: 0 }; render(); }).catch(fail); }

// ---------------------------------------------------------------- me / portal
// ---- the standings, across every game ----
// The portal admin is the only person who sees all of this. A member's own history answers how
// his nights have gone; this answers how the group is going, which is a different question and
// the one somebody keeping the scores actually needs.
function allStats() {
  var per = {}, hands = 0, first = 0;
  (S.history || []).forEach(function (g) {
    hands += g.hands || 0;
    var at = g.startedAt || g.at;
    if (at && (!first || at < first)) first = at;
    (g.people || []).forEach(function (pl) {
      var k = pl.memberId || pl.name;
      var r = per[k] = per[k] || { id: pl.memberId, name: pl.name, games: 0, invested: 0, final: 0, net: 0, best: null, worst: null };
      r.games += 1; r.invested += pl.invested || 0; r.final += pl.final || 0; r.net += pl.net || 0;
      if (r.best === null || pl.net > r.best) r.best = pl.net;
      if (r.worst === null || pl.net < r.worst) r.worst = pl.net;
    });
  });
  var rows = [];
  for (var k in per) if (per.hasOwnProperty(k)) rows.push(per[k]);
  rows.sort(function (a, b) { return b.net - a.net; });
  return { rows: rows, hands: hands, first: first, games: (S.history || []).length };
}

function statsBlock() {
  var st = allStats();
  var h = '<div class="h2">THE PORTAL SO FAR</div>';
  if (!st.games) {
    return h + '<div class="evc"><div class="muted small" style="white-space:normal">No games on record yet. '
      + 'Everything here fills in as soon as a game ends.</div></div>';
  }
  h += '<div class="evc">'
    + acctRow('Games on record', fmt(st.games))
    + acctRow('Hands dealt', fmt(st.hands))
    + (st.first ? acctRow('First game', when(st.first)) : '')
    + '</div>';

  h += '<div class="h2">WHERE EVERYBODY STANDS</div>'
    + '<div class="muted small" style="margin:-2px 2px 8px;white-space:normal">Every game in the portal, '
    + 'added up. Tap a night under History for the detail.</div>';
  st.rows.forEach(function (r) {
    h += '<div class="row" style="margin-top:6px;min-height:46px"><div style="flex:1;min-width:0">'
      + '<div style="font-size:14px;font-weight:600">' + esc(r.name) + '</div>'
      + '<div class="muted small">' + r.games + (r.games === 1 ? ' game' : ' games')
      + ' &middot; in ' + fmt(r.invested) + ' &middot; out ' + fmt(r.final)
      + (r.best !== null ? ' &middot; best ' + (r.best > 0 ? '+' : '') + fmt(r.best) : '')
      + (r.worst !== null ? ' &middot; worst ' + fmt(r.worst) : '')
      + '</div></div>'
      + '<div style="font-weight:700;color:' + (r.net > 0 ? '#7ddba0' : r.net < 0 ? '#f08a8f' : '#a3aba5') + '">'
      + (r.net > 0 ? '+' : '') + fmt(r.net) + '</div></div>';
  });

  h += '<div class="muted small" style="margin:12px 2px 0;white-space:normal">' + CHIPS_ONLY[0] + '</div>';
  return h;
}

// The Portal tab, a section at a time.
//
// It had grown into one long page: your total, your name and passcode, notifications, the
// portal's totals, where everybody stands,
// the analysis, the groups, the members, who is waiting, who has gone, and where it is all
// stored - a dozen things, each found by scrolling past the rest. Now there is a row of sections
// across the top and one of them on the screen. A secondary member has only himself to look at,
// so he gets no row at all.
function portalSections() {
  var all = S.members || [];
  if (S.me.isAdmin) {
    var waiting = all.filter(function (m) { return m.status === 'pending'; }).length;
    return [
      { id: 'me', name: 'Me' },
      { id: 'notes', name: 'Inbox', n: S.mail && S.mail.unread },
      { id: 'members', name: 'Members', n: waiting },
      { id: 'standings', name: 'Standings' },
      { id: 'analysis', name: 'Analysis' },
      { id: 'groups', name: 'Groups' },
    ];
  }
  var out = [{ id: 'me', name: 'Me' }, { id: 'notes', name: 'Messages', n: S.mail && S.mail.unread }];
  if (S.induct) out.push({ id: 'people', name: 'My people' });
  if (S.me.canOpen) out.push({ id: 'groups', name: 'Groups' });
  return out;
}
function sectionBar(secs, cur) {
  if (secs.length < 2) return '';
  var h = '<div id="secs" style="display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px">';
  secs.forEach(function (x) {
    h += '<button class="rolechip' + (x.id === cur ? ' on' : '') + '" style="flex:none;height:38px;padding:0 14px;font-size:13px" onclick="S.sec=\'' + x.id + '\';render()">'
      + x.name
      + (x.n ? ' <span style="display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;margin-left:4px;font-size:11px;text-align:center;color:#14110a;background:'
        + (x.bad ? '#e0626a' : '#d8b45c') + '">' + x.n + '</span>' : '')
      + '</button>';
  });
  return h + '</div>';
}

function meTab() {
  var secs = portalSections();
  var cur = secs.some(function (x) { return x.id === S.sec; }) ? S.sec : 'me';
  var h = sectionBar(secs, cur);
  if (cur === 'notes') return h + notesBlock();
  if (cur === 'members') return h + membersBlock();
  if (cur === 'standings') return h + statsBlock();
  if (cur === 'analysis') return h + studyBlock();
  if (cur === 'groups') return h + groupsBlock();
  if (cur === 'people') return h + myMembersBlock();
  return h + myOwnSection();
}

// Himself: where he stands over every game, then the things he changes once and forgets.
function myOwnSection() {
  var h = overallCurve();
  h += '<div class="h2">MY ACCOUNT</div>'
    + '<div class="evc"><div class="muted small">SIGNED IN AS</div>'
    + '<div class="disp" style="font-size:26px">' + esc(S.me.name) + '</div>'
    + '<div class="muted small">' + esc(S.me.phone) + '</div>'
    + (S.me.nick ? '<div class="muted small" style="margin-top:2px">goes by <b>' + esc(S.me.nick) + '</b> at the table</div>' : '')
    + '<button class="btn ghost" style="margin-top:12px" onclick="S.editName=!S.editName;render()">Change my name</button>';
  if (S.editName) {
    h += field('nm_name', 'MY NAME', 'text', '', '', S.me.name)
      + field('nm_nick', 'WHAT I GO BY AT THE TABLE', 'text', 'same as my name', '', S.me.nick || '')
      + '<div class="muted small" style="margin:-4px 2px 8px;white-space:normal">Leave the second one empty to use your name. '
      + 'It sits under your seat, so keep it short.</div>'
      + '<button class="btn" onclick="doRename()">Save</button>';
  }
  h += '<button class="btn ghost" style="margin-top:8px" onclick="S.changePin=!S.changePin;render()">Change my passcode</button>';
  if (S.changePin) {
    h += field('cp_old', 'CURRENT PASSCODE', 'password', '', 'numeric') + field('cp_new', 'NEW PASSCODE', 'password', '', 'numeric')
      + '<button class="btn" style="margin-top:10px" onclick="doChangePin()">Save</button>';
  }
  h += '<button class="btn ghost" style="margin-top:8px" onclick="signOut()">Sign out of this phone</button></div>';

  h += authSection();

  // being told when a table goes up
  var ps = pushState();
  h += '<div class="h2">TELL ME WHEN A TABLE IS UP</div><div class="evc">';
  if (ps === 'on') {
    h += '<div class="muted small" style="white-space:normal">This phone will be told when somebody starts a table, '
      + 'when anyone asks to join a table you are running, and when you are let into one.</div>'
      + '<div style="display:flex;gap:8px;margin-top:10px">'
      + '<button class="btn ghost" style="flex:1" onclick="pushTest()">Send me a test</button>'
      + '<button class="btn ghost" style="flex:1" onclick="pushOff()">Turn off</button></div>';
  } else if (ps === 'off') {
    h += '<div class="muted small" style="white-space:normal">Rather than watching the group chat, let your phone tell you.</div>'
      + '<button class="btn" style="margin-top:10px" onclick="pushOn()">Turn on notifications</button>';
  } else if (ps === 'homescreen') {
    h += '<div class="muted small" style="white-space:normal">On an iPhone this works once the portal is on your home screen. '
      + 'Tap the share button in Safari, then <b>Add to Home Screen</b>, and open the portal from there.</div>';
  } else if (ps === 'blocked') {
    h += '<div class="muted small" style="white-space:normal">Your phone is refusing notifications from the portal. '
      + 'Turn them back on in your phone\'s settings, under notifications, then come back here.</div>';
  } else {
    h += '<div class="muted small" style="white-space:normal">This phone cannot take notifications from a web app.</div>';
  }
  h += '</div>';

  if (S.me.isAdmin) {
    h += '<div class="h2">STORAGE AND BACKUP</div><div class="muted small">' + esc(S.storage || '') + (S.saveError ? '<br><span style="color:#f08a8f">' + esc(S.saveError) + '</span>' : '') + '</div>'
      + '<button class="btn ghost" style="margin-top:10px" onclick="downloadBackup()">Download a backup</button>'
      + '<div class="muted small" style="margin-top:6px;white-space:normal">Everything is kept in one file in one place. This gives you a copy of every member and game to keep '
      + 'somewhere else - your Files, or an email to yourself. It leaves out passcodes and sign-ins, so the copy cannot be used to get in as anybody. Take one now and then, and after any big night.</div>';
  }
  return h + ownerLine();
}

// ---------------------------------------------------------------- the authenticator
// A QR code, drawn here so that nothing about a member's secret ever leaves the portal for some
// picture-making service. Byte mode, the lightest error correction, sizes 1 to 9: room for 230
// characters, and the link an authenticator wants is about a hundred.
var QR_L = [null, [26, 7, 1], [44, 10, 1], [70, 15, 1], [100, 20, 1], [134, 26, 1], [172, 18, 2], [196, 20, 2], [242, 24, 2], [292, 30, 2]];
var QR_ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46]];
function qrMatrix(text) {
  var bytes = [], i, j;
  var utf = unescape(encodeURIComponent(String(text)));
  for (i = 0; i < utf.length; i++) bytes.push(utf.charCodeAt(i));
  var ver = 0;
  for (i = 1; i <= 9; i++) { if (bytes.length + 2 <= QR_L[i][0] - QR_L[i][1] * QR_L[i][2]) { ver = i; break; } }
  if (!ver) return null;
  var total = QR_L[ver][0], ecLen = QR_L[ver][1], blocks = QR_L[ver][2], dataLen = total - ecLen * blocks;

  // the message: what kind, how long, the bytes, then padding to fill
  var bits = [];
  var put = function (v, n) { for (var k = n - 1; k >= 0; k--) bits.push((v >>> k) & 1); };
  put(4, 4); put(bytes.length, 8);
  bytes.forEach(function (b) { put(b, 8); });
  for (i = 0; i < 4 && bits.length < dataLen * 8; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  var data = [];
  for (i = 0; i < bits.length; i += 8) { var v = 0; for (j = 0; j < 8; j++) v = (v << 1) | bits[i + j]; data.push(v); }
  for (i = 0; data.length < dataLen; i++) data.push(i % 2 ? 0x11 : 0xEC);

  // the arithmetic the correction codes are done in
  var exp = [], log = [], x = 1;
  for (i = 0; i < 255; i++) { exp[i] = x; log[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; }
  var mul = function (a, b) { return a && b ? exp[(log[a] + log[b]) % 255] : 0; };
  var gen = [1];
  for (i = 0; i < ecLen; i++) {
    var next = [];
    for (j = 0; j <= gen.length; j++) next[j] = (j < gen.length ? mul(gen[j], exp[i]) : 0) ^ (j > 0 ? gen[j - 1] : 0);
    gen = next;
  }
  // gen is lowest power first; the remainder of data * x^ecLen divided by it
  var correction = function (block) {
    var rem = [];
    for (var k = 0; k < ecLen; k++) rem.push(0);
    block.forEach(function (b) {
      var f = b ^ rem.shift(); rem.push(0);
      for (var k2 = 0; k2 < ecLen; k2++) rem[k2] ^= mul(gen[ecLen - 1 - k2], f);
    });
    return rem;
  };
  var per = dataLen / blocks, dBlocks = [], eBlocks = [];
  for (i = 0; i < blocks; i++) { var blk = data.slice(i * per, (i + 1) * per); dBlocks.push(blk); eBlocks.push(correction(blk)); }
  var stream = [];
  for (i = 0; i < per; i++) for (j = 0; j < blocks; j++) stream.push(dBlocks[j][i]);
  for (i = 0; i < ecLen; i++) for (j = 0; j < blocks; j++) stream.push(eBlocks[j][i]);

  // the square itself
  var n = ver * 4 + 17, m = [], fn = [];
  for (i = 0; i < n; i++) { m.push([]); fn.push([]); for (j = 0; j < n; j++) { m[i].push(0); fn[i].push(0); } }
  var set = function (cx, cy, on) { if (cx >= 0 && cy >= 0 && cx < n && cy < n) { m[cy][cx] = on ? 1 : 0; fn[cy][cx] = 1; } };
  for (i = 0; i < n; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  [[3, 3], [n - 4, 3], [3, n - 4]].forEach(function (c) {
    for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) { var d = Math.max(Math.abs(dx), Math.abs(dy)); set(c[0] + dx, c[1] + dy, d !== 2 && d !== 4); }
  });
  var al = QR_ALIGN[ver];
  al.forEach(function (ay, ai) {
    al.forEach(function (ax, aj) {
      if ((ai === 0 && aj === 0) || (ai === 0 && aj === al.length - 1) || (ai === al.length - 1 && aj === 0)) return;
      for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    });
  });
  var format = function (mask) {
    var d = (1 << 3) | mask, rem = d, k;
    for (k = 0; k < 10; k++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    var f = ((d << 10) | rem) ^ 0x5412;
    var bit = function (q) { return (f >>> q) & 1; };
    for (k = 0; k <= 5; k++) set(8, k, bit(k));
    set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
    for (k = 9; k < 15; k++) set(14 - k, 8, bit(k));
    for (k = 0; k < 8; k++) set(n - 1 - k, 8, bit(k));
    for (k = 8; k < 15; k++) set(8, n - 15 + k, bit(k));
    set(8, n - 8, 1);
  };
  format(0);
  if (ver >= 7) {
    var vr = ver;
    for (i = 0; i < 12; i++) vr = (vr << 1) ^ ((vr >>> 11) * 0x1F25);
    var vbits = (ver << 12) | vr;
    for (i = 0; i < 18; i++) { var on = (vbits >>> i) & 1, a = n - 11 + i % 3, b = Math.floor(i / 3); set(a, b, on); set(b, a, on); }
  }
  // the message, snaking up and down in pairs of columns from the bottom right
  var at = 0;
  for (var right = n - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (var vert = 0; vert < n; vert++) {
      for (j = 0; j < 2; j++) {
        var px = right - j, up = ((right + 1) & 2) === 0, py = up ? n - 1 - vert : vert;
        if (!fn[py][px] && at < stream.length * 8) { m[py][px] = (stream[at >>> 3] >>> (7 - (at & 7))) & 1; at++; }
      }
    }
  }
  // the pattern laid over it so that no part is all dark or all light: try each, keep the calmest
  var MASKS = [
    function (mx, my) { return (mx + my) % 2 === 0; }, function (mx, my) { return my % 2 === 0; },
    function (mx) { return mx % 3 === 0; }, function (mx, my) { return (mx + my) % 3 === 0; },
    function (mx, my) { return (Math.floor(mx / 3) + Math.floor(my / 2)) % 2 === 0; },
    function (mx, my) { return (mx * my) % 2 + (mx * my) % 3 === 0; },
    function (mx, my) { return ((mx * my) % 2 + (mx * my) % 3) % 2 === 0; },
    function (mx, my) { return ((mx + my) % 2 + (mx * my) % 3) % 2 === 0; },
  ];
  var flip = function (k) { for (var fy = 0; fy < n; fy++) for (var fx = 0; fx < n; fx++) if (!fn[fy][fx] && MASKS[k](fx, fy)) m[fy][fx] ^= 1; };
  var rough = function () {
    var p = 0, ry, rx, run;
    for (ry = 0; ry < n; ry++) {
      for (rx = 1, run = 1; rx < n; rx++) { if (m[ry][rx] === m[ry][rx - 1]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; }
      for (rx = 1, run = 1; rx < n; rx++) { if (m[rx][ry] === m[rx - 1][ry]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; }
    }
    for (ry = 0; ry < n - 1; ry++) for (rx = 0; rx < n - 1; rx++) if (m[ry][rx] === m[ry][rx + 1] && m[ry][rx] === m[ry + 1][rx] && m[ry][rx] === m[ry + 1][rx + 1]) p += 3;
    return p;
  };
  var best = 0, low = Infinity;
  for (i = 0; i < 8; i++) { flip(i); format(i); var sc = rough(); if (sc < low) { low = sc; best = i; } flip(i); }
  flip(best); format(best);
  return m;
}
// As a picture: dark on white with the quiet border a scanner needs.
function qrSvg(text, px) {
  var m = qrMatrix(text);
  if (!m) return '';
  var n = m.length, d = '';
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (m[y][x]) d += 'M' + (x + 4) + ' ' + (y + 4) + 'h1v1h-1z';
  return '<svg id="authqr" xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '" viewBox="0 0 ' + (n + 8) + ' ' + (n + 8) + '" shape-rendering="crispEdges">'
    + '<rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}

// The three steps, the same wherever they are shown: on the way in for somebody who must have
// one, and on the Me page for somebody who chose to.
function authKeyShown(key) { return String(key || '').replace(/(.{4})/g, '$1 ').trim(); }
function authSteps(o, go) {
  var step = function (n, title, body) {
    return '<div class="evc" style="margin-top:12px"><div style="display:flex;gap:10px;align-items:baseline">'
      + '<div class="stepno">' + n + '</div><div class="disp" style="font-size:20px;line-height:1.1">' + title + '</div></div>'
      + '<div class="small" style="margin-top:8px;white-space:normal;line-height:1.45">' + body + '</div></div>';
  };

      + '<div class="muted small" style="flex:none">' + when(last.at) + '</div></div>'
      + '<div class="muted small" style="margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (last.by === 'a' ? 'You: ' : '') + esc(last.text) + '</div></div>';
  });
  // writing first, to somebody who has not written
  var others = (S.members || []).filter(function (x) { return !x.isAdmin && x.live; });
  if (others.length) {
    h2 += '<div class="h2">WRITE TO A MEMBER</div><select id="mailwho" class="pick" onchange="if(this.value){S.mailOpen=this.value;S.mailNew=true;S.mailDraft=\'\';render()}">'
      + '<option value="">Choose a member</option>'
      + others.map(function (x) { return '<option value="' + x.id + '">' + esc(x.shown || x.name) + '</option>'; }).join('') + '</select>';
  }
  return h2;
}
function dropNotes(id) {

function doChangePin() {

function addMember() {

// What a new member is sent once: where the portal lives, how to keep it, and how to get in.
function memberLink(id) {
  var m = S.members.filter(function (x) { return x.id === id; })[0];
  if (!m) return;
  // The link carries the joining code, so tapping it fills the code in; it is written out as well,
  // for anybody who opens the portal some other way.
  var url = location.origin + (m.join ? '/?j=' + m.join : '');
  // Whoever brings somebody in is answerable for them knowing the rules, so the message carries
  // the rules rather than leaving it to be remembered.
  var mine = !S.me.isAdmin;
  var text = 'Hi ' + m.name + '! This is Smart Buddies, our private poker portal.\n\n' + url
    + '\n\n1. Open that on your phone.\n2. Add it to your home screen, so it opens like an app.\n'
    + '3. Sign in with this mobile number: ' + m.phone + '\n'
    + (m.join ? '4. Your joining code is ' + m.join + '. You need it once, the first time, and it is for you alone - do not pass it on.\n5. ' : '4. ')
    + 'Choose a 4-digit passcode. That is how you get in from then on.\n\n'
    + 'How it works:\n'
    + '\u2022 It is played with virtual chips only, for fun among friends. Chips have no money value and the portal records chip scores and nothing else.\n'
    + '\u2022 Take a free seat at any table on the list. It deals itself once enough of us are sitting down - nobody presses anything.\n'
    + '\u2022 Turn up after it has started and you ask to come in.\n'
    + '\u2022 However long a table asks you to stay, your time runs from when you sat down.\n'
    + '\u2022 Nobody types at the table. There is a list of things to say and you tap one.\n'
    + '\u2022 When a game ends your score for the night - chips up or down - goes into History and onto your running total.\n'
    + '\u2022 The full rules are in the app: The rule book, on the Tables screen.\n\n'
    + (mine ? 'I brought you in, so any questions come to me.' : 'Any questions, ask me.');
  S.invite = { code: '', text: text, who: m.name };
  render();
}
// The message that opens the portal to the group. The portal writes it, names and all, so the
// people who can start a game are whoever is set to primary right now.
function portalInvite() {
  api('portal-invite', {}).then(function (j) {

}
// ---- the portal admin's list of people ----
// Grouped by whoever brought each one in, because that is the shape of the group: the portal
// admin's own people, then each primary member with his own underneath him. Inductions waiting
// on a decision come first, since somebody is standing at the door; people taken out come last,
// because they are kept rather than gone.
function membersBlock() {
  var all = S.members || [];
  var live = all.filter(function (m) { return m.status === 'active'; });
  var waiting = all.filter(function (m) { return m.status === 'pending'; });
  var gone = all.filter(function (m) { return m.status === 'archived'; });
  var byName = function (a, b) { return a.name.localeCompare(b.name); };

  // how many there are, and of what kind, before any of them are listed
  var starters = live.filter(function (m) { return m.isAdmin || m.canOpen; }).length;
  var h = '<div class="h2">MEMBERS (' + live.length + ')</div>'
    + '<div class="muted small" style="margin:-2px 2px 0;white-space:normal">' + starters + ' can start a game &middot; '
    + (live.length - starters) + ' play only' + (waiting.length ? ' &middot; <span class="gold">' + waiting.length + ' waiting on you</span>' : '')
    + (gone.length ? ' &middot; ' + gone.length + ' removed' : '') + '</div>';
  // Whoever is waiting on him comes first: it is the one thing on this screen that needs him.
  if (waiting.length) {
    h += '<div class="h2">WAITING TO BE LET IN (' + waiting.length + ')</div>';
    waiting.slice().sort(byName).forEach(function (m) {
      h += '<div class="evc" style="margin-top:8px;border-color:#d8b45c">'
        + '<div style="font-size:14px;font-weight:600">' + esc(m.name) + '</div>'
        + '<div class="muted small" style="white-space:normal">' + esc(m.phone)
        + ' &middot; brought in by <span class="gold">' + esc(m.sponsor || 'somebody since demoted') + '</span></div>'
        + '<div style="display:flex;gap:8px;margin-top:10px">'
        + '<button class="btn" style="flex:1;height:42px;font-size:14px" onclick="decideMember(\'' + m.id + '\',true)">Let in</button>'
        + '<button class="btn ghost" style="flex:1;height:42px;font-size:14px;border-color:#6b2a2e;color:#d2454d" onclick="decideMember(\'' + m.id + '\',false)">Decline</button>'
        + '</div></div>';
    });
  }

  // Everybody who is in: the ones who can start a game first, each with whoever they brought in
  // folded away beneath them, and then the rest.
  var top = live.filter(function (m) { return !m.sponsorId; }).sort(byName);
  // himself first, then the rest by name
  var prim = top.filter(function (m) { return m.isAdmin || m.canOpen; })
    .sort(function (x, y) { return (y.isAdmin ? 1 : 0) - (x.isAdmin ? 1 : 0) || x.name.localeCompare(y.name); });
  var rest = top.filter(function (m) { return !m.isAdmin && !m.canOpen; });
  var under = function (m) {
    var out = '';
    if (m.canOpen && !m.isAdmin) {
      var theirs = live.filter(function (x) { return x.sponsorId === m.id; }).sort(byName);
      var pend = waiting.filter(function (x) { return x.sponsorId === m.id; }).length;
      if (theirs.length || pend) {
        var open = !!S.openSponsor[m.id];
        out += '<div style="margin:2px 0 0 12px"><div class="muted small" style="cursor:pointer;padding:4px 0" '
          + 'onclick="S.openSponsor[\'' + m.id + '\']=!S.openSponsor[\'' + m.id + '\'];render()">'
          + (open ? '&#9652;' : '&#9662;') + ' brought in ' + theirs.length
          + (pend ? ' &middot; ' + pend + ' waiting' : '') + '</div>';
        if (open) theirs.forEach(function (x) { out += memberRow(x, true); });
        out += '</div>';
      }
    }
    return out;
  };
  h += '<div class="h2">CAN START A GAME (' + prim.length + ')</div>'
    + '<div class="muted small" style="margin:-2px 2px 4px;white-space:normal">Primary members. They can open a table and bring people in, and whoever they bring in sits under their name.</div>';
  prim.forEach(function (m) { h += memberRow(m) + under(m); });
  if (rest.length) {
    h += '<div class="h2">PLAY ONLY (' + rest.length + ')</div>'
      + '<div class="muted small" style="margin:-2px 2px 4px;white-space:normal">Secondary members you added yourself. They play at any table and start none.</div>';
    rest.forEach(function (m) { h += memberRow(m); });
  }

  // adding somebody is done now and then; the lists are looked at every time, so they come first
  h += '<div class="h2">ADD SOMEBODY</div>'
    + '<div class="evc"><div style="display:flex;gap:8px">'
    + '<input id="am_name" placeholder="Name" maxlength="18" style="flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:15px;padding:0 12px;font-family:inherit">'
    + '<input id="am_phone" placeholder="Mobile" inputmode="tel" style="flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:15px;padding:0 12px;font-family:inherit"></div>'
    + '<button class="btn" style="margin-top:8px;height:46px" onclick="addMember()">Add member</button></div>'
    + '<button class="btn ghost" style="margin-top:8px" onclick="portalInvite()">Share the portal with the group</button>';

  if (gone.length) {
    var shown = !!S.showGone;
    h += '<div class="h2" style="margin-top:16px;cursor:pointer" onclick="S.showGone=!S.showGone;render()">'
      + 'REMOVED (' + gone.length + ') ' + (shown ? '&#9652;' : '&#9662;') + '</div>'
      + '<div class="muted small" style="margin:-2px 2px 8px;white-space:normal">Taken out of the portal, not erased. '
      + 'Every game they played, and anything they owe, is still theirs. Put one back and they return as themselves.</div>';
    if (shown) gone.slice().sort(byName).forEach(function (m) { h += memberRow(m); });
  }
  return h;
}

// One member: who he is on top, what can be done about him underneath. The four buttons used to
// sit beside the name and squeeze it into a column one word wide.
function memberRow(m, inset) {
  var tier = m.isAdmin ? '<span class="pill2 g">ADMIN</span>'
    : m.status === 'archived' ? ''
      : m.tier === 'primary' ? '<span class="pill2 g">PRIMARY</span>' : '<span class="pill2">SECONDARY</span>';
  var h = '<div class="evc" style="margin-top:8px;padding:12px' + (inset ? ';margin-left:4px' : '') + '">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="min-width:0">'
    + '<div style="font-size:15px;font-weight:600">' + esc(m.name) + '</div>'
    + '<div class="muted small" style="white-space:normal">' + esc(m.phone)
    + (m.status === 'archived'
      ? ' &middot; removed ' + when(m.removedAt)
      : ' &middot; ' + (m.hasPin ? 'has signed in' : 'has not signed in yet'))
    + (m.twofa ? ' &middot; authenticator on' : (m.must2fa ? ' &middot; authenticator to be linked' : ''))
    + (m.sponsorWas && !m.sponsorId ? ' &middot; first brought in by ' + esc(m.sponsorWas) : '')
    + (m.join ? '<br>Joining code <b style="letter-spacing:.12em">' + esc(m.join) + '</b> &middot; Send link carries it' : '')
    + '</div></div><div style="flex:none">' + tier + '</div></div>';
  if (m.isAdmin) return h + '</div>';
  if (m.status === 'archived') {
    return h + '<button class="rolechip on" style="margin-top:10px;width:100%" onclick="restoreMember(\'' + m.id + '\')">Put back</button></div>';
  }
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">'
    + '<button class="rolechip' + (m.tier === 'primary' ? '' : ' on') + '" onclick="setTier(\'' + m.id + '\',\'' + (m.tier === 'primary' ? 'secondary' : 'primary') + '\')">'
    + (m.tier === 'primary' ? 'Make secondary' : 'Make primary') + '</button>'
    + '<button class="rolechip" onclick="memberLink(\'' + m.id + '\')">Send link</button>'
    + '<button class="rolechip" onclick="resetMember(\'' + m.id + '\')">Reset passcode</button>'
    + (S.me.isAdmin && (m.twofa || m.must2fa) ? '<button class="rolechip" onclick="reset2fa(\'' + m.id + '\')">Reset authenticator</button>' : '')
    + '<button class="rolechip" style="color:#d2454d;border-color:#6b2a2e" onclick="removeMember(\'' + m.id + '\')">Remove</button>'
    + '</div>';
  return h + '</div>';
}

// ---- what a primary member sees of the people he brought in ----
// His own, and nobody else's. He is answerable for them - he passes on the rules - so he sees
// whether they have signed in. He sees no part of the rest of the list, and nobody else's mobile

function myMembersBlock() {

  var live = all.filter(function (m) { return m.status === 'active'; });
  var room = Math.max(0, ind.cap - ind.used);

      + '<input id="im_phone" placeholder="Mobile" inputmode="tel" style="flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid #2a312d;background:#141917;color:#f2efe6;font-size:15px;padding:0 12px;font-family:inherit"></div>'
      + '<button class="btn" style="margin-top:8px;height:46px" onclick="inductMember()">Put them forward</button>'

    waiting.forEach(function (m) {
      h += '<div class="row" style="margin-top:8px"><div style="flex:1;min-width:0">'
        + '<div style="font-size:14px;font-weight:600">' + esc(m.name) + '</div>'
        + '<div class="muted small">' + esc(m.phone) + ' &middot; not let in yet, so do not send them anything</div></div></div>';
    });
  }

  live.forEach(function (m) {

      + '<div style="font-size:14px;font-weight:600">' + esc(m.name) + '</div>'

    h += '<button class="btn ghost" style="margin-top:8px;height:40px;font-size:14px" onclick="memberLink(\'' + m.id + '\')">Send them the message</button></div>';
  });

// ---- what the portal makes of how people play ----
// Counted from its own records: what somebody did, how often, and what the pots were worth when
// the cards took over. Nothing here is advice - the portal has no idea what the right frequency
// is, and a number dressed up as a verdict would be a lie told confidently. It is never shown
// while a hand is live; it is a thing to look at afterwards.
// A figure the report counted either in chips or in big blinds, depending on whether the nights
// it came from knew their stakes. The report says which; this prints it accordingly.
function unit(n, kind) {
  return kind === 'bb' ? Math.round(n) + 'bb' : fmt(Math.round(n)) + ' chips';
}

function studyBlock() {
  var d = S.study;
  if (!d) {
    return '<div class="h2" style="margin-top:18px">HOW IT IS GOING</div>'
      + '<button class="btn ghost" onclick="loadStudy()">Work out the numbers</button>';
  }
  if (!d.hands) {
    return '<div class="h2" style="margin-top:18px">HOW IT IS GOING</div>'
      + '<div class="evc"><div class="muted small" style="white-space:normal">'
      + 'Nothing to count yet. Texas hands are kept from now on, and the figures start meaning something after a few dozen of them.</div></div>';
  }
  var h = '<div class="h2" style="margin-top:18px">HOW IT IS GOING</div>'
    + '<div class="muted small" style="margin:-2px 2px 8px;white-space:normal">'
    + d.hands + ' Texas hands over ' + d.games + ' game' + (d.games === 1 ? '' : 's')
    + '. Counted from what the portal watched - what was done, not what should have been. For you alone: nobody else in the portal can open any of this.</div>';

  d.who.forEach(function (w) {
    var luck = w.luck || 0;
    h += '<div class="evc" style="margin-top:8px">'
      + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">'
      + '<div style="font-size:15px;font-weight:600">' + esc(w.name) + '</div>'
      + '<div class="muted small">' + w.hands + ' hands</div></div>';
    if (w.hands < 20) {
      h += '<div class="muted small" style="margin-top:6px;white-space:normal">Too few hands to say anything worth saying yet.</div></div>';
      return;
    }
    // Nine labelled percentages told you nothing unless you already knew what each label meant
    // and what a normal figure for it looked like. The same nine counts, said as sentences.
    var raisedShare = w.vpip ? (w.pfr / w.vpip) * 100 : null;
    var inTen = w.aggression === null || w.aggression === undefined
      ? null : Math.round((w.aggression / (w.aggression + 1)) * 10);
    var lines = [];
    if (w.vpip !== null) {
      lines.push('Plays ' + oneIn(w.vpip) + ' hands'
        + (raisedShare === null ? '.' : ', and comes in raising with ' + oneIn(raisedShare) + ' of them.'));
    }
    if (inTen !== null) {
      lines.push('Once the flop is out, about ' + inTen + ' of every 10 times he puts chips in it is a bet or a raise'
        + ' - the other ' + (10 - inTen) + ' are calls.');
    }
    if (w.wtsd !== null) {
      lines.push('Of the flops he sees, he is still there at the end in ' + oneIn(w.wtsd)
        + (w.wonAtShowdown === null ? '.' : ', and wins ' + oneIn(w.wonAtShowdown) + ' of those.'));
    }
    if (w.foldToCbet !== null || w.threeBet !== null) {
      var bits = [];
      if (w.foldToCbet !== null) bits.push('folds to a bet on the flop ' + oneInTimes(w.foldToCbet));
      if (w.threeBet !== null) bits.push('puts in a second raise ' + oneInTimes(w.threeBet) + ' of the times he can');
      lines.push('He ' + bits.join(', and ') + '.');
    }
    if (riverLine(w, false)) lines.push(riverLine(w, false));
    h += '<div style="margin-top:8px">';
    lines.forEach(function (line) {
      h += '<div class="muted small" style="white-space:normal;margin-top:4px">' + line + '</div>';
    });
    h += '</div>' + posRows(w);

    if (w.allIns && w.luckUnit !== 'mixed') {
      h += '<div style="margin-top:10px;border-top:1px solid #2a312d;padding-top:8px">'
        + '<div class="muted small" style="white-space:normal">'
        + w.allIns + ' pot' + (w.allIns === 1 ? '' : 's') + ' where the chips were all in and the cards '
        + 'decided it. His share of those pots came to ' + unit(w.dueAllIn, w.luckUnit)
        + '; he actually took ' + unit(w.gotAllIn, w.luckUnit) + '.</div>'
        + '<div style="font-weight:700;margin-top:4px;color:' + (luck > 0 ? '#7ddba0' : luck < 0 ? '#f08a8f' : '#a3aba5') + '">'
        + (luck > 0 ? unit(luck, w.luckUnit) + ' better than the cards owed him'
          : luck < 0 ? unit(-luck, w.luckUnit) + ' worse than the cards owed him'
            : 'exactly what the cards owed him') + '</div>'
        + (w.sampled ? '<div class="muted small" style="margin-top:2px">' + w.sampled + ' of those were counted by sampling, so the figure is close rather than exact.</div>' : '')
        + '</div>';
    }
    if (w.remarks && w.remarks.length) {
      h += '<div style="margin-top:10px;border-top:1px solid #2a312d;padding-top:8px">';
      w.remarks.forEach(function (line) {
        h += '<div style="display:flex;gap:8px;margin-top:4px"><div class="gold" style="flex:none">&middot;</div>'
          + '<div class="muted small" style="white-space:normal">' + line + '</div></div>';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  h += '<button class="btn ghost" style="margin-top:10px" onclick="S.study=null;loadStudy()">Count it again</button>';
  return h;
}

function loadStudy() {
  toast('Counting\u2026');
  api('study', {}).then(function (j) { S.study = j; render(); }).catch(fail);
}

// ---- one night, looked at properly ----
// The shape Railbird uses, because it works: the figures across the top, how the chips moved,
// the pots that turned it, and then the decisions. What is different is what goes in the last
// part. There are no scores out of a hundred here, because a score needs a solver and the portal
// has not got one. What it has instead is the cards - all of them - so it can say what a call
// actually cost and what it was actually worth, which is a fact rather than an opinion.
function reviewSheet() {
  var r = S.review;
  var h = '<div class="sheet" style="z-index:55">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
    + '<div><div class="disp" style="font-size:28px;line-height:1.05">The night</div>'
    + '<div class="muted small">' + esc(r.title || '') + ' &middot; ' + when(r.at) + ' &middot; ' + r.hands + ' hands</div></div>'
    + '<button class="rolechip" onclick="S.review=null;render()">Close</button></div>';
  if (!r.own && r.meName) {
    h += '<div class="evc" style="margin-top:10px;border-color:#d8b45c"><div class="gold" style="font-weight:600">Seen as ' + esc(r.meName) + '</div>'
      + '<div class="muted small" style="white-space:normal;margin-top:3px">Everything below is his night, and &ldquo;you&rdquo; means him.</div>'
      + '<button class="rolechip" style="margin-top:8px" onclick="openReview(\'' + r.id + '\')">Back to my own</button></div>';
  }

  if (!r.hands) {
    return h + '<div class="evc" style="margin-top:12px"><div class="muted small" style="white-space:normal">'
      + 'No Texas hands on record for that night, so there is nothing to count. Hands are kept from the day this went in.'
      + '</div></div><button class="btn ghost" style="margin-top:16px" onclick="S.review=null;render()">Back</button></div>';
  }

  // how the chips moved
  if (r.curve && r.curve.length > 1) {
    h += '<div class="h2" style="margin-top:16px">HOW THE NIGHT WENT</div>'
      + '<div class="evc">'
      + lineChart([{ points: r.curve, colour: (r.curve[r.curve.length - 1][1] >= 0 ? '#7ddba0' : '#f08a8f'), thick: true }], { zero: true, bb: r.bb, xlabel: r.hands + ' hands' })
      + '<div class="muted small" style="margin-top:6px;white-space:normal">' + howItWent(r) + '</div></div>';
  }

  // How he played, in sentences. The figures underneath are the same ones a poker tracker
  // prints - VPIP, PFR, aggression - but nobody at this table speaks that language, and a
  // number with no sense of what normal looks like tells you nothing at all.
  var me = r.me;
  var pick = function (key) {
    return (r.who || []).filter(function (w) { return w.id !== r.meId; }).map(function (w) { return w[key]; });
  };
  var thin = me && me.hands < THIN;
  var sitsIf = function (v, band, others, hi, lo) { return thin ? '' : sits(v, band, others, hi, lo); };
  var at = function (v) { return thin ? null : v; };
  if (me) {
    h += '<div class="h2" style="margin-top:16px">HOW YOU PLAYED</div>';
    if (thin) {
      h += '<div class="muted small" style="margin:-2px 2px 4px;white-space:normal">Only ' + me.hands + ' hands, which is too few to say how anybody '
        + 'plays - one loose orbit moves every figure. These are the counts and nothing more. The running figures, over every night, are the ones to go by.</div>'
        + '<button class="rolechip" style="margin-top:4px" onclick="S.review=null;S.tab=\'me\';S.sec=\'analysis\';render();loadStudy()">See the running figures</button>';
    }

    // 1. how many hands he put chips into
    if (me.vpip !== null) {
      h += playRow('Hands you played', oneIn(me.vpip), me.vpip + '% of ' + me.hands + ' hands',
        at(me.vpip), 0, 100, [20, 45], pick('vpip'),
        'You put chips in before the flop in ' + oneIn(me.vpip) + ' hands. '
        + sitsIf(me.vpip, [20, 45], pick('vpip'),
          'More hands than most, which means more of them get awkward after the flop.',
          'Fewer hands than most - you waited for something.'));
    }

    // 2. of the hands he played, how many he came in raising rather than calling. The share of
    //    his own hands is the useful figure; the raw percentage of all hands is not.
    if (me.vpip && me.pfr !== null) {
      var share = Math.round((me.pfr / me.vpip) * 1000) / 10;
      h += playRow('When you played, how often you raised', oneIn(share), Math.round(share) + '% of them',
        at(share), 0, 100, [30, 70],
        (r.who || []).filter(function (w) { return w.id !== r.meId && w.vpip; })
          .map(function (w) { return w.pfr === null ? null : (w.pfr / w.vpip) * 100; }),
        'The rest you came in calling. '
        + sitsIf(share, [30, 70], null,
          'You took the lead most times you came in.',
          'You came in calling far more often than raising, which leaves the lead to somebody else.'));
    }

    // 3. betting against calling once the flop is out, said as a count out of ten rather than
    //    as a ratio, which nobody reads correctly on sight
    if (me.aggression !== null && me.aggression !== undefined) {
      var outOfTen = Math.round((me.aggression / (me.aggression + 1)) * 10);
      h += playRow('Betting against calling', outOfTen + ' in every 10',
        me.aggression + ' bets per call', at(me.aggression), 0, 3, [0.5, 2], pick('aggression'),
        'Of every 10 times you put chips in after the flop, about ' + outOfTen
        + ' were a bet or a raise and ' + (10 - outOfTen) + ' were a call. '
        + sitsIf(me.aggression, [0.5, 2], pick('aggression'),
          'You pushed more than most.', 'You called more than most.'));
    }

    // 4. the showdown, only when he saw enough flops for it to mean anything
    if (me.wtsd !== null && me.sawFlop >= 8) {
      h += playRow('Hands you took to the end', oneIn(me.wtsd), me.wtsd + '% of the flops you saw',
        at(me.wtsd), 0, 100, [20, 40], pick('wtsd'),
        'Of the flops you saw, you were still there at the showdown in ' + oneIn(me.wtsd) + '. '
        + sitsIf(me.wtsd, [20, 40], pick('wtsd'),
          'You saw a lot of showdowns, which usually means paying to find out.',
          'You let go of most of them before the end.'));
    }

    if (!thin) h += '<div class="muted small" style="margin:8px 2px 0;white-space:normal">'
      + 'The shaded stretch on each line is roughly where most players sit - a rough guide, not a '
      + 'mark out of ten. Gold is you'
      + ((r.who || []).length > 1 ? '; the grey dots are the others at the table.' : '.') + '</div>';
  }

  // the pots that turned it
  if (r.swings && r.swings.length) {
    h += '<div class="h2" style="margin-top:16px">THE POTS THAT MATTERED</div>';
    r.swings.forEach(function (sw) {
      h += '<div class="row" style="margin-top:6px;cursor:pointer" onclick="openSpot(\'' + r.id + '\',' + sw.no + ',\'' + r.meId + '\')"><div style="flex:1;min-width:0">'
        + '<div style="font-size:13px">Hand ' + sw.no + (sw.cards && sw.cards.length ? ' &middot; ' + sw.cards.map(esc).join(' ') : '') + '</div>'
        + '<div class="muted small">pot ' + bbPlain(sw.pot, r.bb) + '</div></div>'
        + '<div style="font-weight:700;color:' + (sw.net > 0 ? '#7ddba0' : sw.net < 0 ? '#f08a8f' : '#a3aba5') + '">'
        + bb(sw.net, r.bb) + '</div></div>';
    });
  }

  // by where he sat
  if (me && posRows(me)) {
    h += '<div class="h2" style="margin-top:16px">BY POSITION</div>' + posRows(me);
  }

  // The one thing about a single hand that can be judged whole, and the one tally worth keeping.
  h += '<div class="h2" style="margin-top:16px">WHAT THE CARDS SAY</div>';
  if (me && me.riverCalls) {
    h += '<div class="evc" style="margin-top:6px;padding:10px"><div class="muted" style="font-size:10px;letter-spacing:.06em">CALLS ON THE RIVER</div>'
      + '<div class="small" style="white-space:normal;margin-top:4px">' + riverLine(me, true) + '</div></div>';
  }
  if (!r.findings || !r.findings.length) {
    h += '<div class="muted small" style="white-space:normal;margin-top:6px">No pot tonight was decided with the chips all in. Those are the only single hands the portal passes judgement on - once the chips are in nothing follows, so what the hand was worth is the whole question. Anything else said about one hand would be hindsight.</div>';
  } else {
    h += '<div class="muted small" style="margin:8px 2px 6px;white-space:normal">'
      + 'The pots where the chips went all in. What your hand was worth at that moment, against what the cards then did.</div>';
    r.findings.forEach(function (f) {
      var col = f.kind === 'good' ? '#7ddba0' : f.kind === 'fold' ? '#f0c674' : '#f08a8f';
      h += '<div class="evc" style="margin-top:6px;padding:10px;border-color:' + (f.kind === 'good' ? '#2c5e3f' : '#3a3123') + '">'
        + '<div style="display:flex;gap:8px"><div style="flex:none;color:' + col + '">&middot;</div>'
        + '<div class="small" style="white-space:normal">Hand ' + f.no + ': ' + f.text + '</div></div>'
        + '<button class="rolechip" style="margin-top:8px" onclick="openSpot(\'' + r.id + '\',' + f.no + ',\'' + r.meId + '\')">Look at the hand</button></div>';
    });
  }

  // and the figures, said back
  if (r.remarks && r.remarks.length) {
    h += '<div class="h2" style="margin-top:16px">OVER THE NIGHT</div>';
    r.remarks.forEach(function (line) {
      h += '<div style="display:flex;gap:8px;margin-top:4px"><div class="gold" style="flex:none">&middot;</div>'
        + '<div class="muted small" style="white-space:normal">' + line + '</div></div>';
    });
  }

  if (r.who && r.who.length > 1) {
    h += '<div class="h2" style="margin-top:16px">EVERYBODY</div>'
      + '<div class="muted small" style="margin:-2px 2px 4px;white-space:normal">Tap a name to see the night as he played it.</div>';
    r.who.forEach(function (w) {
      h += '<div class="row" style="margin-top:6px;cursor:pointer' + (w.id === r.meId ? ';border-color:#d8b45c' : '') + '" onclick="openReview(\'' + r.id + '\',\'' + w.id + '\')"><div style="flex:1;min-width:0">'
        + '<div style="font-size:13px;font-weight:600">' + esc(w.name) + '</div>'
        + '<div class="muted small">' + w.hands + ' hands &middot; played '
        + (w.vpip === null ? '-' : oneIn(w.vpip))
        + (w.vpip && w.pfr !== null ? ' &middot; raised ' + oneIn((w.pfr / w.vpip) * 100) + ' of those' : '')
        + '</div></div></div>';
    });
  }

  h += '<div class="muted small" style="margin-top:16px;white-space:normal;border-top:1px solid #2a312d;padding-top:10px">'
    + 'No hand here carries a score out of a hundred. A score like that comes from a solver, which works out how '
    + 'TWO players should play - half a minute a flop, and only ever two. Your table is four and five and seven, '
    + 'and nobody has a solver for that. A number invented to look like one would be worse than none.</div>';
  h += '<button class="btn ghost" style="margin-top:14px" onclick="exportHands(\'' + r.id + '\',\'' + r.meId + '\')">Export these hands'
    + (r.meName ? ' as ' + esc(r.meName) + ' saw them' : '') + '</button>'
    + '<div class="muted small" style="margin-top:6px;white-space:normal">The file an outside study tool reads. It is written from one seat - his cards are in it and nobody else\u2019s unless they were shown.</div>';
  return h + '<button class="btn ghost" style="margin-top:10px" onclick="S.review=null;render()">Back</button></div>';
}

// One hand, decision by decision. The price against what the hand was actually worth.
function spotSheet() {
  var sp = S.spot;
  var h = '<div class="sheet" style="z-index:56">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
    + '<div><div class="disp" style="font-size:26px;line-height:1.05">Hand ' + sp.no + '</div>'
    + '<div class="muted small">pot ' + bbPlain(sp.pot, sp.bb) + (sp.won ? ' &middot; you took ' + bbPlain(sp.won, sp.bb) : '') + '</div></div>'
    + '<button class="rolechip" onclick="S.spot=null;render()">Close</button></div>';

  var other = S.review && !S.review.own && S.review.meName;
  h += '<div class="evc" style="margin-top:12px"><div class="muted small">' + (other ? esc(S.review.meName).toUpperCase() + '\u2019S CARDS' : 'YOUR CARDS') + '</div>'
    + '<div style="display:flex;gap:4px;margin-top:6px">' + (sp.cards || []).map(function (c) { return cardHtml(c, 'md'); }).join('') + '</div>';
  if (sp.board && sp.board.length) {
    h += '<div class="muted small" style="margin-top:10px">THE BOARD</div>'
      + '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">' + sp.board.map(function (c) { return cardHtml(c, 'md'); }).join('') + '</div>';
  }
  h += '</div>';

  h += '<div class="h2" style="margin-top:14px">EVERY DECISION YOU MADE</div>'
    + '<div class="muted small" style="margin:-2px 2px 8px;white-space:normal">'
    + 'What each decision cost you, how often you had to be right for it to be worth it, and how '
    + 'often you actually were. No guessing \u2014 the portal dealt the cards and knows what '
    + 'everybody held.</div>';

  (sp.steps || []).forEach(function (st) {
    var gap = (st.needed !== null && st.equity !== null) ? st.equity - st.needed : null;
    h += '<div class="evc" style="margin-top:6px;padding:10px">'
      + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">'
      + '<div style="font-size:13px;font-weight:600">' + (STREETS_P[st.street] || st.street) + ' &middot; ' + esc(STUDY_WORD[st.did] || st.did)
      + (st.did === 'call' && st.toCall ? ' ' + bbPlain(st.toCall, sp.bb)
        : st.amount ? ' to ' + bbPlain(st.amount, sp.bb) : '') + '</div>'
      + (st.equity === null ? '' : '<div style="text-align:right;flex:none"><div style="font-weight:700;color:'
        + (gap === null ? '#a3aba5' : gap >= 0 ? '#7ddba0' : '#f08a8f') + ';font-size:17px">' + st.equity + '</div>'
        + '<div class="muted" style="font-size:9px;letter-spacing:.04em">IN 100</div></div>')
      + '</div>'
      + '<div class="muted small" style="margin-top:4px;white-space:normal">'
      + (st.against ? 'Against ' + st.against + (st.against === 1 ? ' man. ' : ' men. ') : '')
      + (st.toCall
        ? bbPlain(st.toCall, sp.bb) + ' to call, ' + bbPlain(st.pot, sp.bb) + ' in the middle - so you '
          + 'had to be good ' + st.needed + ' times in 100 to break even.'
        : 'Nothing to call. ' + bbPlain(st.pot, sp.bb) + ' in the middle.')
      + '</div>';
    // Only a call is paying a price. A raise is putting chips in to make somebody else fold, and
    // measuring it against pot odds calls a perfectly good bluff a mistake - the equity is worth
    // seeing either way, but the verdict belongs to calls.
    if (gap !== null && st.toCall && st.did === 'call' && st.street === 'river') {
      // With every card out there is no chance left in it: he was ahead or he was not. Said as
      // that, and not as a verdict on the call - the portal can see the other man's cards and he
      // could not.
      h += '<div class="small muted" style="margin-top:4px;white-space:normal">Every card was out, so this is simply how it stood: '
        + (st.equity >= 50 ? 'ahead' : 'behind') + '. It goes into the tally of river calls; on its own it says nothing about the call.</div>';
    } else if (gap !== null && st.toCall && st.did === 'call') {
      h += '<div class="small" style="margin-top:4px;color:' + (gap >= 0 ? '#7ddba0' : '#f08a8f') + '">'
        + (gap >= 0 ? 'You were good more often than you needed to be \u2014 the price was there.'
          : 'You needed ' + st.needed + ' and had ' + st.equity + '. The price was not there.')
        + (st.street !== 'river'
          ? ' <span class="muted">That is the price in front of you; there was still betting to come, which can make a '
            + 'thin call worth it or an easy one expensive.</span>' : '')
        + '</div>';
    }
    h += '</div>';
  });

  h += '<div class="muted small" style="margin-top:14px;white-space:normal;border-top:1px solid #2a312d;padding-top:10px">'
    + 'What the others held is not shown. The portal needs their cards to work out what yours was worth, '
    + 'but a review that listed everybody\u2019s folds would hand you a record of how the rest of the table plays.</div>';
  return h + '<button class="btn ghost" style="margin-top:14px" onclick="S.spot=null;render()">Back</button></div>';
}

var STREETS_P = { preflop: 'Before the flop', flop: 'Flop', turn: 'Turn', river: 'River' };
// (Its own name: the table has an ACT_WORD too, for the word that flashes over a seat, and the
// later of two with one name is the one that is used.)
var STUDY_WORD = { call: 'called', raise: 'raised to', bet: 'bet', check: 'checked', fold: 'folded', allin: 'all in' };

// A night, written out for a study tool to read. It comes back as text and goes straight to a
// file - on a phone that lands in Downloads, which is near enough to anywhere you want it.
// Getting the file off the phone.
//
// A hidden link with a download attribute is how this is done on a desktop, and on an iPhone it
// is how nothing is done at all: in a web app saved to the home screen the tap is ignored and no
// error is raised, so the old version of this said "23 hands" and handed over nothing. The share
// sheet is the thing that works there - Save to Files, Mail, AirDrop - so it is tried first, and
// the link is kept for the desktop. Whatever happens, the text is still on screen to copy, which
// is the one route that cannot fail.
function saveFile(j, done, type) {
  var shown = function () { S.handfile = j; render(); };
  var file = null;
  try { file = new File([j.text], j.name, { type: type || 'text/plain' }); } catch (e) { file = null; }

  if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: j.name })
      .then(function () { toast(done); })
      .catch(function (e) {
        // a cancelled share is the person changing his mind, not a failure to be worked around
        if (e && e.name === 'AbortError') return;
        shown();
      });
    return;
  }

  try {
    var blob = new Blob([j.text], { type: type || 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = j.name;
    if (typeof a.download !== 'string') throw new Error('no download here');
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast(done);
  } catch (e) {
    shown();
  }
}
function exportHands(id, who) {
  api('export-hands', { id: id, who: who || '' }).then(function (j) { saveFile(j, j.hands + ' hands'); }).catch(fail);
}
// A copy of the portal to keep somewhere that is not the portal.
function downloadBackup() {
  api('backup', {}).then(function (j) {
    j.hands = j.games; j.what = 'backup';
    saveFile(j, 'Backup saved: ' + j.members + ' members, ' + j.games + ' games', 'application/json');
  }).catch(fail);
}

function openSpot(gameId, no, who) {
  api('spot', { id: gameId, hand: no, who: who || '' }).then(function (j) { S.spot = j; render(); }).catch(fail);
}

// Chips are whatever the table happened to be playing for; big blinds are the same everywhere,
// so a 32bb pot means something to anybody and a 6,400 pot means nothing without the stakes.
function bb(n, big) {
  if (!big) return fmt(Math.round(n));
  var v = n / big;
  var r = Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10;
  return (r > 0 ? '+' : '') + r + 'bb';
}
function bbPlain(n, big) {
  if (!big) return fmt(Math.round(n));
  var v = n / big;
  return (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10) + 'bb';
}

// ---------------------------------------------------------------- saying it in plain words
//
// A percentage is a number you have to convert in your head before it means anything, and most
// people do not bother. "2 in every 3" lands straight away. These are the fractions people
// actually say out loud; the nearest one is used, and the exact figure is kept beside it for
// anybody who wants it.
var ODDS = [[2, '1 in 50'], [3.3, '1 in 30'], [5, '1 in 20'], [6.7, '1 in 15'], [8.3, '1 in 12'],
  [10, '1 in 10'], [12.5, '1 in 8'], [14.3, '1 in 7'], [16.7, '1 in 6'], [20, '1 in 5'],
  [25, '1 in 4'], [33.3, '1 in 3'], [40, '2 in every 5'], [50, '1 in 2'], [60, '3 in every 5'],
  [66.7, '2 in every 3'], [75, '3 in every 4'], [80, '4 in every 5'], [90, '9 in every 10']];
// The same fraction with the word in it, for sentences where "folds 1 in 7" reads as a score
// rather than a frequency.
function oneInTimes(p) {
  var w = oneIn(p);
  if (/^1 in /.test(w)) return w.replace(/^1 in /, '1 time in ');
  return w.replace(/^(\d+) in /, '$1 times in ');
}

function oneIn(p) {
  if (p === null || p === undefined) return '—';
  if (p <= 1) return 'almost never';
  if (p >= 95) return 'nearly every hand';
  var best = ODDS[0];
  ODDS.forEach(function (o) { if (Math.abs(o[0] - p) < Math.abs(best[0] - p)) best = o; });
  return best[1];
}

// Where a figure sits on a scale, with the stretch most players fall in shaded behind it. The
// shading is a rough guide and says so - it is not a verdict, and there is no solver behind it.
// Other people's marks are only ever drawn for the portal admin, because how often a man plays
// is exactly the thing you would want to know about him at the table.
function scale(mine, lo, hi, band, others) {
  if (mine === null || mine === undefined) return '';
  var at = function (v) { return Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100)); };
  var s = '<div style="position:relative;height:18px;margin-top:9px">'
    + '<div style="position:absolute;left:0;right:0;top:8px;height:3px;background:#262d28;border-radius:2px"></div>';
  if (band) {
    s += '<div style="position:absolute;top:8px;height:3px;background:#39443c;border-radius:2px;left:'
      + at(band[0]).toFixed(1) + '%;width:' + (at(band[1]) - at(band[0])).toFixed(1) + '%"></div>';
  }
  (others || []).forEach(function (v) {
    if (v === null || v === undefined) return;
    s += '<div style="position:absolute;top:5px;width:9px;height:9px;margin-left:-4.5px;border-radius:5px;'
      + 'background:#59635b;left:' + at(v).toFixed(1) + '%"></div>';
  });
  s += '<div style="position:absolute;top:2px;width:15px;height:15px;margin-left:-7.5px;border-radius:8px;'
    + 'background:#d8b45c;border:2px solid #10140f;left:' + at(mine).toFixed(1) + '%"></div>';
  return s + '</div>';
}

// One line about the figure, in words, saying only what can honestly be said: where it sits
// against the stretch most players fall in, and - for the portal admin - against the table.
function sits(mine, band, others, high, low) {
  if (mine === null || mine === undefined) return '';
  var out = mine > band[1] ? high : mine < band[0] ? low : 'About where most players sit.';
  // `others` is everybody but him, so all of them above him means he was the lowest. Said as a
  // sentence about the others rather than a rank, because "the least" sitting next to "a lot"
  // reads like a contradiction when both are true.
  var vals = (others || []).filter(function (v) { return v !== null && v !== undefined; });
  if (vals.length > 1) {
    var above = vals.filter(function (v) { return v > mine; }).length;
    out += above === 0 ? ' Nobody else here did it more often.'
      : above === vals.length ? ' Everybody else here did it more often.'
        : ' Middle of the table tonight.';
  }
  return out;
}

// The graph said in words, because a line is easy to look at and hard to describe, and the three
// figures that used to sit under it - high, low, finished - were three figures to decode.
function howItWent(r) {
  var end = r.curve[r.curve.length - 1][1];
  var out = r.high <= 0 ? 'You never got ahead tonight.'
    : 'At your best you were ' + bbPlain(r.high, r.bb) + ' up.';
  if (r.low < 0) out += ' At your worst, ' + bbPlain(Math.abs(r.low), r.bb) + ' down.';
  out += end > 0 ? ' You finished ' + bbPlain(end, r.bb) + ' up.'
    : end < 0 ? ' You finished ' + bbPlain(Math.abs(end), r.bb) + ' down.'
      : ' You finished level.';
  return out;
}

// Calls on the river, added up. One on its own is hindsight - the portal knows what the other man
// held, so a single call was simply winning or losing. A season of them says whether he pays off
// too much, and that is worth knowing.
function riverLine(w, you) {
  if (!w || !w.riverCalls) return '';
  var good = Math.round(w.riverGood * 10) / 10, need = Math.round(w.riverNeeded * 10) / 10;
  var out = (you ? 'You called ' : 'Called ') + w.riverCalls + ' bet' + (w.riverCalls === 1 ? '' : 's') + ' on the river and '
    + (you ? 'were' : 'was') + ' good in ' + good + '. At the prices paid, ' + need + ' had to be good to break even.';
  if (w.riverCalls < 8) return out + ' Too few to read anything into yet.';
  return out + (good >= need ? ' The calls have paid for themselves.' : ' That is paying off more often than the prices allow.');
}
// The same counts by where he sat: on the button, in the blinds, everywhere else.
var POS_WORD = { btn: 'On the button', blind: 'In the blinds', other: 'Everywhere else' };
function posRows(w) {

// ---- the groups a primary member plays with ----

// A name never goes into the code behind a button. The button carries an id and the name is

function restoreMember(id) {
